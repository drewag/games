const LEVEL_BY_ID = Object.fromEntries(LEVELS.map(l => [l.id, l]));
const worldLevels = (w) => LEVELS.filter(l => l.world === w);

const TILE_CHARS = new Set(['#', '=', 'B', '?', '1', '2', '3', '4', '5', ':', '%']);

function loadLevel(def) {
  const rows = def.rows;
  if (rows.length !== VIEW_TILES) console.warn(`Level "${def.name}" is ${rows.length} rows, expected ${VIEW_TILES}`);
  const cols = Math.max(...rows.map(r => r.length));
  const tiles = rows.map(r => {
    const a = [];
    for (let i = 0; i < cols; i++) a.push(TILE_CHARS.has(r[i]) ? r[i] : '.');
    return a;
  });
  const lv = {
    def, id: def.id, cols, rows: rows.length, tiles, theme: THEMES[WORLDS[def.world - 1].theme],
    start: { x: 1.5, y: rows.length - 2 }, snacks: [], checkpoints: [], goal: null, friend: null,
    enemyDefs: [], bumps: new Map(), spr: new Map(), total: 0, bossDone: false, hasBoss: false,
  };
  rows.forEach((r, j) => [...r].forEach((ch, i) => {
    if (ch === 'H') lv.start = { x: i + 0.5, y: j + 1 };
    else if (ch === 's') lv.snacks.push({ x: i + 0.5, y: j + 0.5, kind: SNACK_KINDS[hash(i, j) % 4], taken: false, home: true });
    else if (ch === 'C') lv.checkpoints.push({ x: i + 0.5, y: j + 1, on: false });
    else if (ch === 'G') lv.goal = { x: i + 0.5, y: j + 1 };
    else if (ch === 'F') lv.friend = { x: i + 0.5, y: j + 1, idx: WORLDS[def.world - 1].friend };
    else if ('dfbv~RX'.includes(ch)) {
      lv.enemyDefs.push({ ch, x: i + 0.5, y: j + 1 });
      if (ch === 'X') lv.hasBoss = true;
    }
    else if (ch === 'B') lv.total += 3;
  }));
  lv.total += lv.snacks.length + (lv.hasBoss ? BOSS_LOOT : 0);
  return lv;
}
const BOSS_LOOT = 10;

// ---------------------------------------------------------------------------
// Saving: one save per hero (spec/play.md)
// ---------------------------------------------------------------------------
const HERO_KEY = 'petquest-hero';
const saveKey = (who) => 'petquest-save-' + who;
function loadSave(who) {
  let s = null;
  try { s = JSON.parse(localStorage.getItem(saveKey(who))); } catch (e) { /* fresh */ }
  return Object.assign({ friends: 0, done: {}, snacks: {}, cp: null }, s || {});
}
function writeSave() {
  try { localStorage.setItem(saveKey(G.hero), JSON.stringify(G.save)); } catch (e) { /* storage full or off */ }
}
const SAVES = { ruby: loadSave('ruby'), zach: loadSave('zach') };
const isDone = (save, id) => !!save.done[id];
function worldUnlocked(save, w) { return w === 1 || worldLevels(w - 1).every(l => isDone(save, l.id)); }
function levelUnlocked(save, def) {
  if (!worldUnlocked(save, def.world)) return false;
  const prev = worldLevels(def.world).filter(l => l.n < def.n);
  return prev.every(l => isDone(save, l.id));
}
const friendsMet = () => (G.save ? Math.min(FRIENDS.length, G.save.friends) : 0);
const has = (ability) => friendsMet() >= ({ hop: 1, dig: 2, pound: 3, cling: 4, float: 5 })[ability];

// ---------------------------------------------------------------------------
// Game state
// ---------------------------------------------------------------------------
const G = {
  state: 'select',
  hero: ['ruby', 'zach'].includes(localStorage.getItem(HERO_KEY)) ? localStorage.getItem(HERO_KEY) : 'ruby',
  save: null, world: 1,
  time: 0, buttons: [], parts: [], pops: [],
  lv: null, h: null, cam: { x: 0, y: 0, look: 0 }, run: null, enemies: [], loose: [], items: [],
  trail: [], follower: null, freeze: 0, meet: null, finish: 0, dying: 0, shake: 0, intro: 0, tally: null,
};
G.save = SAVES[G.hero];

function chooseHero(who) {
  G.hero = who;
  G.save = SAVES[who];
  localStorage.setItem(HERO_KEY, who);
  // Pick the latest unlocked world on the map.
  G.world = 1;
  for (let w = 1; w <= WORLDS.length; w++) if (worldUnlocked(G.save, w) && worldLevels(w).length) G.world = w;
  G.state = 'map';
}

function startLevel(id, fromCheckpoint = true) {
  const def = LEVEL_BY_ID[id];
  if (together()) {
    // Together, both start at the beginning: checkpoints are each iPad's own.
    if (net.host) { net.run++; send({ t: 'start', id, run: net.run }); }
    Object.assign(net.other, { inLevel: true, done: false, quit: false, snacks: 0, p: null });
    fromCheckpoint = false;
  }
  G.lv = loadLevel(def);
  G.world = def.world;
  const lv = G.lv;
  let s = lv.start;
  const cp = fromCheckpoint && G.save.cp && G.save.cp.id === id ? G.save.cp : null;
  if (cp) {
    s = { x: cp.x, y: cp.y };
    for (const c of lv.checkpoints) if (Math.abs(c.x - cp.x) < 1) c.on = true;
  }
  G.run = { hearts: 3, snacks: 0, zoom: 0, cp: { x: s.x, y: s.y } };
  G.h = makeHero(s.x, s.y);
  G.parts = []; G.pops = []; G.loose = []; G.items = [];
  G.freeze = 0; G.meet = null; G.finish = 0; G.dying = 0; G.shake = 0; G.tally = null;
  G.intro = 2.2;
  spawnEnemies();
  G.trail = [];
  G.follower = friendsMet() > 0 ? { idx: friendsMet() - 1, x: s.x - 1, y: s.y, face: 1, moving: false, phase: 0 } : null;
  G.state = 'play';
  pointers.clear();
  snapCamera();
}

function makeHero(x, y) {
  const [bw, bh] = SIDE[G.hero].box;
  return {
    x, y, vx: 0, vy: 0, w: bw / TILE, hh: bh / TILE,
    face: 1, ground: true, coyote: 0, buffer: 0, jumping: false, bounce: false,
    phase: 0, safe: { x, y }, blink: 0, landSq: 0, lock: 0,
    pound: null, poundT: 0, cling: 0, digT: 0, floating: false, wallCoyote: 0,
  };
}

function spawnEnemies() {
  G.enemies = G.lv.enemyDefs.map(makeEnemy);
}

function makeEnemy(d) {
  const base = { type: d.ch, x: d.x, y: d.y, x0: d.x, y0: d.y, vx: 0, vy: 0, dir: -1, t: rand(0, 1), alive: true, awake: false, ground: true };
  switch (d.ch) {
    case 'd': return Object.assign(base, { kind: 'dust', w: 0.7, hh: 0.62, speed: 1.6, roll: 0 });
    case 'f': return Object.assign(base, { kind: 'flea', w: 0.5, hh: 0.45, hopT: rand(0.8, 1.6) });
    case 'b': return Object.assign(base, { kind: 'bubble', w: 0.7, hh: 0.7, y: d.y - 0.15, fly: true });
    case 'v': return Object.assign(base, { kind: 'vroomba', w: 0.95, hh: 0.42, state: 'pause', stateT: 1 });
    case '~': return Object.assign(base, { kind: 'sprinkler', w: 0.5, hh: 0.42, harmless: true, spray: 0 });
    case 'R': return Object.assign(base, { kind: 'raccoon', w: 0.7, hh: 0.72, carry: 0, state: 'walk', stateT: 0, target: null });
    case 'X': {
      const w = G.lv.def.world;
      return Object.assign(base, { kind: 'bandit', w: 1.0, hh: 1.2, hp: 3, state: 'wait', stateT: 0,
        speed: 2.4 + 0.35 * (w - 1), hopEvery: Math.max(1.4, 2.8 - 0.25 * (w - 1)), boss: true });
    }
  }
  return base;
}

// ---------------------------------------------------------------------------
// Playing together: two iPads in one level (spec/play.md,
// spec/details/network.md). They meet through PeerJS's free public server with
// a four-letter room code, then talk directly. The host (the iPad that made
// the room) runs the enemies and picks the levels.
// ---------------------------------------------------------------------------
const ROOM_PREFIX = 'pet-quest-room-';
const CODE_LETTERS = 'ABCDEFGHJKMNPQRSTUVWXYZ'; // no I, L or O
const net = {
  peer: null, host: false, code: '', conn: null, heard: 0, sent: 0,
  other: null,  // the other hero: { hero, p, inLevel, done, quit, snacks, x, y, fx, fy }
  run: 0,       // which level start the in-level messages belong to
  lootId: 0,
  view: null, msg: '', typed: '', // the room panel
};
const r2 = (v) => Math.round(v * 100) / 100;
const isGuest = () => !net.host && !!net.conn;
const together = () => !!net.other;
const otherName = () => (net.other ? SIDE[net.other.hero].name : '');
const note = (text) => { G.note = { text, t: 3 }; };

function send(msg) { if (net.conn && net.conn.open) net.conn.send(msg); }
// In-level messages carry the level start they belong to.
function sendLv(msg) { if (together()) { msg.r = net.run; send(msg); } }

function makeRoom() {
  leaveRoom();
  net.host = true;
  net.code = [...Array(4)].map(() => CODE_LETTERS[Math.floor(Math.random() * CODE_LETTERS.length)]).join('');
  net.view = 'waiting';
  net.peer = new Peer(ROOM_PREFIX + net.code);
  net.peer.on('connection', acceptGuest);
  net.peer.on('error', (e) => (e.type === 'unavailable-id' ? makeRoom() : netError(e)));
}

function listen(c) {
  c.on('data', (m) => { if (c === net.conn) onMessage(m); });
  c.on('close', () => { if (c === net.conn) otherLeft(); });
  c.on('error', () => { if (c === net.conn) otherLeft(); });
}

function joinRoom(code) {
  leaveRoom();
  net.code = code;
  net.view = 'joining';
  net.peer = new Peer();
  net.peer.on('open', () => {
    const c = net.peer.connect(ROOM_PREFIX + code, { reliable: true });
    c.on('open', () => { net.conn = c; net.heard = performance.now(); send({ t: 'hello', hero: G.hero, friends: G.save.friends }); });
    listen(c);
  });
  net.peer.on('error', netError);
}

function netError(e) {
  const msg = {
    'peer-unavailable': `There's no room called ${net.code}. Check the code and try again.`,
    busy: "That room is in a level right now. Try again when they're back on the map.",
    full: 'That room already has two heroes.',
  }[e.type] || (['network', 'server-error', 'socket-error'].includes(e.type)
    ? "Couldn't reach the room server. Check the Wi-Fi and try again."
    : 'Something went wrong connecting. Try again.');
  leaveRoom();
  net.view = 'error';
  net.msg = msg;
}

function leaveRoom() {
  send({ t: 'bye' });
  const c = net.conn, p = net.peer;
  Object.assign(net, { peer: null, host: false, conn: null, other: null, code: '', view: null });
  if (c) c.close();
  if (p) p.destroy();
  if (G.state === 'wait') G.state = 'map';
}

// Host: a second iPad knocks. Only one at a time, and not mid-level.
function acceptGuest(c) {
  c.on('open', () => {
    const why = net.conn ? 'full' : (G.state === 'play' || G.state === 'tally') ? 'busy' : null;
    if (why) { c.send({ t: 'no', why }); setTimeout(() => c.close(), 500); return; }
    net.conn = c;
    net.heard = performance.now();
  });
  listen(c);
}

function newOther(hero, friends = 0) {
  return { hero, friends, p: null, inLevel: false, done: false, quit: false, snacks: 0, x: 0, y: 0, fx: 0, fy: 0 };
}

// The other iPad left or went quiet. A host keeps the room open for someone
// else; a guest carries on alone, running the enemies itself.
function otherLeft() {
  const name = otherName();
  if (net.host) {
    const c = net.conn;
    net.conn = null; net.other = null;
    if (c) c.close();
    if (name) note(`${name} left`);
  } else {
    leaveRoom();
    note('The room closed');
  }
}

function onMessage(m) {
  net.heard = performance.now();
  if (m.r !== undefined && m.r !== net.run) return; // from an earlier level
  const lv = G.lv;
  const inLevel = lv && (G.state === 'play' || G.state === 'tally');
  switch (m.t) {
    case 'hello': {
      // Two people can't be the same hero: a clash gets the other one.
      const hero = m.hero === G.hero || !HEROES.includes(m.hero) ? HEROES.find((h) => h !== G.hero) : m.hero;
      net.other = newOther(hero, m.friends);
      net.view = null;
      send({ t: 'room', host: G.hero, you: hero, friends: G.save.friends });
      SFX.friend();
      note(`${SIDE[hero].name} joined!`);
      break;
    }
    case 'room':
      net.other = newOther(m.host, m.friends);
      G.hero = m.you; G.save = SAVES[m.you];
      net.view = null;
      G.state = 'wait';
      SFX.friend();
      break;
    case 'no': netError({ type: m.why }); break;
    case 'start': net.run = m.run; net.view = null; startLevel(m.id); break;
    case 'lobby': if (G.state === 'play' || G.state === 'tally') { G.state = 'wait'; pointers.clear(); } break;
    case 's': onState(m); break;
    case 'take': {
      const s = inLevel && lv.snacks[m.i];
      if (s && !s.taken) { s.taken = true; if (onScreen(s.x)) burst(s.x, s.y, ['#ffffff', '#d8d4dc'], 4); }
      break;
    }
    case 'takel': if (inLevel) G.loose = G.loose.filter((s) => s.id !== m.id); break;
    case 'loot':
      if (inLevel) for (const [id, kind, vx, vy] of m.list) G.loose.push({ id, kind, x: m.x, y: m.y, vx, vy, w: 0.4, hh: 0.4, t: 0, ground: false });
      break;
    case 'box': if (inLevel) remoteBox(m.tx, m.ty); break;
    case 'tile': if (inLevel) remoteTile(m.tx, m.ty); break;
    case 'kill': { const e = inLevel && G.enemies[m.i]; if (e && e.alive) defeat(e, m.text, true); break; }
    case 'bhit': { const e = inLevel && G.enemies[m.i]; if (e && e.alive && e.boss && e.state === 'run') banditHit(e); break; }
    case 'boss': {
      if (!inLevel) break;
      const e = G.enemies.find((x) => x.boss);
      if (e) { e.state = 'flee'; e.lockT = G.time + 5; }
      bossBeaten(e);
      break;
    }
    case 'done':
      if (net.other) Object.assign(net.other, { done: true, inLevel: false, snacks: m.snacks, quit: !!m.quit });
      break;
    case 'bye': otherLeft(); break;
  }
}

// The other hero bumped a box: it's used up here too, but the snacks were theirs.
function remoteBox(tx, ty) {
  const c = tileAt(tx, ty);
  if (c !== 'B' && c !== '?') return;
  G.lv.bumps.set(`${tx},${ty}`, 0.18);
  setTile(tx, ty, 'u');
  if (onScreen(tx)) SFX.box();
  if (c === 'B') for (let i = 0; i < 3; i++) {
    G.items.push({ kind: SNACK_KINDS[(tx + i) % 4], x: tx + 0.5 + (i - 1) * 0.35, y: ty, vy: -9 - i * 1.5, vx: (i - 1) * 1.2, t: 0, snack: true });
  }
}

// The other hero dug through soft dirt or smashed a cracked block.
function remoteTile(tx, ty) {
  const c = tileAt(tx, ty);
  if (c !== ':' && c !== '%') return;
  setTile(tx, ty, '.');
  burst(tx + 0.5, ty + 0.5, c === ':' ? ['#7a5230', '#5c3c22', '#9a6a40'] : ['#b8b2aa', '#8a847c', '#ffffff'], 10);
  if (onScreen(tx)) (c === ':' ? SFX.dig : SFX.smash)();
}

// What our hero looks like right now, for the other iPad to draw:
// [x, y, pose, frame, flip, rot, blink, zoom, floating, snacks, out,
//  follower idx, follower x, y, face, frame]
function heroNetState() {
  const h = G.h, f = G.follower, ps = heroPose(h);
  const out = G.state !== 'play' || G.dying > 0 ? 1 : 0;
  return [r2(h.x), r2(h.y), ps.pose, ps.frame, ps.flip ? 1 : 0, r2(ps.rot), h.blink > 0 ? 1 : 0, G.run.zoom > 0 ? 1 : 0,
    h.floating ? 1 : 0, G.run.snacks, out,
    f ? f.idx : -1, f ? r2(f.x) : 0, f ? r2(f.y) : 0, f ? f.face : 1, f && f.moving ? 1 + (Math.floor(f.phase) % 2) : 0];
}

function onState(m) {
  const o = net.other;
  if (!o) return;
  const p = m.p;
  // Snap the first time and after a teleport (respawn); otherwise glide.
  if (!o.p || p[10] || Math.abs(p[0] - o.x) > 3 || Math.abs(p[1] - o.y) > 3) { o.x = p[0]; o.y = p[1]; o.fx = p[12]; o.fy = p[13]; }
  o.p = p;
  o.snacks = p[9];
  if (m.en && isGuest() && G.lv && (G.state === 'play' || G.state === 'tally')) applyEnemies(m.en);
}

// Guest: the host's enemies. Any enemy missing from the list is gone.
function applyEnemies(list) {
  const seen = new Set();
  for (const [i, x, y, vx, vy, dir, t, ground, st, hp, carry, spray] of list) {
    const e = G.enemies[i];
    if (!e || !e.alive) continue;
    seen.add(i);
    if (e.nx === undefined || Math.abs(x - e.x) > 3 || Math.abs(y - e.y) > 3) { e.x = x; e.y = y; }
    Object.assign(e, { nx: x, ny: y, vx, vy, dir, t, ground: !!ground, carry, awake: true });
    if (e.kind === 'sprinkler') {
      if (!e.spray && spray && Math.abs(e.x - G.h.x) < viewTiles().vw) SFX.splash();
      e.spray = spray;
    }
    if (st && G.time >= (e.lockT || 0)) {
      if (e.boss && e.state === 'wait' && st === 'taunt') {
        G.banner = { text: 'Bandit!', sub: 'Stomp him three times!', t: 2.2 };
        SFX.boss();
      }
      e.state = st;
    }
    if (e.boss) e.hp = hp;
  }
  G.enemies.forEach((e, i) => { if (!seen.has(i)) e.alive = false; });
}

// The other hero glides toward where they last said they were.
function updateOther(dt) {
  const o = net.other;
  if (!o || !o.p) return;
  const k = Math.min(1, dt * 15);
  o.x += (o.p[0] - o.x) * k; o.y += (o.p[1] - o.y) * k;
  o.fx += (o.p[12] - o.fx) * k; o.fy += (o.p[13] - o.fy) * k;
}

// About 15 times a second while in a level: where our hero is, and (host)
// every enemy. A little "hi" otherwise, so silence means someone's gone.
function netTick(now) {
  if (!net.conn) return;
  if (now - net.heard > 6000) { otherLeft(); return; }
  const inLevel = G.lv && (G.state === 'play' || G.state === 'tally');
  if (now - net.sent < (inLevel ? 66 : 1000)) return;
  net.sent = now;
  if (!inLevel || !together()) { send({ t: 'hi' }); return; }
  const msg = { t: 's', p: heroNetState() };
  if (net.host) {
    msg.en = [];
    G.enemies.forEach((e, i) => {
      if (e.alive) msg.en.push([i, r2(e.x), r2(e.y), r2(e.vx), r2(e.vy), e.dir, r2(e.t), e.ground ? 1 : 0, e.state || 0, e.hp || 0, e.carry || 0, r2(e.spray || 0)]);
    });
  }
  sendLv(msg);
}

// Leaving a level by the back button. The host takes the guest along; the
// guest drops out of this level and waits for the next.
function leaveLevel() {
  pointers.clear();
  if (isGuest() && together()) {
    sendLv({ t: 'done', snacks: G.run.snacks, quit: true });
    G.state = 'wait';
    return;
  }
  toLevels('levels');
}
function toLevels(state) {
  if (net.host && together()) send({ t: 'lobby' });
  G.state = state;
}

// ---------------------------------------------------------------------------
// Tiles and collision
// ---------------------------------------------------------------------------
function tileAt(tx, ty) {
  const lv = G.lv;
  if (tx < 0 || tx >= lv.cols) return '#'; // the level's ends are walls
  if (ty < 0 || ty >= lv.rows) return '.';
  return lv.tiles[ty][tx];
}
const isFriendBlock = (c) => c >= '1' && c <= '5';
function isSolid(c) {
  if (c === '#' || c === 'B' || c === '?' || c === 'u' || c === ':' || c === '%') return true;
  if (isFriendBlock(c)) return friendsMet() >= +c;
  return false;
}
const isOneWay = (c) => c === '=';
const standable = (c) => isSolid(c) || isOneWay(c);

function setTile(tx, ty, c) {
  G.lv.tiles[ty][tx] = c;
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) G.lv.spr.delete(`${tx + dx},${ty + dy}`);
}

const EPS = 1e-4;

// Moves a body (x = center, y = feet) through the tiles. Returns what it hit.
function moveBody(b, dt, nudge = false) {
  const res = { wall: 0, landed: false, ceiling: null };
  // Horizontal
  b.x += b.vx * dt;
  const top = b.y - b.hh, bot = b.y - EPS;
  const ty0 = Math.floor(top), ty1 = Math.floor(bot);
  if (b.vx > 0) {
    const tx = Math.floor(b.x + b.w / 2);
    for (let ty = ty0; ty <= ty1; ty++) if (isSolid(tileAt(tx, ty))) { b.x = tx - b.w / 2 - EPS; b.vx = 0; res.wall = 1; break; }
  } else if (b.vx < 0) {
    const tx = Math.floor(b.x - b.w / 2);
    for (let ty = ty0; ty <= ty1; ty++) if (isSolid(tileAt(tx, ty))) { b.x = tx + 1 + b.w / 2 + EPS; b.vx = 0; res.wall = -1; break; }
  }

  // Vertical
  const prevBottom = b.y;
  b.y += b.vy * dt;
  b.ground = false;
  const tx0 = Math.floor(b.x - b.w / 2 + EPS), tx1 = Math.floor(b.x + b.w / 2 - EPS);
  if (b.vy >= 0) {
    const ty = Math.floor(b.y);
    for (let tx = tx0; tx <= tx1; tx++) {
      const c = tileAt(tx, ty);
      if (isSolid(c) || (isOneWay(c) && !b.dropThrough && prevBottom <= ty + 0.002)) {
        b.y = ty;
        res.landed = b.vy;
        b.vy = 0; b.ground = true;
        break;
      }
    }
  } else {
    const ty = Math.floor(b.y - b.hh);
    const hits = [];
    for (let tx = tx0; tx <= tx1; tx++) if (isSolid(tileAt(tx, ty))) hits.push(tx);
    if (hits.length) {
      // Clipped a corner by a little: slide around it instead of bonking.
      const left = b.x - b.w / 2, right = b.x + b.w / 2;
      if (nudge && hits.length === 1 && hits[0] === tx0 && hits[0] + 1 - left < 0.3 && !isSolid(tileAt(tx0 + 1, ty))) {
        b.x = hits[0] + 1 + b.w / 2 + EPS;
      } else if (nudge && hits.length === 1 && hits[0] === tx1 && right - hits[0] < 0.3 && !isSolid(tileAt(tx1 - 1, ty))) {
        b.x = hits[0] - b.w / 2 - EPS;
      } else {
        b.y = ty + 1 + b.hh;
        b.vy = 0;
        res.ceiling = { ty, hits };
      }
    }
  }
  return res;
}

function overlapsSolid(b) {
  const tx0 = Math.floor(b.x - b.w / 2 + EPS), tx1 = Math.floor(b.x + b.w / 2 - EPS);
  const ty0 = Math.floor(b.y - b.hh + EPS), ty1 = Math.floor(b.y - EPS);
  for (let ty = ty0; ty <= ty1; ty++) for (let tx = tx0; tx <= tx1; tx++) if (isSolid(tileAt(tx, ty))) return true;
  return false;
}

// ---------------------------------------------------------------------------
// Input: touch buttons by position (multi-touch), keys on a computer
// ---------------------------------------------------------------------------
const pointers = new Map(); // id -> { x, y, zone, keepDir }
const keys = {};
const input = { dir: 0, jump: false, jumpPressed: false, down: false, downPressed: false };
let lastJumpHeld = false, lastDownHeld = false;
const showDown = () => has('dig') || has('pound');

function layoutButtons() {
  const r = clamp(Math.min(H * 0.095, W * 0.07), 32, 70);
  const pad = 18;
  const cy = H - safeBottom - pad - r;
  L.btnR = r;
  L.left = { cx: safeLeft + pad + r, cy };
  L.right = { cx: safeLeft + pad + r * 3.4, cy };
  L.jump = { cx: W - safeRight - pad - r * 1.15, cy: cy - r * 0.15, r: r * 1.15 };
  L.down = { cx: L.jump.cx - L.jump.r - r * 1.35, cy: cy + r * 0.1, r: r * 0.9 };
  // Generous touch zones around the drawn buttons.
  L.dirZone = { x1: L.right.cx + r * 1.9, y0: H * 0.42, split: (L.left.cx + L.right.cx) / 2 };
  L.jumpZone = { x0: L.jump.cx - L.jump.r * 2.1, y0: H * 0.38, downSplit: (L.down.cx + L.down.r + L.jump.cx - L.jump.r) / 2 };
}

function zoneAt(x, y) {
  const d = L.dirZone, j = L.jumpZone;
  if (y >= d.y0 && x <= d.x1) return x < d.split ? 'left' : 'right';
  if (showDown() && y >= j.y0 && x >= L.down.cx - L.down.r * 1.6 && x < j.downSplit) return 'down';
  if (y >= j.y0 && x >= (showDown() ? j.downSplit : j.x0)) return 'jump';
  return null;
}

function updatePointer(e) {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  p.x = e.clientX; p.y = e.clientY;
  const z = zoneAt(p.x, p.y);
  // A thumb rolling from Left/Right onto Jump keeps running and jumps.
  if (z === 'jump' && (p.zone === 'left' || p.zone === 'right')) p.keepDir = p.zone === 'left' ? -1 : 1;
  else if (z !== 'jump') p.keepDir = 0;
  p.zone = z;
}

function readInput() {
  let left = !!(keys.ArrowLeft || keys.a || keys.A);
  let right = !!(keys.ArrowRight || keys.d || keys.D);
  let jump = !!(keys[' '] || keys.ArrowUp || keys.w || keys.W || keys.z || keys.x);
  let down = !!(keys.ArrowDown || keys.s || keys.S);
  for (const p of pointers.values()) {
    if (p.zone === 'left' || p.keepDir < 0) left = true;
    if (p.zone === 'right' || p.keepDir > 0) right = true;
    if (p.zone === 'jump') jump = true;
    if (p.zone === 'down') down = true;
  }
  input.dir = (right ? 1 : 0) - (left ? 1 : 0);
  input.jump = jump;
  if (jump && !lastJumpHeld) input.jumpPressed = true;
  lastJumpHeld = jump;
  input.down = down && showDown();
  if (input.down && !lastDownHeld) input.downPressed = true;
  lastDownHeld = input.down;
}

// ---------------------------------------------------------------------------
// Hero
// ---------------------------------------------------------------------------
const jumpHeight = () => (has('hop') ? FEEL.bunnyHop : FEEL.jumpHeld);

function updateHero(dt) {
  const h = G.h, run = G.run;
  const finishing = G.finish > 0;
  let dir = finishing ? 1 : input.dir;
  if (h.lock > 0) { h.lock -= dt; dir = h.lockDir || 0; }
  const runSpeed = run.zoom > 0 ? FEEL.zoomRun : FEEL.run;

  // Ground pound: hang for a moment, then drop straight down.
  if (h.pound === 'hang') {
    h.poundT -= dt; h.vx = 0; h.vy = 0;
    if (h.poundT <= 0) { h.pound = 'drop'; h.vy = FEEL.poundSpeed; }
    return;
  }

  // Run: reach full speed in accelTime, stop in stopTime.
  if (h.pound !== 'drop') {
    const target = dir * runSpeed;
    const accel = runSpeed / FEEL.accelTime, decel = FEEL.run / FEEL.stopTime;
    const turning = dir !== 0 && Math.sign(h.vx) === -dir;
    const rate = dir === 0 || turning ? decel : accel;
    h.vx = approach(h.vx, target, rate * dt);
    if (dir && h.lock <= 0) h.face = dir;
  }

  // Wall cling: only while pushing into a wall and falling.
  h.cling = 0;
  if (has('cling') && !h.ground && h.vy > 0 && dir !== 0 && !h.pound && h.lock <= 0) {
    const tx = Math.floor(h.x + dir * (h.w / 2 + 0.08));
    const mid = Math.floor(h.y - h.hh * 0.5), low = Math.floor(h.y - 0.1);
    if (isSolid(tileAt(tx, mid)) && isSolid(tileAt(tx, low))) {
      h.cling = dir;
      h.wallCoyote = 0.1; h.wallDir = dir;
      h.vy = Math.min(h.vy, FEEL.clingFall);
      if (Math.random() < dt * 20) G.parts.push({ x: h.x + dir * h.w / 2, y: h.y - h.hh * 0.3, vx: -dir * rand(0.5, 1.5), vy: rand(-1, 0.5), life: 0.3, max: 0.3, color: '#ffffff', size: 1.5 });
    }
  }
  h.wallCoyote = Math.max(0, h.wallCoyote - dt);

  // Jump: buffered press, coyote time after leaving a ledge.
  if (input.jumpPressed && !finishing) h.buffer = FEEL.buffer;
  else h.buffer = Math.max(0, h.buffer - dt);
  h.coyote = h.ground ? FEEL.coyote : Math.max(0, h.coyote - dt);
  if (h.buffer > 0 && h.coyote > 0 && !h.pound) {
    h.vy = -jumpSpeed(jumpHeight());
    h.buffer = 0; h.coyote = 0; h.jumping = true; h.bounce = false; h.ground = false;
    SFX.jump();
    dust(h.x, h.y, 4);
  } else if (h.buffer > 0 && h.wallCoyote > 0 && !h.ground) {
    // Wall jump: kick away from the wall.
    const away = -h.wallDir;
    h.vy = -jumpSpeed(FEEL.wallJump);
    h.vx = away * runSpeed;
    h.face = away; h.lock = 0.18; h.lockDir = away;
    h.buffer = 0; h.wallCoyote = 0; h.jumping = true; h.bounce = false;
    SFX.jump();
    dust(h.x - away * h.w / 2, h.y - h.hh / 2, 5);
  }

  // Start a ground pound
  if (has('pound') && input.downPressed && !h.ground && !h.pound) {
    h.pound = 'hang'; h.poundT = 0.12; h.vx = 0; h.vy = 0;
    return;
  }

  // Gravity. Letting go of Jump while rising doubles gravity, which makes a tap
  // reach jumpTap and a full hold reach jumpHeld.
  const g = gravityUp();
  let grav;
  if (h.pound === 'drop') grav = 0;
  else if (h.vy < 0) grav = ((input.jump && h.jumping) || h.bounce) ? g : g * (jumpHeight() / FEEL.jumpTap);
  else { grav = g * FEEL.fallMult; h.jumping = false; h.bounce = false; }
  let maxFall = FEEL.maxFall;
  h.floating = has('float') && !h.ground && h.vy > 0 && input.jump && !h.pound;
  if (h.floating) maxFall = FEEL.floatFall;
  if (h.pound === 'drop') maxFall = FEEL.poundSpeed;
  if (h.cling) maxFall = FEEL.clingFall;
  h.vy = Math.min(maxFall, h.vy + grav * dt);
  if ((h.floating || h.cling) && h.vy > maxFall) h.vy = maxFall;
  if (h.floating && Math.random() < dt * 12) sparkle(h.x + rand(-0.4, 0.4), h.y - rand(0, h.hh), [FRIENDS[4].c, '#ffffff']);

  // Substeps keep fast falls from tunnelling through thin platforms.
  const wasGround = h.ground;
  const steps = Math.ceil(Math.max(Math.abs(h.vx), Math.abs(h.vy)) * dt / 0.25) || 1;
  for (let i = 0; i < steps; i++) {
    const res = moveBody(h, dt / steps, true);
    if (res.ceiling) { headBump(res.ceiling); }
    if (res.landed !== false) {
      if (h.pound === 'drop') { if (poundLand()) continue; }
      else if (!wasGround && res.landed > 4) land(h);
    }
  }

  // Dig: hold Down on soft dirt.
  if (has('dig') && h.ground && input.down) {
    const ty = Math.floor(h.y + EPS);
    const cands = [Math.floor(h.x), Math.floor(h.x - h.w / 2 + 0.05), Math.floor(h.x + h.w / 2 - 0.05)];
    const tx = cands.find(x => tileAt(x, ty) === ':');
    if (tx !== undefined) {
      h.digT += dt;
      if (Math.random() < dt * 30) G.parts.push({ x: h.x + rand(-0.3, 0.3), y: h.y, vx: rand(-3, 3), vy: rand(-5, -2), life: 0.35, max: 0.35, color: pick(['#7a5230', '#5c3c22', '#9a6a40']), size: 2 });
      if (h.digT > 0.18) {
        h.digT = 0;
        setTile(tx, ty, '.');
        sendLv({ t: 'tile', tx, ty });
        SFX.dig();
        burst(tx + 0.5, ty + 0.5, ['#7a5230', '#5c3c22', '#9a6a40'], 10);
        if (tx !== Math.floor(h.x)) h.x = tx + 0.5;
      }
    } else h.digT = 0;
  } else h.digT = 0;

  if (h.ground && onSafeGround(h)) { h.safe.x = h.x; h.safe.y = h.y; }

  // Walk cycle timed to speed.
  if (h.ground && Math.abs(h.vx) > 0.3) h.phase = (h.phase + Math.abs(h.vx) * dt / STRIDE) % 1;
  else if (h.ground) h.phase = 0;

  h.blink = Math.max(0, h.blink - dt);
  h.landSq = Math.max(0, h.landSq - dt * 6);

  // Fell into a pit: costs a heart, back to the last safe ground.
  if (h.y - h.hh > G.lv.rows + 1) {
    SFX.fall();
    h.pound = null;
    if (!loseHeart()) {
      h.x = h.safe.x; h.y = h.safe.y; h.vx = 0; h.vy = 0; h.blink = FEEL.safeTime;
      if (G.follower) { G.follower.x = h.x - h.face; G.follower.y = h.y; }
      G.trail = [];
    }
  }
}

function poundLand() {
  const h = G.h;
  const ty = Math.floor(h.y + EPS);
  const tx0 = Math.floor(h.x - h.w / 2 + EPS), tx1 = Math.floor(h.x + h.w / 2 - EPS);
  let smashed = false;
  for (let tx = tx0; tx <= tx1; tx++) {
    if (tileAt(tx, ty) === '%') {
      setTile(tx, ty, '.');
      sendLv({ t: 'tile', tx, ty });
      burst(tx + 0.5, ty + 0.5, ['#b8b2aa', '#8a847c', '#ffffff'], 14);
      smashed = true;
    }
  }
  if (smashed) { SFX.smash(); G.shake = 0.15; h.vy = FEEL.poundSpeed; h.ground = false; return true; }
  h.pound = null;
  SFX.pound();
  G.shake = 0.2;
  dust(h.x, h.y, 10);
  h.landSq = 1;
  // Knock out enemies right next to the landing spot.
  for (const e of G.enemies) {
    if (!e.alive || e.boss || e.kind === 'sprinkler') continue;
    if (Math.abs(e.x - h.x) < 1.3 && Math.abs(e.y - h.y) < 0.6) defeat(e, 'Bonk!');
  }
  return false;
}

function land(h) {
  h.landSq = 1;
  SFX.land();
  dust(h.x, h.y, 6);
}

function headBump(ceil) {
  const h = G.h;
  // The box nearest the hero's head gets bumped.
  let best = null;
  for (const tx of ceil.hits) if (best === null || Math.abs(tx + 0.5 - h.x) < Math.abs(best + 0.5 - h.x)) best = tx;
  const c = tileAt(best, ceil.ty);
  if (c === 'B' || c === '?') bumpBox(best, ceil.ty, c);
  else SFX.bump();
}

function bumpBox(tx, ty, c) {
  const lv = G.lv;
  lv.bumps.set(`${tx},${ty}`, 0.18);
  setTile(tx, ty, 'u');
  sendLv({ t: 'box', tx, ty });
  SFX.box();
  const x = tx + 0.5, y = ty;
  if (c === 'B') {
    for (let i = 0; i < 3; i++) {
      G.items.push({ kind: SNACK_KINDS[(tx + i) % 4], x: x + (i - 1) * 0.35, y, vy: -9 - i * 1.5, vx: (i - 1) * 1.2, t: 0, snack: true });
    }
    addSnacks(3, x, y - 1);
  } else {
    const content = (lv.def.boxes && lv.def.boxes[`${tx},${ty}`]) || (G.run.hearts < 3 ? 'heart' : 'zoomies');
    G.items.push({ kind: content, x, y, vy: -5, vx: 0, t: 0, rise: true });
  }
  // Knock out an enemy standing on the box.
  for (const e of G.enemies) if (e.alive && !e.boss && Math.abs(e.x - x) < 0.8 && Math.abs(e.y - ty) < 0.2) defeat(e, 'Bonk!');
}

// Safe ground: both feet over solid ground, and no enemy close by, so a
// respawn never lands on an edge or next to danger.
function onSafeGround(h) {
  const ty = Math.floor(h.y + EPS);
  if (!standable(tileAt(Math.floor(h.x - h.w / 2), ty)) || !standable(tileAt(Math.floor(h.x + h.w / 2), ty))) return false;
  for (const e of G.enemies) if (e.alive && Math.abs(e.x - h.x) < 2.5 && Math.abs(e.y - h.y) < 2.5) return false;
  return true;
}

// Returns true if this was the last heart (and the restart has begun).
function loseHeart() {
  const run = G.run;
  run.hearts--;
  buzz(120);
  if (run.hearts <= 0) {
    run.hearts = 0;
    G.dying = 1.1;
    burst(G.h.x, G.h.y - G.h.hh / 2, ['#ffffff', '#d8d8d8', '#ffcf3f'], 22);
    SFX.poof();
    return true;
  }
  return false;
}

function hurt(from) {
  const h = G.h;
  if (h.blink > 0 || G.dying > 0 || G.finish > 0 || G.run.zoom > 0) return;
  SFX.hurt();
  pop('Ouch!', h.x, h.y - h.hh - 0.3, '#ff7b00');
  if (loseHeart()) return;
  h.blink = FEEL.safeTime;
  const away = from !== undefined ? Math.sign(h.x - from) || -h.face : -h.face;
  h.vx = away * 5; h.vy = -8; h.lock = 0.25; h.lockDir = 0; h.pound = null;
  G.shake = 0.15;
}

// Back to the last checkpoint with full hearts. Snacks stay collected.
function restartAtCheckpoint() {
  const run = G.run;
  run.hearts = 3;
  const h = G.h;
  Object.assign(h, makeHero(run.cp.x, run.cp.y));
  h.blink = FEEL.safeTime;
  G.items = [];
  // Playing together the level is shared, so it carries on as it is.
  if (!together()) { G.loose = []; spawnEnemies(); }
  G.trail = [];
  if (G.follower) { G.follower.x = h.x - 1; G.follower.y = h.y; }
  snapCamera();
}

function addSnacks(n, x, y) {
  const run = G.run;
  const before = run.snacks;
  run.snacks += n;
  if (Math.floor(run.snacks / 50) > Math.floor(before / 50)) {
    if (run.hearts < 3) {
      run.hearts++;
      SFX.heart();
      pop('+1 ♥', G.h.x, G.h.y - G.h.hh - 0.6, '#e53935');
    }
  }
  if (x !== undefined) pop('+' + n, x, y, '#1e4fa3');
}

// ---------------------------------------------------------------------------
// Enemies
// ---------------------------------------------------------------------------
function heroBox() { const h = G.h; return { x0: h.x - h.w / 2, x1: h.x + h.w / 2, y0: h.y - h.hh, y1: h.y }; }
function overlap(a, e, shrink = 0.08) {
  return a.x1 > e.x - e.w / 2 + shrink && a.x0 < e.x + e.w / 2 - shrink && a.y1 > e.y - e.hh + shrink && a.y0 < e.y - shrink;
}

// `remote`: the other iPad defeated it and told us.
function defeat(e, text = 'Poof!', remote = false) {
  e.alive = false;
  if (!remote || onScreen(e.x)) SFX.poof();
  burst(e.x, e.y - e.hh / 2, ['#ffffff', '#e8e8f0', '#ffcf3f'], 16);
  pop(text, e.x, e.y - e.hh - 0.3, '#ff4f9a');
  // The host drops the loot for both iPads.
  if (e.carry && !isGuest()) dropLoot(e.x, e.y - e.hh / 2, e.carry);
  if (!remote) sendLv({ t: 'kill', i: G.enemies.indexOf(e), text });
}

function dropLoot(x, y, n) {
  const list = [];
  for (let i = 0; i < n; i++) {
    const s = { id: ++net.lootId, kind: SNACK_KINDS[i % 4], x, y, vx: rand(-3, 3), vy: rand(-9, -5), w: 0.4, hh: 0.4, t: 0, ground: false };
    G.loose.push(s);
    list.push([s.id, s.kind, r2(s.vx), r2(s.vy)]);
  }
  sendLv({ t: 'loot', x: r2(x), y: r2(y), list });
}

function patrol(e, dt, speed) {
  e.vx = e.dir * speed;
  const res = moveBody(e, dt);
  if (res.wall) e.dir = -e.dir;
  else if (e.ground) {
    // turn at ledges
    const ax = e.x + e.dir * (e.w / 2 + 0.05);
    if (!standable(tileAt(Math.floor(ax), Math.floor(e.y + EPS)))) e.dir = -e.dir;
  }
}

function fall(e, dt) {
  e.vy = Math.min(FEEL.maxFall, e.vy + gravityUp() * FEEL.fallMult * dt);
}

// The heroes enemies react to: ours, and the other iPad's while it's in the level.
function heroesInLevel() {
  const list = [];
  if (G.state === 'play' && G.finish <= 0 && G.dying <= 0) list.push(G.h);
  const o = net.other;
  if (o && o.inLevel && o.p && !o.p[10]) list.push({ x: o.p[0], y: o.p[1] });
  return list;
}
function nearestHero(e) {
  let best = G.h, bd = Infinity;
  for (const h of heroesInLevel()) {
    const d = Math.abs(h.x - e.x) + Math.abs(h.y - e.y) * 0.5;
    if (d < bd) { bd = d; best = h; }
  }
  return best;
}

// Moves the enemies. Playing together, the host runs them and the guest
// follows what the host sends.
function updateEnemyAI(dt) {
  const { vw } = viewTiles();
  const near = (x, camX) => x < camX + vw + 1.5 && x > camX - 3;
  const o = net.other;
  for (const e of G.enemies) {
    if (!e.alive) continue;
    if (isGuest()) { followNet(e, dt); continue; }
    // Enemies start moving once they're nearly on someone's screen.
    if (!e.awake) {
      if (near(e.x, G.cam.x) || (o && o.inLevel && o.p && near(e.x, o.p[0] - vw * 0.42))) e.awake = true;
      else continue;
    }
    const h = nearestHero(e);
    e.t += dt;
    switch (e.kind) {
      case 'dust':
        fall(e, dt);
        patrol(e, dt, e.speed);
        e.roll += e.vx * dt / 0.35;
        break;
      case 'flea': {
        fall(e, dt);
        if (e.ground) {
          e.vx = 0;
          e.hopT -= dt;
          if (e.hopT <= 0 && Math.abs(h.x - e.x) < 9) {
            e.dir = Math.sign(h.x - e.x) || 1;
            e.vx = e.dir * 3.2; e.vy = -jumpSpeed(1.8);
            e.hopT = rand(1.6, 2.4);
          }
        }
        moveBody(e, dt);
        break;
      }
      case 'bubble':
        e.y = e.y0 - 0.15 - 1.6 * (0.5 - 0.5 * Math.cos(e.t * TAU / 3.2)) * 1.5;
        e.x = e.x0 + Math.sin(e.t * 2.1) * 0.12;
        break;
      case 'vroomba': {
        fall(e, dt);
        e.stateT -= dt;
        if (e.state === 'pause') {
          e.vx = 0;
          if (e.stateT <= 0) { e.state = 'charge'; e.stateT = 1.7; e.dir = Math.sign(h.x - e.x) || e.dir; }
          moveBody(e, dt);
        } else {
          patrol(e, dt, 4.6);
          if (Math.random() < dt * 25) dust(e.x - e.dir * 0.4, e.y, 1);
          if (e.stateT <= 0) { e.state = 'pause'; e.stateT = 1.0; }
        }
        break;
      }
      case 'sprinkler': {
        const cyc = e.t % 3.8;
        const was = e.spray;
        e.spray = cyc < 1.8 ? Math.min(1, cyc / 0.3) : 0;
        if (!was && e.spray && Math.abs(e.x - G.h.x) < vw) SFX.splash();
        break;
      }
      case 'raccoon': updateRaccoon(e, dt, h); break;
      case 'bandit': updateBandit(e, dt, h); break;
    }
    if (e.y > G.lv.rows + 2) e.alive = false;
  }
}

// Guest: glide toward where the host last said each enemy was.
function followNet(e, dt) {
  if (e.nx === undefined) return;
  e.t += dt;
  e.nx += e.vx * dt;
  if (!e.ground) e.ny += e.vy * dt;
  const k = Math.min(1, dt * 12);
  e.x += (e.nx - e.x) * k;
  e.y += (e.ny - e.y) * k;
  if (e.kind === 'dust') e.roll += e.vx * dt / 0.35;
}

// Our hero touching enemies and sprinkler water.
function touchEnemies() {
  const h = G.h;
  const hb = heroBox();
  for (const e of G.enemies) {
    if (!e.alive || G.dying > 0) continue;
    if (e.kind === 'sprinkler') {
      if (e.spray > 0) {
        // water arcs both ways; touching the drops hurts
        for (const s of [-1, 1]) for (let u = 0.08; u <= 1; u += 0.08) {
          const [wx, wy] = sprayPoint(e, s, u);
          if (wx > hb.x0 - 0.15 && wx < hb.x1 + 0.15 && wy > hb.y0 - 0.15 && wy < hb.y1) { hurt(e.x); break; }
        }
      }
      continue;
    }
    if (!overlap(hb, e)) continue;
    const falling = h.vy > 0 || h.pound === 'drop';
    // Stomp: falling onto the enemy's top half (generous on purpose).
    const stomp = falling && h.y <= e.y - e.hh * 0.45 + 0.2;
    if (G.run.zoom > 0 && !e.boss) { defeat(e, 'Zoom!'); continue; }
    if (e.boss) { banditTouch(e, stomp); continue; }
    if (stomp) {
      if (e.kind === 'vroomba' && h.pound !== 'drop') { stompBounce(FEEL.stomp); SFX.bump(); continue; }
      defeat(e, e.kind === 'bubble' ? 'Pop!' : 'Poof!');
      if (h.pound === 'drop') continue;
      stompBounce(e.kind === 'bubble' ? FEEL.bubbleStomp : FEEL.stomp);
      SFX.stomp();
    } else if (e.state !== 'dizzy') {
      hurt(e.x);
    }
  }
}

function stompBounce(height) {
  const h = G.h;
  // Holding jump bounces a full jump.
  h.vy = -jumpSpeed(input.jump ? Math.max(height, jumpHeight()) : height);
  h.bounce = true; h.jumping = input.jump; h.pound = null; h.ground = false;
}

function sprayPoint(e, s, u) {
  const reach = 2.6 * e.spray, height = 3.0 * e.spray;
  return [e.x + s * reach * u, e.y - e.hh - height * 4 * u * (1 - u) + u * e.hh * 0.8];
}

// Bandit's gang: grab snacks lying around and run off with them.
function updateRaccoon(e, dt, h) {
  fall(e, dt);
  e.stateT -= dt;
  if (e.state === 'walk') {
    // look for a snack nearby at about the same height
    let target = null, best = 6;
    for (const s of G.lv.snacks) {
      if (s.taken) continue;
      const d = Math.abs(s.x - e.x);
      if (d < best && Math.abs(s.y - (e.y - 0.5)) < 1.2) { best = d; target = s; }
    }
    if (target) {
      e.dir = Math.sign(target.x - e.x) || e.dir;
      patrol(e, dt, 2.6);
      if (Math.abs(target.x - e.x) < 0.4) {
        target.taken = true; target.stolen = true;
        sendLv({ t: 'take', i: G.lv.snacks.indexOf(target) });
        e.carry++;
        SFX.grab();
        pop('Mine!', e.x, e.y - e.hh - 0.3, '#5f5b66');
        e.state = 'run'; e.stateT = 2.2; e.dir = Math.sign(e.x - h.x) || 1;
      }
    } else patrol(e, dt, 1.4);
  } else {
    patrol(e, dt, 4.2);
    if (e.stateT <= 0) e.state = 'walk';
  }
}

// Bandit: runs back and forth and hops; three stomps and he drops the snacks.
function updateBandit(e, dt, h) {
  fall(e, dt);
  e.stateT -= dt;
  switch (e.state) {
    case 'wait':
      e.vx = 0; moveBody(e, dt);
      if (Math.abs(h.x - e.x) < 9) {
        // a moment to taunt before the chase, so nobody gets hit by surprise
        e.state = 'taunt'; e.stateT = 1.6; e.dir = Math.sign(h.x - e.x) || -1;
        G.banner = { text: 'Bandit!', sub: 'Stomp him three times!', t: 2.2 };
        SFX.boss();
      }
      break;
    case 'taunt':
      e.vx = 0;
      if (e.ground && Math.floor(e.stateT * 4) % 2 === 0) e.vy = -jumpSpeed(0.4);
      moveBody(e, dt);
      if (e.stateT <= 0) { e.state = 'run'; e.stateT = e.hopEvery; }
      break;
    case 'run':
      // he stays in his arena
      if ((e.x < e.x0 - 11 && e.dir < 0) || (e.x > e.x0 + 5 && e.dir > 0)) e.dir = -e.dir;
      patrol(e, dt, e.speed);
      if (e.stateT <= 0 && e.ground) {
        e.vy = -jumpSpeed(2 + Math.random() * 1.2);
        e.dir = Math.sign(h.x - e.x) || e.dir;
        e.stateT = e.hopEvery * rand(0.8, 1.2);
      }
      break;
    case 'dizzy':
      e.vx = 0; moveBody(e, dt);
      if (e.stateT <= 0) { e.state = 'run'; e.stateT = e.hopEvery; e.speed *= 1.15; e.dir = Math.sign(h.x - e.x) || 1; }
      break;
    case 'flee':
      e.vx = 7; e.x += e.vx * dt; e.y -= dt * 0.5;
      if (e.stateT <= 0) e.alive = false;
      break;
  }
}

function banditTouch(e, stomp) {
  if (e.state === 'flee' || e.state === 'wait' || e.state === 'taunt') return;
  if (stomp && e.state !== 'dizzy') {
    stompBounce(FEEL.stomp + 1);
    SFX.stomp();
    G.shake = 0.2;
    if (isGuest()) {
      // The host keeps Bandit's hearts. Look dizzy until it answers.
      sendLv({ t: 'bhit', i: G.enemies.indexOf(e) });
      e.state = 'dizzy'; e.lockT = G.time + 0.6;
      burst(e.x, e.y - e.hh, ['#ffcf3f', '#ffffff'], 14);
      pop('Hey!', e.x, e.y - e.hh - 0.4, '#5f5b66');
    } else banditHit(e);
  } else if (e.state !== 'dizzy') {
    hurt(e.x);
  }
}

// One stomp on Bandit, from either hero. Runs on the host (or alone).
function banditHit(e) {
  e.hp--;
  burst(e.x, e.y - e.hh, ['#ffcf3f', '#ffffff'], 14);
  if (e.hp <= 0) {
    e.state = 'flee'; e.stateT = 2.5;
    dropLoot(e.x, e.y - e.hh, BOSS_LOOT);
    sendLv({ t: 'boss' });
    bossBeaten(e);
  } else {
    e.state = 'dizzy'; e.stateT = 1.3;
    pop(['Hey!', 'Ow!'][2 - e.hp] || 'Hey!', e.x, e.y - e.hh - 0.4, '#5f5b66');
  }
}

function bossBeaten(e) {
  if (e) pop('Okay, okay!', e.x, e.y - e.hh - 0.5, '#5f5b66');
  G.lv.bossDone = true;
  SFX.friend();
  G.banner = { text: 'Bandit ran off!', sub: 'The garden gate is open', t: 2.4 };
}

// ---------------------------------------------------------------------------
// Snacks, items, checkpoints, friends, goal
// ---------------------------------------------------------------------------
function updatePickups(dt) {
  const h = G.h, hb = heroBox();
  const near = (x, y, r = 0.35) => x > hb.x0 - r && x < hb.x1 + r && y > hb.y0 - r && y < hb.y1 + r;
  G.lv.snacks.forEach((s, i) => {
    if (s.taken) return;
    if (near(s.x, s.y)) {
      s.taken = true;
      sendLv({ t: 'take', i });
      SFX.snack();
      burst(s.x, s.y, ['#ffcf3f', '#ffffff', '#f4a6c4'], 6);
      addSnacks(1);
    }
  });
  for (let i = G.loose.length - 1; i >= 0; i--) {
    const s = G.loose[i];
    if (s.t > 0.35 && near(s.x, s.y - 0.2)) {
      G.loose.splice(i, 1);
      sendLv({ t: 'takel', id: s.id });
      SFX.snack();
      addSnacks(1);
    }
  }
  // items popping out of boxes
  for (let i = G.items.length - 1; i >= 0; i--) {
    const it = G.items[i];
    it.t += dt;
    if (it.snack) {
      it.vy += 40 * dt; it.x += it.vx * dt; it.y += it.vy * dt;
      if (it.t > 0.5) { G.items.splice(i, 1); burst(it.x, it.y, ['#ffcf3f', '#ffffff'], 4); }
    } else {
      it.y += it.vy * dt; it.vy = approach(it.vy, 0, 14 * dt);
      if (it.t > 0.45) {
        G.items.splice(i, 1);
        if (it.kind === 'heart') {
          G.run.hearts = Math.min(3, G.run.hearts + 1);
          SFX.heart(); pop('+1 ♥', it.x, it.y, '#e53935');
        } else {
          G.run.zoom = FEEL.zoomTime;
          SFX.zoom(); pop('Zoomies!', it.x, it.y, '#ff9800');
        }
        burst(it.x, it.y, ['#ffcf3f', '#ffffff', '#ff7eb6'], 16);
      }
    }
  }
  // checkpoints
  for (const c of G.lv.checkpoints) {
    if (c.on || Math.abs(c.x - h.x) > 0.7 || h.y < c.y - 2) continue;
    c.on = true;
    G.run.cp = { x: c.x, y: c.y };
    G.save.cp = { id: G.lv.id, x: c.x, y: c.y };
    writeSave();
    SFX.check();
    pop('Checkpoint!', c.x, c.y - 2.4, '#2f8c3d');
    burst(c.x, c.y - 1.6, ['#ffcf3f', '#ffffff'], 14);
  }
  // meeting a friend
  const f = G.lv.friend;
  if (f && f.idx >= 0 && friendsMet() === f.idx && Math.abs(f.x - h.x) < 1.2 && Math.abs(f.y - h.y) < 1.6) meetFriend(f);
  // goal
  const goal = G.lv.goal;
  if (goal && !G.finish && h.x > goal.x - 0.6 && Math.abs(goal.y - h.y) < 3) {
    if (G.lv.hasBoss && !G.lv.bossDone) {
      if (h.x > goal.x - 0.6) { h.x = goal.x - 0.6 - EPS; h.vx = Math.min(0, h.vx); }
    } else {
      G.finish = 1.6;
      SFX.goal();
      burst(goal.x, goal.y - 1.5, ['#ff7eb6', '#ffcf3f', '#7ec8e3', '#ffffff'], 30);
    }
  }
}

function meetFriend(f) {
  const fr = FRIENDS[f.idx];
  G.save.friends = f.idx + 1;
  writeSave();
  G.meet = { idx: f.idx, t: 0 };
  G.freeze = 2.8;
  SFX.friend();
  burst(f.x, f.y - 0.5, ['#ff7eb6', '#ffcf3f', fr.c, '#ffffff'], 30);
  // Their blocks turn solid everywhere: sparkle on each one in this level.
  const digit = String(f.idx + 1);
  G.lv.tiles.forEach((r, ty) => r.forEach((c, tx) => {
    if (c === digit) { sparkle(tx + 0.5, ty + 0.5, [fr.c, '#ffffff', fr.d]); G.lv.spr.delete(`${tx},${ty}`); }
  }));
  G.lv.spr = new Map();
  // Don't leave the hero stuck inside a block that just went solid.
  const h = G.h;
  for (let i = 0; i < 16 && overlapsSolid(h); i++) h.y -= 0.25;
  G.follower = { idx: f.idx, x: f.x, y: f.y, face: -1, moving: false, phase: 0 };
  G.lv.friend = null;
}

function sparkle(x, y, colors) {
  for (let i = 0; i < 3; i++) {
    G.parts.push({ x: x + rand(-0.3, 0.3), y: y + rand(-0.3, 0.3), vx: rand(-1.5, 1.5), vy: rand(-3, -0.5),
      life: rand(0.4, 0.7), max: 0.7, color: pick(colors), size: rand(1.5, 2.5), star: true });
  }
}

// The most recently met friend follows a few steps behind.
function updateFollower(dt) {
  const f = G.follower, h = G.h;
  if (!f) return;
  G.trail.push({ x: h.x, y: h.y, face: h.face });
  if (G.trail.length > 90) G.trail.shift();
  const past = G.trail[Math.max(0, G.trail.length - 40)];
  const tx = past.x - past.face * 0.9;
  const ox = f.x;
  f.x += (tx - f.x) * Math.min(1, dt * 8);
  f.y += (past.y - f.y) * Math.min(1, dt * 12);
  const dx = f.x - ox;
  f.moving = Math.abs(dx) > dt * 0.6;
  if (f.moving) { f.face = Math.sign(dx); f.phase += dt * 9; }
}

// ---------------------------------------------------------------------------
// Camera, particles, update
// ---------------------------------------------------------------------------
function viewTiles() { return { vw: W / T, vh: H / T }; }

function cameraTarget() {
  const h = G.h, lv = G.lv, c = G.cam;
  const { vw, vh } = viewTiles();
  let x = h.x - vw * 0.42 + c.look * vw;
  x = lv.cols <= vw ? (lv.cols - vw) / 2 : clamp(x, 0, lv.cols - vw);
  let y = h.y - h.hh / 2 - vh * 0.55;
  y = lv.rows <= vh ? lv.rows - vh : clamp(y, 0, lv.rows - vh);
  return { x, y };
}
function snapCamera() { G.cam.look = 0; const t = cameraTarget(); G.cam.x = t.x; G.cam.y = t.y; }

function updateCamera(dt) {
  const c = G.cam;
  c.look = approach(c.look, G.h.face * 0.06, dt * 0.25);
  const t = cameraTarget();
  c.x += (t.x - c.x) * Math.min(1, dt * 10); // follows sideways
  c.y += (t.y - c.y) * Math.min(1, dt * 3);  // eases vertically
}

function dust(x, y, n) {
  for (let i = 0; i < n; i++) {
    G.parts.push({ x: x + rand(-0.3, 0.3), y: y - 0.05, vx: rand(-2, 2), vy: rand(-2.5, -0.5),
      life: rand(0.25, 0.45), max: 0.45, color: pick(['#ffffff', '#e8e0d0', '#d8cbb3']), size: rand(1.5, 3) });
  }
}
function burst(x, y, colors, n = 12) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), v = rand(2, 7);
    G.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 3, life: rand(0.35, 0.7), max: 0.7,
      color: pick(colors), size: rand(1.5, 3.5) });
  }
}
function pop(text, x, y, color) { G.pops.push({ text, x, y, color, life: 1 }); }

function update(dt) {
  G.time += dt;
  if (G.state === 'play') updatePlay(dt);
  // The host keeps the level going for the other hero after finishing.
  else if (G.state === 'tally' && net.host && together() && net.other.inLevel) updateWorld(dt);
  if (G.note) { G.note.t -= dt; if (G.note.t <= 0) G.note = null; }
  updateOther(dt);
  for (let i = G.parts.length - 1; i >= 0; i--) {
    const p = G.parts[i];
    p.life -= dt;
    p.vy += (p.star ? 3 : 14) * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    if (p.life <= 0) G.parts.splice(i, 1);
  }
  for (let i = G.pops.length - 1; i >= 0; i--) {
    const p = G.pops[i];
    p.life -= dt * 1.1;
    p.y -= 1.2 * dt;
    if (p.life <= 0) G.pops.splice(i, 1);
  }
}

// The shared part of a level: enemies, loose snacks, bumped boxes.
function updateWorld(dt) {
  for (const [k, v] of G.lv.bumps) { if (v - dt <= 0) G.lv.bumps.delete(k); else G.lv.bumps.set(k, v - dt); }
  updateEnemyAI(dt);
  for (let i = G.loose.length - 1; i >= 0; i--) {
    const s = G.loose[i];
    s.t += dt;
    if (!s.ground) { s.vy = Math.min(12, s.vy + 40 * dt); moveBody(s, dt); if (s.ground) s.vx = 0; }
    if (s.y > G.lv.rows + 1) G.loose.splice(i, 1);
  }
}

function updatePlay(dt) {
  readInput();
  G.intro = Math.max(0, G.intro - dt);
  G.shake = Math.max(0, G.shake - dt);
  if (G.banner) { G.banner.t -= dt; if (G.banner.t <= 0) G.banner = null; }
  // Playing together, the level keeps going while we pause.
  if ((G.freeze > 0 || G.dying > 0) && together()) updateWorld(dt);

  if (G.freeze > 0) {
    G.freeze -= dt;
    if (G.meet) G.meet.t += dt;
    if (G.freeze <= 0) G.meet = null;
    input.jumpPressed = false; input.downPressed = false;
    return;
  }
  if (G.dying > 0) {
    G.dying -= dt;
    if (G.dying <= 0) restartAtCheckpoint();
    input.jumpPressed = false; input.downPressed = false;
    return;
  }
  const run = G.run;
  if (run.zoom > 0) {
    run.zoom = Math.max(0, run.zoom - dt);
    if (Math.random() < dt * 30) sparkle(G.h.x + rand(-0.4, 0.4), G.h.y - rand(0, G.h.hh), ['#ffcf3f', '#ffffff', '#ff7eb6', '#7ec8e3']);
  }
  updateHero(dt);
  updateWorld(dt);
  if (G.dying <= 0) {
    touchEnemies();
    updatePickups(dt);
  }
  updateFollower(dt);
  updateCamera(dt);
  if (G.finish > 0) {
    G.finish -= dt;
    if (G.finish <= 0) finishLevel();
  }
  input.jumpPressed = false; input.downPressed = false;
}

function finishLevel() {
  const lv = G.lv, s = G.save;
  const first = !s.done[lv.id];
  s.done[lv.id] = true;
  const prevBest = s.snacks[lv.id] || 0;
  s.snacks[lv.id] = Math.max(prevBest, G.run.snacks);
  if (s.cp && s.cp.id === lv.id) s.cp = null;
  writeSave();
  sendLv({ t: 'done', snacks: G.run.snacks });
  G.tally = { snacks: G.run.snacks, total: lv.total, best: s.snacks[lv.id], newBest: G.run.snacks > prevBest && !first, t: 0, first, together: together() };
  G.state = 'tally';
}

// ---------------------------------------------------------------------------
// Tile art. Each tile is drawn from an 18x18 grid: its own 16x16 art plus a
// one-square border sampled from its neighbors, so the marker outline only
// appears on edges that face empty space.
// ---------------------------------------------------------------------------
const TILE_PAL_BASE = {
  T: '#e9b672', t: '#c98b52', U: '#9c6332', n: '#5a3214',
  Y: '#ffd04a', y: '#f5b324', O: '#e08a1a', o: '#b8650c', W: '#fff6d8',
  b: '#b07a4a', B: '#8a5a32',
  m: '#7a5230', M: '#5c3c22', q: '#9a6a40',
  s: '#c4bdb5', S: '#9a938b', x: '#5a524c',
  a: '#ffffff', A: '#c9c9d6', e: '#c48a4a', E: '#8a5a2c', i: '#f5c524', I: '#c99a10',
  j: '#f08a24', J: '#b8650c', v: '#a58ad8', V: '#6f50a8',
};
const FRIEND_LETTERS = { 1: ['a', 'A'], 2: ['e', 'E'], 3: ['i', 'I'], 4: ['j', 'J'], 5: ['v', 'V'] };
const PAW = ['.oo..oo.', '.oo..oo.', 'o..oo..o', 'o.oooo.o', '..oooo..', '...oo...'];
const STAR = ['...o...', '..ooo..', 'ooooooo', '.ooooo.', '..ooo..', '.oo.oo.', '.o...o.'];
const tileSpriteCache = new Map();

function groundArt(kind, tx, ty) {
  const topOpen = !isSolid(tileAt(tx, ty - 1)) || isFriendBlock(tileAt(tx, ty - 1)) || tileAt(tx, ty - 1) === '%';
  const rows = blank(TILE, TILE);
  const v = hash(tx, ty) % 4;
  if (kind === 'floor') {
    for (let j = 0; j < TILE; j++) for (let i = 0; i < TILE; i++) rows[j][i] = ((i >> 3) + (j >> 3)) % 2 ? 'D' : 'd';
    if (topOpen) for (let i = 0; i < TILE; i++) { rows[0][i] = 'L'; rows[1][i] = 'G'; rows[2][i] = 'G'; rows[3][i] = 'g'; if ((i + tx * 3) % 11 === 0) rows[1][i] = 'g'; }
    return rows;
  }
  if (kind === 'brick') {
    for (let j = 0; j < TILE; j++) for (let i = 0; i < TILE; i++) {
      const row = j >> 2, off = row % 2 ? 4 : 0;
      const mortar = j % 4 === 3 || (i + off) % 8 === 7;
      rows[j][i] = mortar ? 'g' : ((((i + off) >> 3) + row + v) % 3 === 0 ? 'D' : 'd');
    }
    if (topOpen) for (let i = 0; i < TILE; i++) rows[0][i] = 'L';
    return rows;
  }
  for (let j = 0; j < TILE; j++) for (let i = 0; i < TILE; i++) rows[j][i] = 'd';
  // speckles (four variants so tiles can share sprites)
  for (let n = 0; n < 5; n++) {
    const hv = hash(v * 31 + n, n * 17 + 5);
    const i = hv % 15, j = (hv >>> 8) % 15;
    rows[j][i] = (hv >>> 16) % 3 ? 'D' : 'k';
    if ((hv >>> 20) % 2) rows[j][i + 1] = rows[j][i];
  }
  if (topOpen) {
    const depth0 = kind === 'sand' ? 2 : 4;
    for (let i = 0; i < TILE; i++) {
      const depth = depth0 + ((i * 7 + v * 3) % 5 === 0 ? 1 : 0) + ((i + v) % 6 === 2 ? 1 : 0);
      for (let j = 0; j < depth; j++) rows[j][i] = j === 0 ? ((i + v) % 4 === 0 ? 'G' : 'L') : (j === depth - 1 ? 'g' : 'G');
    }
  }
  return rows;
}

function plankArt(tx, ty) {
  const rows = blank(TILE, TILE);
  const lEnd = tileAt(tx - 1, ty) !== '=', rEnd = tileAt(tx + 1, ty) !== '=';
  for (let i = 0; i < TILE; i++) { rows[0][i] = 'T'; rows[1][i] = 't'; rows[2][i] = 't'; rows[3][i] = 't'; rows[4][i] = 'U'; }
  if (lEnd) rows[2][2] = 'n';
  if (rEnd) rows[2][13] = 'n';
  if (!lEnd && tx % 2 === 0) { rows[1][0] = 'U'; rows[2][0] = 'U'; rows[3][0] = 'U'; }
  return rows;
}

function boxArt(c) {
  const used = c === 'u';
  const rows = blank(TILE, TILE);
  for (let j = 0; j < TILE; j++) for (let i = 0; i < TILE; i++) {
    const edge = i === 0 || j === 0 || i === 15 || j === 15;
    rows[j][i] = used ? (edge ? 'B' : 'b') : (edge ? 'O' : (i === 1 || j === 1 ? 'W' : 'Y'));
  }
  if (!used) {
    const icon = c === '?' ? STAR : PAW;
    const ox = Math.floor((16 - icon[0].length) / 2), oy = Math.floor((16 - icon.length) / 2) + 1;
    icon.forEach((r, j) => [...r].forEach((ch, i) => { if (ch === 'o') rows[oy + j][ox + i] = c === '?' ? 'o' : 'O'; }));
  } else {
    for (const [i, j] of [[3, 3], [12, 3], [3, 12], [12, 12]]) rows[j][i] = 'B';
  }
  return rows;
}

function friendArt(c) {
  const [f, d] = FRIEND_LETTERS[c];
  const rows = blank(TILE, TILE);
  for (let j = 0; j < TILE; j++) for (let i = 0; i < TILE; i++) {
    const edge = i === 0 || j === 0 || i === 15 || j === 15;
    rows[j][i] = edge || ((i === 2 || i === 13) && j > 1 && j < 14) || ((j === 2 || j === 13) && i > 1 && i < 14) ? d : f;
  }
  PAW.forEach((r, j) => [...r].forEach((ch, i) => { if (ch === 'o') rows[5 + j][4 + i] = d; }));
  return rows;
}

function softArt(tx, ty) {
  const rows = blank(TILE, TILE);
  for (let j = 0; j < TILE; j++) for (let i = 0; i < TILE; i++) {
    const hv = hash(tx * 16 + i, ty * 16 + j) % 9;
    rows[j][i] = hv === 0 ? 'M' : hv === 1 ? 'q' : 'm';
  }
  return rows;
}

function crackArt(tx, ty) {
  const rows = blank(TILE, TILE);
  for (let j = 0; j < TILE; j++) for (let i = 0; i < TILE; i++) rows[j][i] = (i === 0 || j === 0 || i === 15 || j === 15) ? 'S' : 's';
  const v = hash(tx, ty) % 2;
  const crack = v ? [[3, 2], [4, 3], [5, 4], [5, 5], [6, 6], [7, 7], [8, 7], [9, 8], [10, 9], [10, 10], [11, 11], [12, 12], [7, 8], [6, 9], [5, 10]]
    : [[12, 2], [11, 3], [10, 4], [10, 5], [9, 6], [8, 7], [7, 8], [6, 9], [6, 10], [5, 11], [4, 12], [9, 8], [10, 9], [11, 10]];
  for (const [i, j] of crack) rows[j][i] = 'x';
  return rows;
}

const tileFamily = (c, tx, ty) => {
  if (c === '#') return 'ground';
  if (c === '=') return 'plank';
  if (c === ':') return 'soft';
  if (isFriendBlock(c)) return isSolid(c) ? 'f' + c : null;
  if (c === 'B' || c === '?' || c === 'u' || c === '%') return 'box' + tx + ',' + ty; // each on its own
  return null;
};

function tileArt(tx, ty) {
  const c = tileAt(tx, ty);
  if (c === '#') return groundArt(G.lv.theme.ground, tx, ty);
  if (c === '=') return plankArt(tx, ty);
  if (c === 'B' || c === '?' || c === 'u') return boxArt(c);
  if (c === ':') return softArt(tx, ty);
  if (c === '%') return crackArt(tx, ty);
  if (isFriendBlock(c) && isSolid(c)) return friendArt(c);
  return null;
}

// Builds (or fetches) the sprite for a tile, cropped so it only overhangs its
// cell on sides that face empty space.
function tileSprite(tx, ty) {
  const lv = G.lv;
  const key = `${tx},${ty}`;
  const cached = lv.spr.get(key);
  if (cached !== undefined) return cached;
  const own = tileArt(tx, ty);
  if (!own) { lv.spr.set(key, null); return null; }
  const fam = tileFamily(tileAt(tx, ty), tx, ty);
  const g = blank(TILE + 2, TILE + 2);
  const same = (x, y) => y < lv.rows + 1 && tileFamily(tileAt(x, y), x, y) === fam;
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
    const art = (dx === 0 && dy === 0) ? own : (same(tx + dx, ty + dy) && ty + dy < lv.rows ? tileArt(tx + dx, ty + dy) : null);
    if (!art) continue;
    for (let j = 0; j < TILE; j++) for (let i = 0; i < TILE; i++) {
      const gx = 1 + dx * TILE + i, gy = 1 + dy * TILE + j;
      if (gx >= 0 && gx < TILE + 2 && gy >= 0 && gy < TILE + 2) g[gy][gx] = art[j][i];
    }
  }
  // The ground carries on below the bottom of the level.
  if (ty === lv.rows - 1 && fam === 'ground') for (let i = 0; i < TILE + 2; i++) if (g[TILE][i] !== '.') g[TILE + 1][i] = g[TILE][i];
  const cropL = same(tx - 1, ty), cropR = same(tx + 1, ty), cropT = same(tx, ty - 1), cropB = same(tx, ty + 1) || (ty === lv.rows - 1 && fam === 'ground');
  const gridKey = lv.theme.ground + (cropL ? 1 : 0) + (cropR ? 1 : 0) + (cropT ? 1 : 0) + (cropB ? 1 : 0) + g.map(r => r.join('')).join('');
  let out = tileSpriteCache.get(gridKey);
  if (!out) {
    const pal = Object.assign({}, TILE_PAL_BASE, lv.theme.pal);
    const full = makeSprite(g.map(r => r.join('')), P, pal);
    const p = AP, ow = full.ow;
    const x0 = cropL ? ow + p : p, x1 = cropR ? ow + 17 * p : 17 * p + 2 * ow;
    const y0 = cropT ? ow + p : p, y1 = cropB ? ow + 17 * p : 17 * p + 2 * ow;
    out = document.createElement('canvas');
    out.width = x1 - x0; out.height = y1 - y0;
    out.getContext('2d').drawImage(full, -x0, -y0);
    out.offX = x0 - (ow + p); out.offY = y0 - (ow + p); // device px
    tileSpriteCache.set(gridKey, out);
  }
  lv.spr.set(key, out);
  return out;
}

// ---------------------------------------------------------------------------
// Backgrounds: sky, sun or moon, clouds and parallax layers per theme
// ---------------------------------------------------------------------------
const BG_PAL = {
  e: '#ffd84a', E: '#ff9f43', w: '#ffffff', D: '#fff4c2', s: '#fff6a8', l: '#8f8fc8',
  J: '#3ba7d9', K: '#8fdcf5', j: '#ffe7c2', i: '#ffd9a8', P: '#ff7eb6', x: '#c98b52', '3': '#b1e0ff',
  c: '#f6f0e6', C: '#d9c7a8', r: '#e98a8a',
};
const SUN = ['..eee..', '.eeeee.', 'eeeeeee', 'eeeeeee', 'eeeeeee', '.eeeee.', '..eee..'];
const BIGSUN = ['....EEEE....', '..EEEEEEEE..', '.EEEEEEEEEE.', '.EEEEEEEEEE.', 'EEEEEEEEEEEE', 'EEEEEEEEEEEE',
  'EEEEEEEEEEEE', 'EEEEEEEEEEEE', '.EEEEEEEEEE.', '.EEEEEEEEEE.', '..EEEEEEEE..', '....EEEE....'];
const MOON = ['..DDDD.', '.DDD...', 'DDD....', 'DDD....', 'DDD....', '.DDD...', '..DDDD.'];
const CLOUD = ['...ww....', '.wwwwww..', 'wwwwwwwww', '.wwwwwww.'];

function hillRows(period, base, amp, seed, color, flip = false) {
  const h = base + amp * 2 + 2;
  const g = blank(period, h);
  for (let i = 0; i < period; i++) {
    const v = Math.round(base + amp * Math.sin(TAU * i / period + seed) + amp * 0.5 * Math.sin(TAU * 3 * i / period + seed * 2));
    for (let j = h - v; j < h; j++) g[flip ? h - 1 - j : j][i] = color;
  }
  return g.map(r => r.join(''));
}

function dripRows(period) {
  const g = blank(period, 10);
  for (let i = 0; i < period; i++) {
    const v = 1 + ((i * 7) % 5 === 0 ? 5 + (i % 3) : (i % 4 === 0 ? 2 : 1));
    for (let j = 0; j < v; j++) g[j][i] = 'r';
  }
  return g.map(r => r.join(''));
}

function kitchenRows() {
  // wallpaper stripes, a window with curtains and a shelf; repeats every 64
  const w = 64, h = 120;
  const g = blank(w, h);
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) g[j][i] = i % 6 === 0 ? 'i' : 'j';
  const wx = 18, wy = h - 38, ww = 15, wh = 12;
  for (let j = 0; j < wh; j++) for (let i = 0; i < ww; i++) g[wy + j][wx + i] = (i === 0 || j === 0 || i === ww - 1 || j === wh - 1 || i === 7 || j === 6) ? 'w' : '3';
  for (let j = -1; j < wh + 1; j++) { g[wy + j][wx - 2] = 'P'; g[wy + j][wx - 1] = 'P'; g[wy + j][wx + ww] = 'P'; g[wy + j][wx + ww + 1] = 'P'; }
  for (let i = -3; i < ww + 3; i++) g[wy - 2][wx + i] = 'x';
  // cupboards along the bottom
  for (let j = h - 14; j < h; j++) for (let i = 0; i < w; i++) g[j][i] = j === h - 14 ? 'x' : ((i % 16 === 0 || j === h - 13) ? 'C' : 'c');
  for (let i = 0; i < w; i += 16) { g[h - 8][i + 7] = 'x'; g[h - 8][i + 8] = 'x'; }
  return g.map(r => r.join(''));
}

function seaRows() {
  const w = 96, h = 8, g = blank(w, h);
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) g[j][i] = 'J';
  for (let n = 0; n < 30; n++) { const i = (n * 37) % w, j = 1 + (n * 5) % (h - 2); g[j][i] = 'K'; g[j][(i + 1) % w] = 'K'; }
  return g.map(r => r.join(''));
}

function drawBackground(theme, camX = 0) {
  const bandH = Math.ceil(H / theme.sky.length);
  theme.sky.forEach((b, i) => { ctx.fillStyle = b; ctx.fillRect(0, i * bandH, W, bandH + 1); });
  const B = P * 2; // background squares are chunkier
  const px = camX * T;
  const groundLine = H - 2 * T + (G.state === 'play' || G.state === 'tally' ? 0 : 0);

  if (theme.stars) {
    for (let n = 0; n < 40; n++) {
      const x = ((hash(n, 3) % 1000) / 1000 * W * 1.5 - px * 0.05) % (W * 1.5);
      const y = (hash(n, 7) % 1000) / 1000 * H * 0.6;
      const tw = Math.sin(G.time * 2 + n) > 0.6;
      ctx.fillStyle = n % 3 ? '#fff6a8' : '#8f8fc8';
      const s = B * (tw ? 1.5 : 1);
      ctx.fillRect(Math.round((x + W * 1.5) % (W * 1.5)), Math.round(y), s, s);
    }
  }
  if (theme.body) {
    const art = theme.body === 'moon' ? MOON : theme.body === 'bigsun' ? BIGSUN : SUN;
    const s = sprite('body-' + theme.body, art, B, BG_PAL);
    const y = theme.body === 'bigsun' ? H * 0.42 : safeTop + 90;
    ctx.drawImage(s, W - safeRight - sw(s) - 60, y, sw(s), sh(s));
  }
  if (theme.clouds) {
    const cs = sprite('cloud', CLOUD, B, BG_PAL);
    const span = W + sw(cs) * 2;
    for (let i = 0; i < 5; i++) {
      const cx = ((i / 5 * span + G.time * (6 + i * 3) - px * 0.15) % span + span) % span - sw(cs);
      ctx.drawImage(cs, Math.round(cx), Math.round(safeTop + H * (0.08 + 0.09 * ((i * 3) % 5))), sw(cs), sh(cs));
    }
  }
  for (const ly of theme.layers) {
    let rows, key, pal, raise = ly.raise || 0, color = ly.color, top = false;
    if (ly.kind === 'hills') { key = `hill${ly.period}-${ly.seed}-${color}`; rows = () => hillRows(ly.period, ly.base, ly.amp, ly.seed, 'r'); pal = { r: color }; }
    else if (ly.kind === 'drips') { key = 'drips' + color; rows = () => dripRows(ly.period); pal = { r: color }; top = true; }
    else if (ly.kind === 'kitchen') { key = 'kitchen'; rows = kitchenRows; pal = BG_PAL; }
    else if (ly.kind === 'sea') { key = 'sea'; rows = seaRows; pal = BG_PAL; color = '#3ba7d9'; }
    // Repeating art gets one wrapped column on each side before outlining, so
    // the copies join without a seam; that border is cropped off when drawn.
    const hs = sprite(key, () => rows().map(r => r[r.length - 1] + r + r[0]), B, pal);
    const p = Math.round(B * DPR), srcX = hs.ow + p, srcW = hs.width - 2 * hs.ow - 2 * p;
    const w = srcW / DPR;
    const y = top ? -hs.ow / DPR : Math.round(groundLine - sh(hs) + raise * B * 2);
    let x = -((px * ly.par) % w);
    if (x > 0) x -= w;
    for (; x < W; x += w) ctx.drawImage(hs, srcX, 0, srcW, hs.height, Math.round(x), y, w, sh(hs));
    if (!top) {
      // below the layer (seen down pits) keeps its color
      ctx.fillStyle = ly.kind === 'kitchen' ? '#f6f0e6' : color;
      ctx.fillRect(0, y + sh(hs) - hs.ow / DPR * 2, W, H);
    }
  }
}

// ---------------------------------------------------------------------------
// Drawing helpers
// ---------------------------------------------------------------------------
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// A wobbly pencil line, like the underline on the drawing.
function pencilLine(x1, y1, x2, y2, seed = 1, color = '#6d6a70', width = 2, dash = null) {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.lineCap = 'round';
  if (dash) ctx.setLineDash(dash);
  ctx.beginPath();
  const n = 24;
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    const x = x1 + (x2 - x1) * t;
    const y = y1 + (y2 - y1) * t + Math.sin(t * 17 + seed) * 1.2 + Math.sin(t * 41 + seed * 3) * 0.6;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.stroke();
  ctx.restore();
}

function outlinedText(text, x, y, size, fill, { font = TITLE_FONT, align = 'center', stroke = OUTLINE } = {}) {
  ctx.save();
  ctx.font = `900 ${size}px ${font}`;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  ctx.lineWidth = Math.max(3, size * 0.14);
  ctx.strokeStyle = stroke;
  ctx.strokeText(text, x, y);
  ctx.fillStyle = fill;
  ctx.fillText(text, x, y);
  ctx.restore();
}

function handText(text, x, y, size, color = '#3d3940', align = 'center') {
  ctx.save();
  ctx.font = `${size}px ${HAND_FONT}`;
  ctx.fillStyle = color;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  ctx.fillText(text, x, y);
  ctx.restore();
}

// "PET QUEST", each letter a bit tilted, like Snack Attack's title.
function drawTitle(cx, top, maxW, maxH) {
  const words = [['PET', '#ff7eb6'], ['QUEST', '#1e4fa3']];
  const size = Math.min(maxW / 6.2, maxH * 0.8, 96);
  ctx.save();
  ctx.font = `900 ${size}px ${TITLE_FONT}`;
  const spacing = size * 0.06;
  const wordW = (w) => [...w].reduce((a, ch) => a + ctx.measureText(ch).width + spacing, -spacing);
  const drawWord = (word, color, x, y, seed) => {
    let cx2 = x;
    [...word].forEach((ch, i) => {
      const lw = ctx.measureText(ch).width;
      const rot = (((i + seed) * 37) % 7 - 3) * 0.025;
      const dy = (((i + seed) * 53) % 5 - 2) * size * 0.02;
      ctx.save();
      ctx.translate(cx2 + lw / 2, y + dy);
      ctx.rotate(rot);
      outlinedText(ch, 0, 0, size, color);
      ctx.restore();
      cx2 += lw + spacing;
    });
  };
  const gap = size * 0.5;
  const w1 = wordW(words[0][0]), w2 = wordW(words[1][0]);
  const x0 = cx - (w1 + gap + w2) / 2;
  const y = top + size * 0.6;
  drawWord(words[0][0], words[0][1], x0, y + size * 0.12, 0);
  drawWord(words[1][0], words[1][1], x0 + w1 + gap, y - size * 0.12, 3);
  const bottom = y + size * 0.7;
  pencilLine(x0 - 10, bottom + size * 0.05, x0 + w1 + gap + w2 + 10, bottom - size * 0.35, 2);
  ctx.restore();
  return bottom + size * 0.2;
}

function drawPaper() {
  ctx.fillStyle = '#fbf8f1';
  ctx.fillRect(0, 0, W, H);
  const specks = [['#ff7eb6', 0.12, 0.2], ['#f08a24', 0.82, 0.12], ['#a58ad8', 0.9, 0.55],
                  ['#ff7eb6', 0.07, 0.7], ['#1e4fa3', 0.6, 0.35], ['#f3c623', 0.3, 0.88]];
  for (const [c, fx, fy] of specks) {
    ctx.fillStyle = c;
    ctx.globalAlpha = 0.35;
    ctx.beginPath();
    ctx.arc(fx * W, fy * H, 2.5, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function card(x, y, w, h, { fill = '#ffffff', border = OUTLINE, lw = 3, r = 18 } = {}) {
  ctx.save();
  ctx.fillStyle = OUTLINE;
  roundRect(x, y + 5, w, h, r);
  ctx.fill();
  ctx.fillStyle = fill;
  roundRect(x, y, w, h, r);
  ctx.fill();
  ctx.lineWidth = lw;
  ctx.strokeStyle = border;
  ctx.stroke();
  ctx.restore();
}

function button(label, x, y, w, h, color, action) {
  card(x, y, w, h, { fill: color, r: 14 });
  outlinedText(label, x + w / 2, y + h / 2, Math.min(28, h * 0.42), '#ffffff');
  G.buttons.push({ x, y, w, h, action });
}

const UI_PAL = { r: '#e53935', w: '#ffffff', l: '#7ec8e3', b: '#6b3a1e', k: '#2a2228', y: '#ffcf3f', g: '#9a96a0' };
const ICONS = {
  house: ['....r....', '...rrr...', '..rrrrr..', '.rrrrrrr.', 'rrrrrrrrr', '.wwwwwww.', '.wllwwww.', '.wllwbbw.', '.wwwwbbw.'],
  back: ['...k.....', '..kk.....', '.kkkkkkk.', 'kkkkkkkk.', '.kkkkkkk.', '..kk.....', '...k.....'],
  lock: ['..kkk..', '.k...k.', '.k...k.', 'yyyyyyy', 'yyykyyy', 'yyykyyy', 'yyyyyyy'],
  check: ['......k', '.....kk', 'k...kk.', 'kk.kk..', '.kkk...', '..k....'],
};

function iconButton(x, y, size, icon, action) {

function drawHomeButton() {
  const size = 52, x = safeLeft + 12, y = safeTop + 12;
