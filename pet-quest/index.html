const THIGH = 4.5, SHIN = 4.5;
const blank = (w, h) => Array.from({ length: h }, () => Array(w).fill('.'));

// 2-square-wide limb from (x0,y0) along angle (radians from straight down, + = forward)
function limb(g, x0, y0, ang, len, colorAt) {
  const steps = Math.ceil(len * 3);
  let x = x0, y = y0;
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    x = x0 + Math.sin(ang) * len * t;
    y = y0 + Math.cos(ang) * len * t;
    const c = colorAt(t);
    const xi = Math.round(x - 0.5), yi = Math.round(y);
    for (const dx of [0, 1]) if (g[yi] && xi + dx >= 0 && xi + dx < g[0].length) g[yi][xi + dx] = c;
  }
  return [x, y];
}

function stampRows(g, rows, ox, oy) {
  rows.forEach((r, j) => [...r].forEach((c, i) => { if (c !== '.' && g[oy + j]) g[oy + j][ox + i] = c; }));
}

// A side-view pose from joint angles. legs/arms are [far, near]; a leg is
// [thigh, shin] angles, an arm is one angle. Returns three layers (far limbs,
// body, near limbs) that are outlined separately. `shift` moves everything
// down; by default the lowest foot lands on the bottom row.
function sidePose(who, legs, arms, shift) {
  const d = SIDE[who];
  const W = 18, Hh = d.top.length + 12;
  const far = blank(W, Hh), body = blank(W, Hh), near = blank(W, Hh);
  const [hx, hy] = d.hip, [sx, sy] = d.shoulder;
  const ox = 1;
  const drawLeg = ([a1, a2], isFar) => {
    const g = isFar ? far : near;
    const col = isFar ? d.leg.far : d.leg.near;
    const [kx, ky] = limb(g, hx + ox + (isFar ? -1 : 0), hy, a1, THIGH, () => col);
    const sock = d.leg.sock[isFar ? 1 : 0];
    const [fx, fy] = limb(g, kx, ky, a2, SHIN, (u) => (u > 0.75 ? sock : col));
    const [toe, heel] = d.leg.shoe[isFar ? 1 : 0];
    const x = Math.round(fx - 0.5), y = Math.round(fy) + 1;
    for (let i = -1; i <= 2; i++) if (g[y]) g[y][x + i] = i === 2 ? toe : heel;
    if (g[y - 1]) { g[y - 1][x] = heel; g[y - 1][x + 1] = heel; }
    return y;
  };
  const drawArm = (a, isFar) => {
    const g = isFar ? far : near;
    const i = isFar ? 1 : 0;
    limb(g, sx + ox + (isFar ? -1 : 0), sy, a, d.arm.len, (u) =>
      u * d.arm.len < d.arm.sleeveLen ? d.arm.sleeve[i] : d.arm.hand[i]);
  };
  drawArm(arms[0], true);
  const f1 = drawLeg(legs[0], true);
  stampRows(body, d.top, ox, 0);
  const f2 = drawLeg(legs[1], false);
  drawArm(arms[1], false);
  if (shift === undefined) shift = Hh - 1 - Math.max(f1, f2);
  return [far, body, near].map((g) => {
    const out = blank(W, Hh);
    g.forEach((r, j) => r.forEach((c, i) => { if (c !== '.' && out[j + shift]) out[j + shift][i] = c; }));
    return out.map(r => r.join(''));
  });
}

// One walk frame at phase t in [0,1): each leg swings ±0.5 rad at the hip, the
// knee bends most while the leg swings forward, arms swing opposite their leg.
const TAU = Math.PI * 2;
function walkLeg(ph) {
  const thigh = 0.5 * Math.sin(TAU * ph);
  const knee = 0.15 + 0.9 * Math.pow(Math.max(0, Math.cos(TAU * ph)), 2);
  return [thigh, thigh - knee];
}
const walkArm = (ph) => -0.55 * Math.sin(TAU * ph) + 0.08;
const sideFrame = (who, t) =>
  sidePose(who, [walkLeg(t + 0.5), walkLeg(t)], [walkArm(t + 0.5), walkArm(t)]);

// Standing: legs straight, arms by the sides. Its shift is reused for the jump
// pose so the body doesn't jump around in the sprite when the legs tuck.
function idleShift(who) {
  const Hh = SIDE[who].top.length + 12;
  return Hh - 1 - Math.round(SIDE[who].hip[1] + THIGH + SHIN + 1);
}
const idlePose = (who) => sidePose(who, [[0.04, 0.0], [-0.04, -0.06]], [0.12, 0.05], idleShift(who));
// Jump: lead knee tucked up, back leg trailing, near arm reaching up and
// forward, far arm thrown back. (A straight-up arm covers the face at this size.)
const jumpPose = (who) => sidePose(who, [[0.1, -1.3], [1.2, 0.0]], [-2.4, 1.7], idleShift(who) - 2);
// Falling: legs reaching down, arms out.
const fallPose = (who) => sidePose(who, [[-0.25, -0.1], [0.45, 0.1]], [-1.6, 1.9], idleShift(who) - 1);

const STRIDE = 1.6; // tiles per walk cycle

let P = 1;      // CSS px per art pixel
let T = 16;     // CSS px per tile

const probe = document.createElement('div');

// Rows (or layers of rows, each outlined separately) to a canvas. `px` is CSS
// px per square.
function makeSprite(rowsOrLayers, px, pal, outline = true) {
  const layers = Array.isArray(rowsOrLayers[0]) ? rowsOrLayers : [rowsOrLayers];
  const p = Math.max(1, Math.round(px * DPR));
  const ow = outline ? Math.max(1, Math.round(p * 0.22)) : 0;
  const h = layers[0].length, w = Math.max(...layers[0].map(r => r.length));
  const c = document.createElement('canvas');
  c.width = w * p + ow * 2;
  c.height = h * p + ow * 2;
  const x = c.getContext('2d');
  const filled = (ch) => ch && ch !== '.' && ch !== ' ';
  for (const rows of layers) {
    if (outline) {
      x.fillStyle = OUTLINE;
      rows.forEach((r, j) => [...r].forEach((ch, i) => {
        if (filled(ch)) x.fillRect(i * p, j * p, p + ow * 2, p + ow * 2);
      }));
    }
    rows.forEach((r, j) => [...r].forEach((ch, i) => {
      if (filled(ch)) { x.fillStyle = pal[ch] || '#ff00ff'; x.fillRect(ow + i * p, ow + j * p, p, p); }
    }));
  }
  c.ow = ow;
  return c;
}

function sprite(key, make, px, pal) {
  const k = key + '@' + px;
  let s = spriteCache.get(k);
  if (!s) { s = makeSprite(typeof make === 'function' ? make() : make, px, pal); spriteCache.set(k, s); }
  return s;
}
const sw = (s) => s.width / DPR;
const sh = (s) => s.height / DPR;

function drawSprite(s, x, y, { sx = 1, sy = 1, rot = 0, bottom = false, flip = false, alpha = 1 } = {}) {
  const w = sw(s), h = sh(s);
  ctx.save();
  if (alpha !== 1) ctx.globalAlpha *= alpha;
  ctx.translate(x, y);
  if (rot) ctx.rotate(rot);
  ctx.scale(flip ? -sx : sx, sy);
  ctx.drawImage(s, -w / 2, bottom ? -h + s.ow / DPR : -h / 2, w, h);
  ctx.restore();
}

function heroSprite(who, pose, frame = 0) {
  const make = pose === 'walk' ? () => sideFrame(who, frame / WALK_FRAMES)
    : pose === 'jump' ? () => jumpPose(who)
    : pose === 'fall' ? () => fallPose(who)
    : () => idlePose(who);
  return sprite(`hero-${who}-${pose}-${frame}`, make, P, HERO_PAL);
}

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 3);
  W = window.innerWidth;
  H = window.innerHeight;
  cv.width = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.imageSmoothingEnabled = false;
  const cs = getComputedStyle(probe);
  safeTop = parseFloat(cs.paddingTop) || 0;
  safeRight = parseFloat(cs.paddingRight) || 0;
  safeBottom = parseFloat(cs.paddingBottom) || 0;
  safeLeft = parseFloat(cs.paddingLeft) || 0;
  spriteCache.clear();
  tileSpriteCache.clear();
  if (G.lv) G.lv.spr = new Map();

  // Whole device pixels per art pixel, so every square is the same size.
  AP = Math.max(1, Math.floor(H * DPR / (VIEW_TILES * TILE)));
  P = AP / DPR;
  T = P * TILE;
  L.hudPx = Math.max(3, Math.round(Math.min(H, W) / 90));
  layoutButtons();
}

function audioOn() {

function tone(f, start, dur, type = 'square', vol = 0.05, f2 = 0) {
  if (!AC) return;
  const t = AC.currentTime + start;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(AC.destination);
  o.start(t);
  o.stop(t + dur + 0.02);
}

// Walking frames: eyes and nose slide toward the walking direction (so the pet
// looks where it's going) and the feet swing back and forth.
function walkRows(rows, dir, frame) {
  const a = rows.map(r => [...r]);
  const last = a.length - 1;
  if (dir) {
    for (let j = 0; j < last; j++) {
      const r = a[j];
      const idx = [...r.keys()].filter(x => 'gnk'.includes(r[x]));
      idx.sort((p, q) => dir > 0 ? q - p : p - q);
      for (const x of idx) {
        const nx = x + dir;
        const inside = r[nx] && r[nx] !== '.' && r[nx + dir] === r[nx];
        if (inside && !'gnk'.includes(r[nx])) { const t = r[nx]; r[nx] = r[x]; r[x] = t; }
      }
    }
  }
  if (frame) {
    const shift = (frame === 1 ? 1 : -1) * (dir || 1);
    const feet = a[last], out = feet.map(() => '.');
    feet.forEach((c, x) => {
      if (c === '.') return;
      const nx = x + shift;
      out[nx >= 0 && nx < feet.length ? nx : x] = c;
    });
    a[last] = out;
  }
  return a.map(r => r.join(''));
}

function bubbleRows(r) {
  const n = r * 2, out = [];
  for (let j = 0; j < n; j++) {
    let row = '';
    for (let i = 0; i < n; i++) {
      const dx = i + 0.5 - r, dy = j + 0.5 - r, d = Math.hypot(dx, dy);
      let c = '.';
      if (d < r) c = d > r - 1.2 ? 'L' : 'l';
      if (d < r - 1.2 && dx < -1 && dy < -1 && d > r - 2.8) c = 'w';
      row += c;
    }
    out.push([...row]);
  }
  const cx = r;
  out[r - 1][cx - 2] = 'k'; out[r - 1][cx + 1] = 'k';
  out[r][cx - 2] = 'k'; out[r][cx + 1] = 'k';
  out[r + 2][cx - 1] = 'k'; out[r + 2][cx] = 'k';
  out[r + 1][cx - 3] = 'p'; out[r + 1][cx + 2] = 'p';
  return out.map(r2 => r2.join(''));
}

// The garden gate: a flowery arch on two posts, with a picket gate that swings
// open when you reach it.
function gateRows(open) {
  const w = 26, h = 34, g = blank(w, h);
  for (let i = 1; i < w - 1; i++) {
    const t = (i - 1) / (w - 3), top = Math.round(5 - 5 * Math.sin(Math.PI * t));
    for (let j = top; j < top + 3; j++) g[j][i] = (i * 7 + j * 3) % 5 === 0 ? 'f' : (i * 5 + j) % 7 === 0 ? 'y' : (j === top ? 'h' : 'G');
  }
  for (let j = 4; j < h; j++) for (const i of [1, 2, 3, 22, 23, 24]) g[j][i] = i === 3 || i === 24 ? 'p' : 'P';
  if (!open) {
    for (const i of [6, 10, 14, 18]) {
      g[13][i] = 'P';
      for (let j = 14; j < h - 1; j++) { g[j][i] = 'P'; g[j][i + 1] = 'p'; }
    }
    for (const j of [18, 27]) for (let i = 4; i < 22; i++) g[j][i] = 'P';
  } else {
    // swung back against the posts
    for (let j = 14; j < h - 1; j++) { g[j][4] = 'p'; g[j][21] = 'p'; }
  }
  return g.map(r => r.join(''));
}
PROP_ART.gate = gateRows(false);
PROP_ART.gateOpen = gateRows(true);
PROP_ART.checkOn = PROP_ART.checkOff.map((r, j) => j < 7 ? r.replace(/s/g, 'o').replace(/S/g, 'Y') : r);
