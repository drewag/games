}

function friendRow(save, cx, y, px) {
  // five friends: met ones in color, the rest as grey shapes
  const n = FRIENDS.length;
  const gap = px * 16;
  for (let i = 0; i < n; i++) {
    const x = cx + (i - (n - 1) / 2) * gap;
    const met = save.friends > i;
    const s = met ? petSprite(FRIENDS[i].pet, px) : sprite('petsil' + i, PETS[FRIENDS[i].pet].map(r => r.replace(/[^.]/g, 'S')), px, { S: '#d8d4dc' });
    drawSprite(s, x, y, { bottom: true });
  }
}

function drawSelect() {
  drawPaper();
  const pad = 16;
  const homeBottom = drawHomeButton();
  const titleTop = W < 700 ? Math.max(safeTop + 8, homeBottom - 50) : safeTop + pad;
  const titleBottom = drawTitle(W / 2, titleTop, Math.min(W - 160, 900), H * 0.2);
  const subSize = Math.min(30, H * 0.06);
  handText('Who\'s playing?', W / 2, titleBottom + subSize * 0.6, subSize);

  const top = titleBottom + subSize * 1.5;
  const bottom = H - safeBottom - pad;
  const gap = Math.min(40, W * 0.04);
  const avail = bottom - top;
  const cw = Math.min(avail * 0.85, (W - pad * 2 - gap) / 2, 340);
  const x0 = (W - cw * 2 - gap) / 2;
  const nameSize = Math.min(34, cw * 0.13);
  const petPx = Math.max(1.5, Math.round(cw / 80));
  const progH = petPx * 15 + nameSize * 0.9;
  const fitPx = Math.max(2, Math.floor(Math.min((cw * 0.55) / 16, (avail - nameSize * 2.6 - progH) * 0.85 / 30)));
  const ch = Math.min(avail, fitPx * 30 + nameSize * 2.6 + progH + 24);
  const top2 = top + (avail - ch) / 2;

  ['ruby', 'zach'].forEach((who, i) => {
    const x = x0 + i * (cw + gap), y = top2;
    const sel = who === G.hero;
    card(x, y, cw, ch, { border: sel ? '#ff4f9a' : OUTLINE, lw: sel ? 6 : 3, r: 20 });
    const bob = sel ? Math.sin(G.time * 4) * 3 : 0;
    const spriteBottom = y + 14 + fitPx * 30;
    drawSprite(sprite('front-' + who, FRONT[who], fitPx, HERO_PAL), x + cw / 2, spriteBottom + bob, { bottom: true });
    outlinedText(SIDE[who].name, x + cw / 2, spriteBottom + nameSize * 0.9, nameSize, SIDE[who].color);
    const save = SAVES[who];
    friendRow(save, x + cw / 2, spriteBottom + nameSize * 1.7 + petPx * 14, petPx);
    const done = LEVELS.filter(l => save.done[l.id]).length;
    handText(done ? `${done} of ${LEVELS.length} levels` : 'New adventure!', x + cw / 2, spriteBottom + nameSize * 2.3 + petPx * 14, Math.min(20, nameSize * 0.6), '#6d6a70');
    if (together() && net.other.hero === who) {
      handText('In the room', x + cw / 2, y + ch - 18, Math.min(20, nameSize * 0.6), '#a58ad8');
      return;
    }
    G.buttons.push({ x, y, w: cw, h: ch, action: () => chooseHero(who) });
  });
}

// World map: six stops along a dotted path, one per world.
function mapNodes() {
  const top = safeTop + 100, bottom = H - safeBottom - 60;
  const left = safeLeft + 90, right = W - safeRight - 90;
  return WORLDS.map((w, i) => {
    const t = i / (WORLDS.length - 1);
    return { x: left + (right - left) * t, y: (i % 2 ? top + (bottom - top) * 0.2 : bottom - (bottom - top) * 0.2) + Math.sin(i * 1.7) * 10 };
  });
}

function drawMap() {
  drawPaper();
  iconButton(safeLeft + 12, safeTop + 12, 52, 'back', () => { G.state = 'select'; });
  outlinedText('Pick a world!', W / 2, safeTop + 44, Math.min(44, W * 0.05), '#1e4fa3');
  const nodes = mapNodes();
  for (let i = 0; i < nodes.length - 1; i++) {
    const a = nodes[i], b = nodes[i + 1];
    pencilLine(a.x, a.y, b.x, b.y, i, '#b9b2a6', 4, [2, 12]);
  }
  const r = Math.min(64, W / 15, H / 8);
  nodes.forEach((n, i) => {
    const w = i + 1, def = WORLDS[i];
    const open = worldUnlocked(G.save, w) && worldLevels(w).length > 0;
    const done = worldLevels(w).length && worldLevels(w).every(l => isDone(G.save, l.id));
    const theme = THEMES[def.theme];
    ctx.save();
    ctx.fillStyle = OUTLINE;
    ctx.beginPath(); ctx.arc(n.x, n.y + 5, r, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, TAU);
    ctx.clip();
    if (open) {
      theme.sky.forEach((c, k) => { ctx.fillStyle = c; ctx.fillRect(n.x - r, n.y - r + k * (r * 1.3 / theme.sky.length), r * 2, r * 1.3 / theme.sky.length + 1); });
      ctx.fillStyle = theme.pal.G; ctx.fillRect(n.x - r, n.y + r * 0.3, r * 2, r);
      ctx.fillStyle = theme.pal.d; ctx.fillRect(n.x - r, n.y + r * 0.5, r * 2, r);
    } else { ctx.fillStyle = '#e4e0d8'; ctx.fillRect(n.x - r, n.y - r, r * 2, r * 2); }
    ctx.restore();
    ctx.save();
    ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, TAU);
    ctx.lineWidth = w === G.world ? 6 : 3; ctx.strokeStyle = w === G.world ? '#ff4f9a' : OUTLINE; ctx.stroke();
    ctx.restore();
    const px = Math.max(2, Math.round(r / 18));
    if (!open) drawSprite(sprite('icon-lock', ICONS.lock, px * 1.6, UI_PAL), n.x, n.y);
    else if (def.friend >= 0) {
      const met = G.save.friends > def.friend;
      const s = met ? petSprite(FRIENDS[def.friend].pet, px) : sprite('petsil' + def.friend, PETS[FRIENDS[def.friend].pet].map(r2 => r2.replace(/[^.]/g, 'S')), px, { S: '#ffffff' });
      drawSprite(s, n.x, n.y + r * 0.45, { bottom: true });
    } else drawSprite(enemySprite('raccoon', px), n.x, n.y + r * 0.45, { bottom: true });
    if (done) drawSprite(sprite('icon-check', ICONS.check, px * 1.4, UI_PAL), n.x + r * 0.7, n.y - r * 0.7);
    outlinedText(`${w}`, n.x - r * 0.75, n.y - r * 0.75, r * 0.5, '#ffffff');
    handText(def.name, n.x, n.y + r + 22, Math.min(22, r * 0.4), open ? '#3d3940' : '#a8a3a8');
    if (open) G.buttons.push({ x: n.x - r, y: n.y - r, w: r * 2, h: r * 2 + 30, action: () => { G.world = w; G.state = 'levels'; } });
  });
  // the hero stands by the current world
  const cur = nodes[G.world - 1];
  const hpx = Math.max(2, Math.round(r / 20));
  drawSprite(sprite(`map-${G.hero}-${Math.floor(G.time * 8) % WALK_FRAMES}`, () => sideFrame(G.hero, (Math.floor(G.time * 8) % WALK_FRAMES) / WALK_FRAMES), hpx, HERO_PAL), cur.x - r - 10, cur.y + r * 0.6, { bottom: true });
}

function drawLevels() {
  const def = WORLDS[G.world - 1];
  drawBackground(THEMES[def.theme], G.time * 0.4);
  ctx.fillStyle = 'rgba(251,248,241,0.55)';
  ctx.fillRect(0, 0, W, H);
  iconButton(safeLeft + 12, safeTop + 12, 52, 'back', () => { G.state = 'map'; });
  outlinedText(`World ${G.world}: ${def.name}`, W / 2, safeTop + 44, Math.min(44, W * 0.045), '#ffffff');
  const lvls = worldLevels(G.world);
  const n = lvls.length;
  const gap = 18, pad = 24;
  const cw = Math.min(250, (W - safeLeft - safeRight - pad * 2 - gap * (n - 1)) / n);
  const ch = Math.min(H * 0.6, cw * 1.25);
  const x0 = (W - (cw * n + gap * (n - 1))) / 2, y = Math.max(safeTop + 90, (H - ch) / 2 + 20);
  lvls.forEach((l, i) => {
    const x = x0 + i * (cw + gap);
    const open = levelUnlocked(G.save, l);
    const done = isDone(G.save, l.id);
    card(x, y, cw, ch, { fill: open ? '#ffffff' : '#ece8e0', r: 18 });
    outlinedText(l.id, x + cw / 2, y + ch * 0.17, Math.min(40, cw * 0.2), open ? '#1e4fa3' : '#b8b2a8');
    ctx.save();
    ctx.font = `${Math.min(22, cw * 0.1)}px ${HAND_FONT}`;
    ctx.fillStyle = open ? '#3d3940' : '#a8a3a8';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    wrapText(open ? l.name : '???', x + cw / 2, y + ch * 0.36, cw - 20, Math.min(26, cw * 0.12));
    ctx.restore();
    const px = Math.max(2, Math.round(cw / 70));
    if (!open) drawSprite(sprite('icon-lock', ICONS.lock, px * 2, UI_PAL), x + cw / 2, y + ch * 0.66);
    else {
      if (l.boss) drawSprite(enemySprite('raccoon', px * 1.2), x + cw / 2, y + ch * 0.7, { bottom: true });
      else drawSprite(snackSprite(SNACK_KINDS[i % 4], px * 1.6), x + cw / 2, y + ch * 0.6);
      const best = G.save.snacks[l.id] || 0;
      handText(done ? `Snacks: ${best} / ${countTotal(l)}` : 'Not finished yet', x + cw / 2, y + ch * 0.82, Math.min(19, cw * 0.085), '#6d6a70');
      if (G.save.cp && G.save.cp.id === l.id) handText('(at checkpoint)', x + cw / 2, y + ch * 0.92, Math.min(15, cw * 0.07), '#2f8c3d');
    }
    if (done) drawSprite(sprite('icon-check', ICONS.check, px * 1.5, UI_PAL), x + cw - 30, y + 30);
    if (open) G.buttons.push({ x, y, w: cw, h: ch, action: () => startLevel(l.id) });
  });
}

const totalCache = {};
function countTotal(def) {
  if (totalCache[def.id] === undefined) {
    let n = 0, boss = false;
    for (const r of def.rows) for (const c of r) { if (c === 's') n++; else if (c === 'B') n += 3; else if (c === 'X') boss = true; }
    totalCache[def.id] = n + (boss ? BOSS_LOOT : 0);
  }
  return totalCache[def.id];
}

function wrapText(text, x, y, maxW, lh) {
  const words = text.split(' ');
  const lines = [];
  let cur = '';
  for (const w of words) {
    const t = cur ? cur + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t;
  }
  lines.push(cur);
  lines.forEach((ln, i) => ctx.fillText(ln, x, y + (i - (lines.length - 1) / 2) * lh));
}

// ---------------------------------------------------------------------------
// Playfield
// ---------------------------------------------------------------------------
let shakeX = 0, shakeY = 0;
function toScreen(wx, wy) {
  // Whole device pixels, so tiles line up without seams.
  const cx = Math.round((G.cam.x + shakeX) * TILE * AP), cy = Math.round((G.cam.y + shakeY) * TILE * AP);
  return [(Math.round(wx * TILE * AP) - cx) / DPR, (Math.round(wy * TILE * AP) - cy) / DPR];
}
function onScreen(x, margin = 2) { const { vw } = viewTiles(); return x > G.cam.x - margin && x < G.cam.x + vw + margin; }

function drawTiles() {
  const lv = G.lv;
  const { vw, vh } = viewTiles();
  const x0 = Math.max(0, Math.floor(G.cam.x) - 1), x1 = Math.min(lv.cols - 1, Math.ceil(G.cam.x + vw) + 1);
  const y0 = Math.max(0, Math.floor(G.cam.y) - 1), y1 = Math.min(lv.rows - 1, Math.ceil(G.cam.y + vh) + 1);
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {
    const c = lv.tiles[ty][tx];
    if (c === '.') continue;
    if (isFriendBlock(c) && !isSolid(c)) { drawGhostBlock(tx, ty, c); continue; }
    const s = tileSprite(tx, ty);
    if (!s) continue;
    let [sx, sy] = toScreen(tx, ty);
    const b = lv.bumps.get(`${tx},${ty}`);
    if (b) sy -= Math.sin((1 - b / 0.18) * Math.PI) * T * 0.3;
    ctx.drawImage(s, sx + s.offX / DPR, sy + s.offY / DPR, s.width / DPR, s.height / DPR);
  }
}

// A friend's block before meeting them: a dotted outline you pass through.
function drawGhostBlock(tx, ty, c) {
  const fr = FRIENDS[+c - 1];
  const [sx, sy] = toScreen(tx, ty);
  ctx.save();
  ctx.globalAlpha = 0.75;
  ctx.setLineDash([P * 2, P * 2]);
  ctx.lineWidth = Math.max(1.5, P * 1.2);
  ctx.strokeStyle = fr.d;
  ctx.strokeRect(sx + P, sy + P, T - P * 2, T - P * 2);
  ctx.globalAlpha = 0.18;
  ctx.fillStyle = fr.c === '#ffffff' ? '#ffffff' : fr.c;
  ctx.fillRect(sx + P, sy + P, T - P * 2, T - P * 2);
  ctx.restore();
}

function drawProps() {
  const lv = G.lv;
  for (const c of lv.checkpoints) {
    if (!onScreen(c.x)) continue;
    const [sx, sy] = toScreen(c.x, c.y);
    drawSprite(propSprite(c.on ? 'checkOn' : 'checkOff'), sx, sy, { bottom: true, rot: c.on ? Math.sin(G.time * 3) * 0.04 : 0 });
  }
  if (lv.goal && onScreen(lv.goal.x, 3)) {
    const [sx, sy] = toScreen(lv.goal.x, lv.goal.y);
    const open = G.finish > 0;
    drawSprite(propSprite(open ? 'gateOpen' : 'gate'), sx, sy, { bottom: true });
    if (lv.hasBoss && !lv.bossDone) drawSprite(propSprite('lock'), sx, sy - T * 0.8);
  }
  const f = lv.friend;
  if (f && f.idx >= 0 && friendsMet() === f.idx && onScreen(f.x)) {
    const [sx, sy] = toScreen(f.x, f.y);
    // peeking out of a bush, with a little hop now and then
    const peek = Math.max(0, Math.sin(G.time * 2.2)) * T * 0.35;
    drawSprite(petSprite(FRIENDS[f.idx].pet, P, Math.sign(G.h.x - f.x), 0), sx, sy - T * 0.15 - peek, { bottom: true });
    drawSprite(propSprite('bush'), sx, sy + P, { bottom: true, sx: 1 + Math.sin(G.time * 6) * 0.02 });
    if (Math.abs(G.h.x - f.x) < 6) handText('!', sx + T * 0.4, sy - T * 1.4 - peek, T * 0.6, '#ff4f9a');
  }
}

function drawSnacks() {
  const bobT = G.time * 3;
  for (const s of G.lv.snacks) {
    if (s.taken || !onScreen(s.x)) continue;
    const [sx, sy] = toScreen(s.x, s.y + Math.sin(bobT + s.x) * 0.06);
    drawSprite(snackSprite(s.kind, P), sx, sy, { rot: Math.sin(bobT * 1.3 + s.x) * 0.12 });
  }
  for (const s of G.loose) {
    const [sx, sy] = toScreen(s.x, s.y - 0.25);
    drawSprite(snackSprite(s.kind, P), sx, sy, { alpha: s.t < 0.35 ? 0.6 : 1 });
  }
  for (const it of G.items) {
    const [sx, sy] = toScreen(it.x, it.y);
    drawSprite(snackSprite(it.kind, P), sx, sy);
  }
}

function drawEnemies() {
  for (const e of G.enemies) {
    if (!e.alive || !onScreen(e.x, 3)) continue;
    const [sx, sy] = toScreen(e.x, e.y);
    const flip = e.dir > 0;
    switch (e.kind) {
      case 'dust': {
        const s = enemySprite('dust');
        drawSprite(s, sx, sy - sh(s) / 2 + s.ow / DPR, { rot: e.roll });
        break;
      }
      case 'flea': drawSprite(enemySprite('flea'), sx, sy, { bottom: true, flip, sy: e.ground ? 1 : 1.1 }); break;
      case 'bubble': drawSprite(enemySprite('bubble'), sx, sy - T * 0.4, { sx: 1 + Math.sin(e.t * 5) * 0.05, sy: 1 - Math.sin(e.t * 5) * 0.05 }); break;
      case 'vroomba': drawSprite(enemySprite('vroomba'), sx, sy, { bottom: true, flip: e.dir < 0 }); break;
      case 'sprinkler': {
        drawSprite(enemySprite('sprinkler'), sx, sy, { bottom: true });
        if (e.spray > 0) {
          ctx.fillStyle = '#7ec8e3';
          for (const s of [-1, 1]) for (let u = 0.04; u <= 1; u += 0.06) {
            const uu = (u + G.time * 0.8) % 1;
            const [wx, wy] = sprayPoint(e, s, uu);
            const [px, py] = toScreen(wx, wy);
            const sz = P * (2 + (uu * 7 % 1));
            ctx.fillStyle = (Math.floor(uu * 20) % 3) ? '#7ec8e3' : '#d9f3ff';
            ctx.fillRect(px - sz / 2, py - sz / 2, sz, sz);
          }
        } else if (e.t % 3.8 > 3.2) {
          // a wobble warns it's about to spray
          drawSprite(enemySprite('sprinkler'), sx + Math.sin(G.time * 50) * P, sy, { bottom: true });
        }
        break;
      }
      case 'raccoon': {
        const s = enemySprite('raccoon');
        const hop = e.state === 'run' ? Math.abs(Math.sin(e.t * 16)) * T * 0.12 : Math.abs(Math.sin(e.t * 8)) * T * 0.05;
        drawSprite(s, sx, sy - hop, { bottom: true });
        if (e.carry) drawSprite(enemySprite('sack'), sx - e.dir * T * 0.45, sy - T * 0.35 - hop, { bottom: true });
        break;
      }
      case 'bandit': {
        const s = enemySprite('bandit');
        const blink = e.state === 'dizzy' && Math.floor(G.time * 10) % 2;
        const hop = e.state === 'run' && e.ground ? Math.abs(Math.sin(e.t * 12)) * T * 0.1 : 0;
        if (!blink) drawSprite(s, sx, sy - hop, { bottom: true, rot: e.state === 'dizzy' ? Math.sin(G.time * 12) * 0.08 : 0 });
        drawSprite(enemySprite('sack'), sx - e.dir * T * 0.7, sy - T * 0.5 - hop, { bottom: true });
        if (e.state === 'dizzy') for (let k = 0; k < 3; k++) {
          const a = G.time * 5 + k * TAU / 3;
          const [qx, qy] = toScreen(e.x + Math.cos(a) * 0.6, e.y - e.hh - 0.3 + Math.sin(a) * 0.15);
          drawSprite(snackSprite('zoomies', P * 0.7), qx, qy);
        }
        // hearts left over his head
        if (e.state !== 'wait' && e.state !== 'flee') for (let k = 0; k < 3; k++) {
          const [hx, hy] = toScreen(e.x + (k - 1) * 0.45, e.y - e.hh - 0.9);
          drawSprite(snackSprite(k < e.hp ? 'heart' : 'heartEmpty', P * 0.8), hx, hy);
        }
        break;
      }
    }
  }
}

function heroPose(h) {
  let pose = 'idle', frame = 0, flip = h.face < 0;
  if (h.pound) pose = 'jump';
  else if (h.cling) { pose = 'fall'; flip = h.cling > 0; }
  else if (!h.ground) pose = h.vy < 2 || h.floating ? 'jump' : 'fall';
  else if (Math.abs(h.vx) > 0.3) { pose = 'walk'; frame = Math.floor(h.phase * WALK_FRAMES) % WALK_FRAMES; }
  const rot = h.pound === 'hang' ? (1 - h.poundT / 0.12) * TAU * (h.face) : 0;
  return { pose, frame, flip, rot };
}

function drawHero() {
  const h = G.h;
  if (G.dying > 0) return;
  if (h.blink > 0 && Math.floor(G.time * 12) % 2 === 0) return;
  const { pose, frame, flip, rot } = heroPose(h);
  const s = heroSprite(G.hero, pose, frame);
  const [sx, sy] = toScreen(h.x, h.y);
  const sq = h.landSq;
  const dig = h.digT > 0 ? Math.sin(G.time * 60) * P : 0;
  if (G.run.zoom > 0) {
    ctx.save();
    ctx.globalAlpha = 0.3;
    drawSprite(s, sx - h.vx * P * 1.2, sy, { bottom: true, flip });
    ctx.restore();
  }
  drawSprite(s, sx + dig, sy, { bottom: true, flip, sx: 1 + 0.08 * sq, sy: 1 - 0.08 * sq, rot });
  if (h.floating) {
    // Choco's float: a little purple umbrella of sparkles over the head
    ctx.save(); ctx.globalAlpha = 0.6; ctx.fillStyle = FRIENDS[4].c;
    ctx.beginPath(); ctx.arc(sx, sy - h.hh * T - T * 0.1, T * 0.6, Math.PI, 0); ctx.fill(); ctx.restore();
  }
}

// The other iPad's hero and their own friend, with their name on top. When
// they're off screen, a tag at the edge points the way.
function drawOther() {
  const o = net.other;
  if (!o || !o.p || !o.inLevel || o.p[10]) return;
  const p = o.p, who = o.hero;
  if (p[11] >= 0) {
    const [fx, fy] = toScreen(o.fx, o.fy);
    drawSprite(petSprite(FRIENDS[p[11]].pet, P, p[14], p[15]), fx, fy + (p[15] ? -P * 2 : 0), { bottom: true });
  }
  const { vw } = viewTiles();
  const [sx, sy] = toScreen(o.x, o.y);
  const color = SIDE[who].color, size = Math.max(14, T * 0.38);
  if (o.x < G.cam.x - 0.3 || o.x > G.cam.x + vw + 0.3) {
    const left = o.x < G.cam.x;
    const ex = left ? safeLeft + 30 : W - safeRight - 30;
    const ey = clamp(sy - T, safeTop + 90, H - safeBottom - 150);
    ctx.save();
    ctx.fillStyle = color; ctx.strokeStyle = OUTLINE; ctx.lineWidth = 3;
    const d = left ? -1 : 1;
    ctx.beginPath(); ctx.moveTo(ex + d * 16, ey); ctx.lineTo(ex - d * 2, ey - 13); ctx.lineTo(ex - d * 2, ey + 13); ctx.closePath();
    ctx.fill(); ctx.stroke(); ctx.restore();
    outlinedText(SIDE[who].name, ex - d * 10, ey + 26, size, color, { align: left ? 'left' : 'right', stroke: '#ffffff' });
    return;
  }
  if (p[6] && Math.floor(G.time * 12) % 2 === 0) return;
  const s = heroSprite(who, p[2], p[3]);
  if (p[7]) {
    ctx.save(); ctx.globalAlpha = 0.3;
    drawSprite(s, sx - (p[4] ? -1 : 1) * T * 0.5, sy, { bottom: true, flip: !!p[4] });
    ctx.restore();
  }
  drawSprite(s, sx, sy, { bottom: true, flip: !!p[4], rot: p[5] });
  if (p[8]) {
    ctx.save(); ctx.globalAlpha = 0.6; ctx.fillStyle = FRIENDS[4].c;
    ctx.beginPath(); ctx.arc(sx, sy - SIDE[who].box[1] / TILE * T - T * 0.1, T * 0.6, Math.PI, 0); ctx.fill(); ctx.restore();
  }
  outlinedText(SIDE[who].name, sx, sy - SIDE[who].box[1] / TILE * T - T * 0.45, size, color, { stroke: '#ffffff' });
}

function drawFollower() {
  const f = G.follower;
  if (!f || G.dying > 0) return;
  const [sx, sy] = toScreen(f.x, f.y);
  const frame = f.moving ? 1 + (Math.floor(f.phase) % 2) : 0;
  const bob = f.moving ? Math.abs(Math.sin(f.phase * Math.PI)) * -P * 2 : 0;
  drawSprite(petSprite(FRIENDS[f.idx].pet, P, f.face, frame), sx, sy + bob, { bottom: true });
}

function drawParticles() {
  for (const p of G.parts) {
    const [x, y] = toScreen(p.x, p.y);
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.fillStyle = p.color;
    const s = p.size * P;
    if (p.star) { ctx.fillRect(x - s / 2, y - s * 1.5, s, s * 3); ctx.fillRect(x - s * 1.5, y - s / 2, s * 3, s); }
    else ctx.fillRect(x - s / 2, y - s / 2, s, s);
  }
  ctx.globalAlpha = 1;
  for (const p of G.pops) {
    const [x, y] = toScreen(p.x, p.y);
    ctx.globalAlpha = Math.min(1, p.life * 2);
    outlinedText(p.text, x, y, Math.max(18, T * 0.5), p.color, { stroke: '#ffffff' });
  }
  ctx.globalAlpha = 1;
}

function drawHud() {
  const top = safeTop + 12;
  const run = G.run;
  // snacks
  const ss = snackSprite('cookie', L.hudPx);
  const x = safeLeft + 12 + 52 + 16;
  drawSprite(ss, x + sw(ss) / 2, top + 26);
  outlinedText(String(run.snacks), x + sw(ss) + 10, top + 27, Math.min(40, Math.max(24, H * 0.05)), G.lv.theme.dark ? '#ffcf3f' : '#1e4fa3', { align: 'left' });
  if (together()) {
    const o = net.other;
    outlinedText(`${otherName()}: ${o.snacks}${o.done ? (o.quit ? ' (left)' : ' (done)') : ''}`, x, top + 66, Math.min(24, Math.max(16, H * 0.032)), SIDE[o.hero].color, { align: 'left', stroke: '#ffffff' });
  }
  // hearts
  for (let i = 0; i < 3; i++) {
    const hs = snackSprite(i < run.hearts ? 'heart' : 'heartEmpty', L.hudPx);
    const hx = W - safeRight - 16 - sw(hs) / 2 - (2 - i) * (sw(hs) + 6);
    drawSprite(hs, hx, top + 26, { sx: 1, sy: 1 });
  }
  if (run.zoom > 0) {
    const zs = snackSprite('zoomies', L.hudPx);
    const zx = W - safeRight - 16 - 3 * (sw(zs) + 10) - sw(zs);
    drawSprite(zs, zx, top + 26, { rot: G.time * 4 });
    ctx.fillStyle = '#ff9800';
    ctx.fillRect(zx - 20, top + 48, 40 * run.zoom / FEEL.zoomTime, 5);
  }
}

function drawTouchButtons() {
  const held = { left: false, right: false, jump: false, down: false };
  for (const p of pointers.values()) {
    if (p.zone) held[p.zone] = true;
    if (p.keepDir < 0) held.left = true;
    if (p.keepDir > 0) held.right = true;
  }
  if (input.dir < 0) held.left = true;
  if (input.dir > 0) held.right = true;
  if (input.jump) held.jump = true;
  if (input.down) held.down = true;
  const r = L.btnR;
  const btn = (cx, cy, rad, on, color, drawIcon) => {
    ctx.save();
    ctx.globalAlpha = on ? 0.95 : 0.6;
    ctx.fillStyle = OUTLINE;
    ctx.beginPath(); ctx.arc(cx, cy + (on ? 1 : 4), rad, 0, TAU); ctx.fill();
    ctx.fillStyle = on ? color : '#ffffff';
    ctx.beginPath(); ctx.arc(cx, cy + (on ? 3 : 0), rad, 0, TAU); ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = OUTLINE; ctx.stroke();
    ctx.globalAlpha = on ? 1 : 0.8;
    ctx.fillStyle = on ? '#ffffff' : OUTLINE;
    ctx.translate(cx, cy + (on ? 3 : 0));
    drawIcon(rad);
    ctx.restore();
  };
  const arrow = (dir) => (rad) => {
    ctx.beginPath();
    ctx.moveTo(dir * rad * 0.45, 0);
    ctx.lineTo(-dir * rad * 0.3, -rad * 0.45);
    ctx.lineTo(-dir * rad * 0.3, rad * 0.45);
    ctx.closePath(); ctx.fill();
  };
  const bigArrow = (up) => (rad) => {
    const s = up ? 1 : -1;
    ctx.beginPath();
    ctx.moveTo(0, -rad * 0.5 * s);
    ctx.lineTo(rad * 0.45, rad * 0.1 * s);
    ctx.lineTo(rad * 0.18, rad * 0.1 * s);
    ctx.lineTo(rad * 0.18, rad * 0.45 * s);
    ctx.lineTo(-rad * 0.18, rad * 0.45 * s);
    ctx.lineTo(-rad * 0.18, rad * 0.1 * s);
    ctx.lineTo(-rad * 0.45, rad * 0.1 * s);
    ctx.closePath(); ctx.fill();
  };
  btn(L.left.cx, L.left.cy, r, held.left, '#7ec8e3', arrow(-1));
  btn(L.right.cx, L.right.cy, r, held.right, '#7ec8e3', arrow(1));
  btn(L.jump.cx, L.jump.cy, L.jump.r, held.jump, '#ff7eb6', bigArrow(true));
  if (showDown()) btn(L.down.cx, L.down.cy, L.down.r, held.down, FRIENDS[has('pound') ? 2 : 1].c, bigArrow(false));
}

function drawBanner(text, sub, t, color = '#ff4f9a') {
  const a = Math.min(1, t * 3);
  ctx.save();
  ctx.globalAlpha = a;
  const size = Math.min(56, W * 0.06);
  outlinedText(text, W / 2, H * 0.3, size, color, { stroke: OUTLINE });
  if (sub) outlinedText(sub, W / 2, H * 0.3 + size * 1.05, size * 0.5, '#ffffff', { stroke: OUTLINE });
  ctx.restore();
}

function drawMeet() {
  const m = G.meet;
  const fr = FRIENDS[m.idx];
  ctx.save();
  ctx.globalAlpha = Math.min(0.5, m.t * 2);
  ctx.fillStyle = '#fbf8f1';
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
  const s = Math.min(1, m.t * 3);
  const px = Math.max(3, Math.round(H / 60));
  const ps = petSprite(fr.pet, px);
  const y = H * 0.48;
  drawSprite(ps, W / 2, y + Math.abs(Math.sin(m.t * 6)) * -14, { bottom: true, sx: s, sy: s });
  outlinedText(`${fr.name} joined!`, W / 2, y + px * 4, Math.min(60, W * 0.065) * s, '#ff4f9a');
  if (m.t > 0.6) {
    outlinedText(`${fr.ability}: ${fr.how}`, W / 2, y + px * 4 + Math.min(60, W * 0.065), Math.min(30, W * 0.03), '#ffffff');
  }
}

function drawPlay() {
  shakeX = G.shake > 0 ? rand(-1, 1) * G.shake * 0.6 : 0;
  shakeY = G.shake > 0 ? rand(-1, 1) * G.shake * 0.6 : 0;
  drawBackground(G.lv.theme, G.cam.x);
  drawProps();
  drawTiles();
  drawSnacks();
  drawEnemies();
  drawOther();
  drawFollower();
  drawHero();
  drawParticles();
  if (G.state === 'play') {
    iconButton(safeLeft + 12, safeTop + 12, 52, 'back', leaveLevel);
    drawHud();
    drawTouchButtons();
    if (G.intro > 0) drawBanner(`${G.lv.id}  ${G.lv.def.name}`, together() ? `Who gets more snacks, you or ${otherName()}?` : null, G.intro, '#ffffff');
    if (G.banner) drawBanner(G.banner.text, G.banner.sub, G.banner.t);
    if (G.meet) drawMeet();
    if (G.dying > 0) {
      ctx.fillStyle = `rgba(251,248,241,${clamp(1 - G.dying, 0, 1)})`;
      ctx.fillRect(0, 0, W, H);
    }
  }
}

function drawTally() {
  drawPlay();
  const t = G.tally;
  ctx.fillStyle = 'rgba(251, 248, 241, 0.7)';
  ctx.fillRect(0, 0, W, H);
  if (t.together && together()) { drawTallyTogether(t); return; }
  const pw = Math.min(W * 0.9, 460), bh = Math.min(58, H * 0.11);
  const ph = Math.min(H - safeTop - safeBottom - 20, bh * 2 + 16 + 230);
  const px = (W - pw) / 2, py = Math.max(safeTop + 10, (H - ph) / 2);
  card(px, py, pw, ph, { r: 22 });
  let y = py + 40;
  outlinedText('Level clear!', W / 2, y, Math.min(40, pw * 0.09), '#f3c623');
  y += 44;
  handText(`${G.lv.id}  ${G.lv.def.name}`, W / 2, y, Math.min(22, pw * 0.05), '#6d6a70');
  y += 44;
  // count up the snacks
  const shown = Math.min(t.snacks, Math.floor(t.t * 40));
  const ss = snackSprite('cookie', L.hudPx * 1.2);
  ctx.save(); ctx.font = `900 40px ${TITLE_FONT}`;
  const tw = ctx.measureText(`${shown} / ${t.total}`).width; ctx.restore();
  const left = W / 2 - (sw(ss) + 14 + tw) / 2;
  drawSprite(ss, left + sw(ss) / 2, y);
  outlinedText(`${shown} / ${t.total}`, left + sw(ss) + 14, y, 40, '#1e4fa3', { align: 'left' });
  y += 40;
  handText(t.newBest ? 'New best!' : shown === t.total && t.total ? 'Every snack!' : '', W / 2, y, 22, '#ff4f9a');
  y += 24;
  if (t.t > 0.6) {
    const bw = pw - 48;
    const lvls = worldLevels(G.lv.def.world);
    const next = lvls.find(l => l.n === G.lv.def.n + 1) || LEVELS.find(l => l.world === G.lv.def.world + 1 && l.n === 1);
    if (next) button('Next level', (W - bw) / 2, y, bw, bh, '#4caf50', () => startLevel(next.id));
    else button('World map', (W - bw) / 2, y, bw, bh, '#4caf50', () => { G.state = 'map'; });
    const half = (bw - 12) / 2;
    button('Again', (W - bw) / 2, y + bh + 14, half, bh, '#a58ad8', () => startLevel(G.lv.id, false));
    button('Levels', (W - bw) / 2 + half + 12, y + bh + 14, half, bh, '#7ec8e3', () => { G.state = 'levels'; });
  }
}

// Level clear, playing together: both heroes' snacks side by side.
function drawTallyTogether(t) {
  const o = net.other;
  const pw = Math.min(W * 0.92, 560), bh = Math.min(58, H * 0.11);
  const ph = Math.min(H - safeTop - safeBottom - 20, bh * 2 + 16 + 290);
  const px = (W - pw) / 2, py = Math.max(safeTop + 10, (H - ph) / 2);
  card(px, py, pw, ph, { r: 22 });
  let y = py + 36;
  outlinedText('Level clear!', W / 2, y, Math.min(40, pw * 0.08), '#f3c623');
  y += 36;
  handText(`${G.lv.id}  ${G.lv.def.name}`, W / 2, y, Math.min(22, pw * 0.05), '#6d6a70');
  y += 24;
  const fpx = Math.max(2, Math.floor(Math.min(H * 0.17, 110) / 30));
  const rows = [[G.hero, t.snacks, true], [o.hero, o.snacks, o.done]];
  rows.forEach(([who, n, done], i) => {
    const cx = W / 2 + (i ? 1 : -1) * pw * 0.24;
    const bottom = y + fpx * 30;
    drawSprite(sprite('front-' + who, FRONT[who], fpx, HERO_PAL), cx, bottom, { bottom: true });
    outlinedText(SIDE[who].name, cx, bottom + 18, 22, SIDE[who].color);
    const shown = i ? n : Math.min(n, Math.floor(t.t * 40));
    outlinedText(String(shown), cx, bottom + 52, 36, '#1e4fa3');
    if (!done) handText('still playing…', cx, bottom + 80, 18, '#6d6a70');
  });
  y += fpx * 30 + 100;
  let line = '';
  if (o.done && t.t > 1) {
    if (o.quit) line = `${otherName()} left the level`;
    else if (t.snacks === o.snacks) line = "It's a tie!";
    else line = `${SIDE[t.snacks > o.snacks ? G.hero : o.hero].name} got the most snacks!`;
  }
  handText(line, W / 2, y, 24, '#ff4f9a');
  y += 26;
  const bw = pw - 48;
  if (isGuest()) { handText(`${otherName()} picks what's next`, W / 2, y + bh / 2, 22, '#6d6a70'); return; }
  if (!o.done) { handText(`Waiting for ${otherName()}…`, W / 2, y + bh / 2, 22, '#6d6a70'); return; }
  if (t.t <= 0.6) return;
  const lvls = worldLevels(G.lv.def.world);
  const next = lvls.find(l => l.n === G.lv.def.n + 1) || LEVELS.find(l => l.world === G.lv.def.world + 1 && l.n === 1);
  if (next) button('Next level', (W - bw) / 2, y, bw, bh, '#4caf50', () => startLevel(next.id));
  else button('World map', (W - bw) / 2, y, bw, bh, '#4caf50', () => toLevels('map'));
  const half = (bw - 12) / 2;
  button('Again', (W - bw) / 2, y + bh + 14, half, bh, '#a58ad8', () => startLevel(G.lv.id, false));
  button('Levels', (W - bw) / 2 + half + 12, y + bh + 14, half, bh, '#7ec8e3', () => toLevels('levels'));
}

// Guest: in the room, waiting for the host to pick a level.
function drawWait() {
  drawPaper();
  iconButton(safeLeft + 12, safeTop + 12, 52, 'back', leaveRoom);
  outlinedText(`Room ${net.code}`, W / 2, safeTop + 44, Math.min(44, W * 0.05), '#1e4fa3');
  const o = net.other;
  if (!o) return;
  const fpx = Math.max(2, Math.floor(Math.min(H * 0.4, 260) / 30));
  [o.hero, G.hero].forEach((who, i) => {
    const cx = W / 2 + (i ? 1 : -1) * Math.min(W * 0.18, 200);
    const bottom = H * 0.2 + fpx * 30;
    const bob = Math.sin(G.time * 4 + i * 2) * 3;
    drawSprite(sprite('front-' + who, FRONT[who], fpx, HERO_PAL), cx, bottom + bob, { bottom: true });
    outlinedText(SIDE[who].name, cx, bottom + 30, Math.min(34, W * 0.04), SIDE[who].color);
    friendRow(i ? G.save : { friends: o.friends || 0 }, cx, bottom + 80, Math.max(1.5, Math.round(fpx / 3)));
  });
  handText(`${otherName()} is picking a level…`, W / 2, H - safeBottom - 40, Math.min(28, H * 0.055));
}

// Map and level screens: start a room, or show who's in it.
function drawRoomBadge() {
  const h = 52, y = safeTop + 12;
  const small = W < 900;
  if (!net.peer) {
    const w = small ? 150 : 200;
    button('Play together', W - safeRight - 12 - w, y, w, h, '#a58ad8', () => { net.view = 'menu'; });
    return;
  }
  const w = small ? 92 : 110;
  button('Leave', W - safeRight - 12 - w, y, w, h, '#9a96a0', leaveRoom);
  const text = together() ? `Room ${net.code} · with ${otherName()}` : `Room ${net.code} · waiting…`;
  outlinedText(text, W - safeRight - 24 - w, y + h + 22, small ? 16 : 20, '#a58ad8', { align: 'right', stroke: '#ffffff' });
}

// The room panel, over whatever screen is showing.
function drawNetPanel() {
  ctx.fillStyle = 'rgba(42, 34, 40, 0.45)';
  ctx.fillRect(0, 0, W, H);
  const v = net.view;
  const pw = Math.min(W * 0.92, 560);
  const bh = Math.min(56, H * 0.11);
  const key = v === 'join' ? Math.floor(Math.min(56, (pw - 40) / 8 - 6, (H - safeTop - safeBottom - bh * 2 - 150) / 3 - 6)) : 0;
  const ph = v === 'join' ? 120 + (key + 6) * 3 + bh + 30 : v === 'menu' ? 120 + bh * 3 + 40 : v === 'waiting' ? 250 + bh : v === 'error' ? 200 + bh : 120 + bh;
  const px = (W - pw) / 2, py = Math.max(safeTop + 6, (H - ph) / 2);
  card(px, py, pw, ph, { r: 22 });
  const bw = pw - 60, bx = (W - bw) / 2;
  let y = py + 40;
  const title = { menu: 'Play together', waiting: 'Your room code', join: 'Join a room', joining: `Joining ${net.code}…`, error: 'Oops' }[v];
  outlinedText(title, W / 2, y, Math.min(36, pw * 0.07), '#a58ad8');
  y += 40;
  const close = () => { net.view = null; };
  if (v === 'menu') {
    handText('Two iPads in one level. Who gets more snacks?', W / 2, y, Math.min(20, pw * 0.04), '#6d6a70');
    y += 24;
    button('Make a room', bx, y, bw, bh, '#4caf50', makeRoom);
    button('Join a room', bx, y + bh + 12, bw, bh, '#7ec8e3', () => { net.typed = ''; net.view = 'join'; });
    button('Back', bx, y + (bh + 12) * 2, bw, bh, '#9a96a0', close);
  } else if (v === 'waiting') {
    outlinedText(net.code || '…', W / 2, y + 45, 80, '#1e4fa3');
    handText('Type it on the other iPad.', W / 2, y + 115, 22, '#6d6a70');
    button('Cancel', bx, y + 145, bw, bh, '#9a96a0', leaveRoom);
  } else if (v === 'join') {
    // four slots, then a letter pad
    const slot = 54;
    for (let i = 0; i < 4; i++) {
      const sx = W / 2 + (i - 2) * (slot + 10) + 5;
      card(sx, y - 18, slot, slot, { fill: '#fbf8f1', r: 10, lw: 2 });
      if (net.typed[i]) outlinedText(net.typed[i], sx + slot / 2, y - 18 + slot / 2, 34, '#1e4fa3');
    }
    y += slot - 4;
    const cols = 8, gx = (W - (cols * (key + 6) - 6)) / 2;
    [...CODE_LETTERS, '⌫'].forEach((ch, i) => {
      const kx = gx + (i % cols) * (key + 6), ky = y + Math.floor(i / cols) * (key + 6);
      card(kx, ky, key, key, { fill: ch === '⌫' ? '#ffd7d2' : '#ffffff', r: 10, lw: 2 });
      outlinedText(ch, kx + key / 2, ky + key / 2, key * 0.5, ch === '⌫' ? '#e53935' : '#3d3940', { stroke: '#ffffff' });
      G.buttons.push({ x: kx, y: ky, w: key, h: key, action: () => typeCode(ch) });
    });
    y += (key + 6) * 3 + 8;
    const half = (bw - 12) / 2;
    button('Join', bx, y, half, bh, net.typed.length === 4 ? '#4caf50' : '#b8d8b0', () => { if (net.typed.length === 4) joinRoom(net.typed); });
    button('Back', bx + half + 12, y, half, bh, '#9a96a0', close);
  } else if (v === 'joining') {
    button('Cancel', bx, y, bw, bh, '#9a96a0', leaveRoom);
  } else if (v === 'error') {
    ctx.save();
    ctx.font = `${Math.min(22, pw * 0.045)}px ${HAND_FONT}`;
    ctx.fillStyle = '#3d3940'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    wrapText(net.msg, W / 2, y + 30, bw, 28);
    ctx.restore();
    button('OK', bx, y + 90, bw, bh, '#4caf50', close);
  }
}

function typeCode(ch) {
  if (ch === '⌫') net.typed = net.typed.slice(0, -1);
  else if (net.typed.length < 4 && CODE_LETTERS.includes(ch)) net.typed += ch;
}

function drawNote() {
  const n = G.note;
  ctx.save();
  ctx.globalAlpha = Math.min(1, n.t * 2);
  outlinedText(n.text, W / 2, safeTop + 110, Math.min(36, W * 0.04), '#a58ad8', { stroke: OUTLINE });
  ctx.restore();
}

function draw() {
  G.buttons = [];
  if (G.state === 'select') drawSelect();
  else if (G.state === 'map') drawMap();
  else if (G.state === 'levels') drawLevels();
  else if (G.state === 'tally') drawTally();
  else if (G.state === 'wait') drawWait();
  else drawPlay();
  if (G.state === 'map' || G.state === 'levels') drawRoomBadge();
  if (G.note) drawNote();
  // The room panel takes every tap while it's open.
  if (net.view) { G.buttons = []; drawNetPanel(); }
}

// ---------------------------------------------------------------------------
// Input events
// ---------------------------------------------------------------------------
function hitButton(x, y) {
  for (let i = G.buttons.length - 1; i >= 0; i--) {
    const b = G.buttons[i];
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h + 4) return b;
  }
  return null;
}

cv.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  audioOn();
  const b = hitButton(e.clientX, e.clientY);
  if (b) { SFX.tap(); b.action(); return; }
  if (G.state === 'play') {
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, zone: null, keepDir: 0 });
    updatePointer(e);
    try { cv.setPointerCapture(e.pointerId); } catch (err) { /* ok */ }
  }
});
cv.addEventListener('pointermove', (e) => {
  if (e.pointerType === 'mouse' && !e.buttons) return;
  updatePointer(e);
});
const endPointer = (e) => { pointers.delete(e.pointerId); };
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);
cv.addEventListener('lostpointercapture', endPointer);

const GAME_KEYS = new Set([' ', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown']);
window.addEventListener('keydown', (e) => {
  if (GAME_KEYS.has(e.key)) e.preventDefault();
  audioOn();
  if (net.view) {
    if (net.view === 'join' && !e.repeat) {
      if (/^[a-z]$/i.test(e.key)) typeCode(e.key.toUpperCase());
      if (e.key === 'Backspace') typeCode('⌫');
      if (e.key === 'Enter' && net.typed.length === 4) joinRoom(net.typed);
    }
    if (e.key === 'Escape') { if (net.view === 'waiting' || net.view === 'joining') leaveRoom(); net.view = null; }
    return;
  }
  if (G.state === 'wait') return;
  if (G.state === 'select' && !e.repeat) {
    if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && !together()) G.hero = G.hero === 'ruby' ? 'zach' : 'ruby';
    if (e.key === 'Enter' || e.key === ' ') chooseHero(G.hero);
    return;
  }
  if (G.state === 'map' && !e.repeat) {
    if (e.key === 'ArrowRight' && G.world < WORLDS.length && worldUnlocked(G.save, G.world + 1) && worldLevels(G.world + 1).length) G.world++;
    if (e.key === 'ArrowLeft' && G.world > 1) G.world--;
    if (e.key === 'Enter' || e.key === ' ') G.state = 'levels';
    if (e.key === 'Escape') G.state = 'select';
    return;
  }
  if (G.state === 'levels' && !e.repeat) {
    if (e.key === 'Escape') G.state = 'map';
    if (e.key === 'Enter' || e.key === ' ') {
      const open = worldLevels(G.world).filter(l => levelUnlocked(G.save, l));
      const next = open.find(l => !isDone(G.save, l.id)) || open[open.length - 1];
      if (next) startLevel(next.id);
    }
    return;
  }
  if (G.state === 'tally' && !e.repeat && (e.key === 'Enter' || e.key === ' ') && G.tally.t > 0.6) {
    const b = G.buttons[0]; if (b) b.action();
    return;
  }
  if (e.key === 'Escape' && G.state === 'play') { leaveLevel(); return; }
  keys[e.key] = true;
});
window.addEventListener('keyup', (e) => { keys[e.key] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; pointers.clear(); });
document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('contextmenu', (e) => e.preventDefault());

window.addEventListener('resize', resize);
// Never reload in the middle of a level or while in a room.
window.autoUpdateIsIdle = () => G.state !== 'play' && !net.peer;
window.addEventListener('pagehide', () => send({ t: 'bye' }));

// ---------------------------------------------------------------------------
// Main loop
// ---------------------------------------------------------------------------
let last = performance.now();
function frame(t) {
  let dt = Math.min(0.05, (t - last) / 1000);
  last = t;
  if (G.state === 'tally') G.tally.t += dt;
  // Fixed small steps so jumps are the same height at any frame rate.
  while (dt > 0) {
    const step = Math.min(dt, STEP);
    update(step);
    dt -= step;
  }
  netTick(t);
  draw();
  requestAnimationFrame(frame);
}
resize();
requestAnimationFrame(frame);
</script>
<script src="../auto-update.js"></script>
</body>
</html>
