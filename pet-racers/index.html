  stall: () => [0, 0.15, 0.3].forEach((d) => noise(d, 0.12, 0.1, 300, 'lowpass')),
  roll: () => tone(600 + Math.random() * 600, 0, 0.04, 'square', 0.03),
  got: () => { tone(784, 0, 0.08, 'triangle', 0.07); tone(1175, 0.07, 0.14, 'triangle', 0.07); },
  pad: () => { noise(0, 0.35, 0.1, 800, 'bandpass', 4000); tone(400, 0, 0.3, 'square', 0.04, 900); },
  splash: () => { noise(0, 0.5, 0.15, 700, 'lowpass', 200); tone(500, 0, 0.3, 'sine', 0.06, 120); },
  pop: () => tone(300, 0, 0.15, 'sine', 0.08, 900),
  jump: () => tone(250, 0, 0.3, 'triangle', 0.08, 800),
  land: () => { noise(0, 0.12, 0.1, 300, 'lowpass'); tone(140, 0, 0.1, 'triangle', 0.08, 80); },
  slip: () => { tone(900, 0, 0.35, 'sine', 0.08, 200); noise(0.05, 0.2, 0.05, 2000); },
  // the items
  'Banana Peel': () => { noise(0, 0.12, 0.08, 500, 'lowpass'); tone(250, 0, 0.12, 'sine', 0.08, 120); },
  Cherry: () => { tone(300, 0, 0.12, 'triangle', 0.09, 700); noise(0, 0.06, 0.08, 1500); },
  'Hot Pepper': () => { noise(0, 0.6, 0.12, 400, 'bandpass', 3500); tone(180, 0, 0.5, 'sawtooth', 0.05, 600); },
  // one for each power
  'Gaming Knockout': () => { tone(120, 0, 0.5, 'sine', 0.15, 40); noise(0, 0.4, 0.08, 600, 'lowpass'); },
  'Speed Eating': () => [0, 0.08, 0.16, 0.24, 0.32].forEach((d) => tone(500 + d * 1500, d, 0.06, 'square', 0.05, 300)),
  'Sports Ball': () => { noise(0, 0.08, 0.15, 800); tone(200, 0, 0.15, 'triangle', 0.1, 90); },
  'Instant Cake': () => { tone(700, 0, 0.08, 'sine', 0.1, 1400); tone(1047, 0.1, 0.25, 'triangle', 0.07); },
  'Brave Mode': () => [392, 523, 659, 784].forEach((f, i) => tone(f, i * 0.09, i === 3 ? 0.4 : 0.1, 'square', 0.06)),
  'Math Defeater': () => tone(1500, 0, 0.35, 'square', 0.05, 300),
  'Instant Hacking': () => [0, 0.05, 0.1, 0.15, 0.2, 0.25].forEach((d) => tone(300 + Math.random() * 1200, d, 0.05, 'square', 0.05)),
  'Fashion Shoot': () => { noise(0, 0.05, 0.2, 4000, 'highpass'); tone(2000, 0.05, 0.3, 'sine', 0.05, 600); },
  'Mind Access': () => { tone(400, 0, 0.6, 'sine', 0.08, 900); tone(600, 0.1, 0.6, 'sine', 0.05, 1200); },
};
const sfx = (name, ...a) => { if (AC && SFX[name]) SFX[name](...a); };

// ---------------------------------------------------------------------------
// The race
// ---------------------------------------------------------------------------
const LAPS = 3;
const input = { left: false, right: false, gas: false, back: false, hop: false, look: false };
let pro = false;              // Pro driving: gas, hop and drift, no steering help
let player = RACERS[0];
let friends = [];             // other people's racers, when racing friends
let rivals = RACERS.slice(1);
const isHuman = (r) => r === player || friends.includes(r);
const others = () => RACERS.filter((r) => r !== player);

// This iPad drives the rivals unless it joined someone else's room.
const drivesRivals = () => !isGuest();

function progressOf(r) {
  return isHuman(r) ? (r.lap - 1) * N + r.idx : (r.s / TL) * N;
}
function placeOf(r) {
  return 1 + RACERS.filter((o) => o !== r && progressOf(o) > progressOf(r)).length;
}

function resetRace() {
  rivals = RACERS.filter((r) => !isHuman(r));
  // Staggered grid behind the line; people start at the back in the host's
  // roster order, so every iPad agrees.
  const humans = net.host ? [player, ...friends]
    : net.roster.length ? net.roster.map(([, pet]) => racerNamed(pet)) : [player];
  const order = [...rivals, ...humans];
  const skills = [0.94, 0.93, 0.92, 0.91, 0.9, 0.89, 0.88, 0.87];
  order.forEach((r, k) => {
    const f = -6 - k * 5, lat = k % 2 ? 3 : -3;
    trackPoint(f, lat, r.pos);
    Object.assign(r, { heading: headingAt(f), speed: 0, spin: 0, spinAngle: 0,
      s: (f / N) * TL, lat, netS: (f / N) * TL, netLat: lat, skill: skills[k] || 0.9, phase: k * 1.7,
      steer: 0, idx: Math.floor(wrap(f)), lap: 0, item: null, spare: null, rollT: 0, rush: 0, nibble: 0, brave: 0, remote: null,
      padT: 0, padCd: 0, path: MAIN, pf: Math.floor(wrap(f)), plat: lat, bs: 0, s0: 0, netBs: 0, airY: 0, vy: 0, sunk: 0, sunkIn: null, fails: null,
      hopT: 0, hopY: 0, hopHeld: false, drift: 0, driftLv: 0, driftYaw: 0, charge: 0, boost: 0, stall: 0, gasAt: null });
  });
  for (const p of snacks) { p.gone = 0; p.m.visible = true; }
  clearFx();
  raceTime = 0;
  syncRacers(0);
}

function findIdx(pos, guess) {
  let best = guess, bestD = Infinity;
  for (let k = -30; k <= 30; k++) {
    const i = wrap(guess + k);
    const d = TP[i].distanceToSquared(pos);
    if (d < bestD) { bestD = d; best = i; }
  }
  return best;
}

const fwdOf = (r) => new V3(Math.sin(r.heading), 0, Math.cos(r.heading));
const latOf = (pos, i) => pos.clone().sub(TP[i]).dot(TR[i]);

// Pro driving, after Mario Kart: hold Go to drive, Back to brake and reverse.
// Tap Hop for a little hop; land still holding it while steering and the kart
// drifts that way until Hop is let go. Steering into the drift tightens it,
// away widens it. A longer drift builds blue, then orange, then purple sparks,
// and letting go with sparks showing gives a boost. Holding Go while "2" is
// up in the countdown is a rocket start; holding it from "3" stalls.
const REVERSE = 8;
const HOP_TIME = 0.3;
const SPARKS = [                      // drift time needed, boost seconds
  { at: 0.8, boost: 0.6, color: '#3d9bff' },
  { at: 1.7, boost: 1.1, color: '#ff8a1c' },
  { at: 2.8, boost: 1.7, color: '#b84cff' },
];
const sparkLevel = (charge) => SPARKS.filter((k) => charge >= k.at).length;

function updateHop(me, dt, want, canDrive) {
  const pressed = input.hop && !me.hopWas;
  me.hopWas = input.hop;
  if (!input.hop) me.hopHeld = false;
  if (pressed && canDrive && me.hopT <= 0 && me.airY <= 0 && !me.drift && me.spin <= 0 && me.stall <= 0) {
    me.hopT = HOP_TIME;
    me.hopHeld = true;
    sfx('hop');
  }
  if (me.hopT > 0) {
    me.hopT = Math.max(0, me.hopT - dt);
    const k = 1 - me.hopT / HOP_TIME;
    me.hopY = 4 * k * (1 - k) * 0.6;
    if (me.hopT === 0) { me.hopY = 0; puff(me.pos.clone().setY(0.3).addScaledVector(fwdOf(me), -1)); }
  }
  // On the ground, still holding Hop from the hop, steering: start drifting.
  if (!me.drift && me.hopHeld && me.hopT <= 0 && want && me.speed > 10) {
    me.drift = want;
    me.charge = 0;
  }
  if (!me.drift) { me.driftLv = 0; return; }
  if (me.spin > 0 || me.speed < 6 || !canDrive) {       // lost it: no boost
    me.drift = 0; me.driftLv = 0; me.hopHeld = false;
    return;
  }
  me.charge += dt * (1 + 0.8 * Math.max(0, me.steer * me.drift));   // tight drifts charge faster
  const lv = sparkLevel(me.charge);
  if (lv > me.driftLv) sfx('spark', lv);
  me.driftLv = lv;
  if (!input.hop) {
    if (me.driftLv) {
      me.boost = Math.max(me.boost, SPARKS[me.driftLv - 1].boost);
      sfx('boost');
      for (let k = 0; k < 6; k++) puff(me.pos.clone().setY(0.6).addScaledVector(fwdOf(me), -1.4), SPARKS[me.driftLv - 1].color, 0.4);
    }
    me.drift = 0; me.driftLv = 0;
  }
}

// The countdown just hit GO: was Go pressed at the right moment?
function launch() {
  const me = player;
  if (!pro || me.gasAt === null || !input.gas) return;
  if (me.gasAt > 3) {
    me.stall = 1;
    sfx('stall');
    showPop('Too soon!');
  } else if (me.gasAt > 2) {
    me.boost = 1;
    sfx('boost');
    showPop('Rocket start!');
  }
}

// Is a kart at track sample `f`, `lat` from the middle, on a boost pad?
function onPad(path, f, lat) {
  const reach = (PAD_LEN / 2) * stepOf(path);
  return track.pads.some((p) => {
    if (p.path !== path) return false;
    const d = path.main ? Math.min(wrap(f - p.f), wrap(p.f - f)) : Math.abs(f - p.f);
    return d < reach && Math.abs(lat - p.lat) < PAD_W / 2 + 0.4;
  });
}

// The hazard at f on a path, if any.
const hazardAt = (path, f) => (path && path.gaps ? path.gaps.find((g) => f >= g.a && f <= g.b) : null) || null;
// The next hazard ahead of f on a path.
const nextGap = (path, f) => (path.gaps ? path.gaps.find((g) => f < g.a) : null);

// Jumps: a kart going over a ramp flies, and lands with a little boost.
// `speed` lets a rival who means to clear a gap jump as if at full speed.
// Every ramp is a boost ramp: the kart leaves it faster than it hit it.
function jump(r, speed = r.speed) {
  const out = Math.min(speed * RAMP_BOOST, MAX_SPEED * RAMP_BOOST);
  r.speed = Math.max(r.speed, out);
  r.boost = Math.max(r.boost, 1.2);
  if (r.padT !== undefined) r.padT = Math.max(r.padT, 1.2);       // rivals keep the speed up too
  r.vy = JUMP_V * THREE.MathUtils.clamp(out / MAX_SPEED, 0.5, 1.2);
  r.airY = 0.01;
  for (let k = 0; k < 6; k++) puff(r.pos.clone().setY(0.6).addScaledVector(fwdOf(r), -1.4), k % 2 ? '#ff8a1c' : '#ffcf3f', 0.4);
  if (r === player) { sfx('jump'); sfx('pad'); }
}
function updateAir(r, dt) {
  if (r.airY <= 0) return;
  r.airY += r.vy * dt;
  r.vy -= GRAVITY * dt;
  if (r.airY > 0) return;
  r.airY = 0; r.vy = 0;
  puff(r.pos.clone().setY(0.3).addScaledVector(fwdOf(r), -1));
  puff(r.pos.clone().setY(0.3).addScaledVector(fwdOf(r), 1));
  if (r === player) sfx('land');
}
// The ramp a kart at `lat` drove onto going from a to b on `path`, if any.
const rampCrossed = (path, a, b, lat) => RAMPS.find((rp) => rp.path === path
  && Math.abs(lat - rp.lat) < RAMP_W / 2 + 0.4 && passed(path, a, b, rp.f));

// Water: the kart sinks, and after a moment is put back on the road just past
// the hazard, standing still.
const SINK_TIME = 2;
function sink(r, gap) {
  Object.assign(r, { sunk: SINK_TIME, sunkIn: gap, speed: 0, drift: 0, driftLv: 0, boost: 0, rush: 0 });
  for (let k = 0; k < 8; k++) puff(r.pos.clone().setY(0.3 + Math.random() * 0.6), k % 2 ? '#ffffff' : track.water, 0.7);
  if (r === player) { sfx('splash'); showPop('Splash!'); }
}
function resurface(r) {
  const path = rivalPath(r);
  const f = Math.min(path.n - 1, (r.sunkIn ? r.sunkIn.b : rivalF(r)) + 4 * stepOf(path));
  if (r === player) {
    pathPoint(path, f, 0, r.pos);
    Object.assign(r, { heading: pathHeading(path, f), path, pf: Math.round(f), plat: 0, idx: Math.floor(mainF(path, f)) });
    sfx('pop');
  } else {
    r.bs = r.netBs = (f / (path.n - 1)) * path.len;
    r.lat = 0;
  }
  puff(pathPoint(path, f, 0).setY(0.6), '#ffffff', 0.5);
}

// Which road a kart is on, how far along it and how far from its middle.
// Stays on the road it's on unless another is clearly nearer, and leaves a
// branch at its ends.
function locate(me) {
  const guess = me.path && !me.path.main ? mainF(me.path, me.pf) : me.idx;
  const mi = findIdx(me.pos, Math.floor(wrap(guess)));
  let best = { path: MAIN, f: mi, lat: latOf(me.pos, mi) };
  let cur = !me.path || me.path.main ? best : null;
  for (const br of BRANCHES) {
    if (br !== me.path && wrap(mi - br.from + 30) > br.span + 60) continue;   // nowhere near it
    let bi = 0, d = Infinity;
    for (let k = 0; k < br.n; k++) { const e = br.P[k].distanceToSquared(me.pos); if (e < d) { d = e; bi = k; } }
    if (bi === 0 || bi === br.n - 1) continue;                                // off its ends
    const c = { path: br, f: bi, lat: me.pos.clone().sub(br.P[bi]).dot(br.R[bi]) };
    if (br === me.path) cur = c;
    if (Math.abs(c.lat) < Math.abs(best.lat)) best = c;
  }
  if (cur && cur !== best && Math.abs(best.lat) > Math.abs(cur.lat) - 0.8) best = cur;
  me.path = best.path; me.pf = best.f; me.plat = best.lat;
  me.idx = Math.floor(mainF(best.path, best.f));
}

function updatePlayer(dt, canDrive) {
  const me = player;
  if (me.sunk > 0) {                                   // under water for a moment
    me.sunk -= dt;
    me.speed = 0;
    if (Math.random() < dt * 8) puff(me.pos.clone().setY(0.2), '#ffffff', 0.5);
    if (me.sunk <= 0) { me.sunk = 0; resurface(me); }
    return;
  }
  const want = (input.right ? 1 : 0) - (input.left ? 1 : 0);
  me.steer += (want - me.steer) * Math.min(1, dt * 7);
  // Easy driving, and after the finish line in Pro, the kart drives itself.
  const easy = !pro || state === 'done';

  if (pro && state === 'countdown') {
    if (!input.gas) me.gasAt = null;
    else if (me.gasAt === null) me.gasAt = countdown;
  }
  if (!easy) updateHop(me, dt, want, canDrive);
  else if (me.drift || me.hopY) Object.assign(me, { drift: 0, driftLv: 0, hopT: 0, hopY: 0 });

  const path = me.path || MAIN, lat = me.plat;
  const flying = me.airY > 0;
  const rough = !flying && hazardAt(path, me.pf);
  const offroad = (Math.abs(lat) > path.half + 1.2 || !!rough) && !flying;
  let target = !canDrive || me.stall > 0 ? 0
    : easy || input.gas || input.hop ? MAX_SPEED
    : input.back ? -REVERSE : 0;
  if (rough) target *= 0.35;                          // a botched jump: crawling through it
  else if (offroad && me.brave <= 0 && me.boost <= 0) target *= track.offroad || 0.55;
  if (me.rush > 0) target *= 1.4;
  else if (me.nibble > 0) target *= 1.15;
  if (me.boost > 0 && canDrive) target = Math.max(target, MAX_SPEED * 1.3);
  if (me.spin > 0) target *= 0.25;
  const coasting = !easy && target === 0 && !input.back && me.stall <= 0;
  // In the air there's nothing to push on: the kart keeps the speed it left the ramp with.
  if (!flying) me.speed += (target - me.speed) * Math.min(1, dt * (target > me.speed
    ? (me.rush > 0 || me.boost > 0 ? 3 : 0.9) : coasting ? 0.7 : 2.5));

  let grip = THREE.MathUtils.clamp(Math.abs(me.speed) / MAX_SPEED, 0.25, 1);
  if (!easy) grip *= Math.min(1, Math.abs(me.speed) / 3);   // no turning on the spot
  if (flying) grip *= 0.35;                                 // not much steering in the air
  if (me.drift) {
    // A drift is a slow, wide arc: half a full turn on its own, a bit less than
    // a full turn steering in, nearly straight steering out.
    me.heading -= me.drift * 1.7 * (0.5 + 0.35 * me.steer * me.drift) * grip * dt;
  } else {
    const air = me.hopT > 0 ? 0.5 : 1;                       // a hop only turns a little
    me.heading -= me.steer * 1.7 * grip * air * (me.speed < 0 ? -1 : 1) * dt;
  }

  // Steering help: with no button held, ease toward the road ahead.
  if (easy && !want && me.speed > 1) {
    const aim = aheadPoint(path, me.pf, 20, THREE.MathUtils.clamp(lat, -path.half + 2, path.half - 2) * 0.6);
    me.heading += angleTo(me.heading, Math.atan2(aim.x - me.pos.x, aim.z - me.pos.z)) * Math.min(1, dt * 1.6);
  }
  me.pos.x += Math.sin(me.heading) * me.speed * dt;
  me.pos.z += Math.cos(me.heading) * me.speed * dt;

  // Soft hedges: slide back onto the track instead of crashing.
  const prevIdx = me.idx, prevPath = me.path, prevF = me.pf;
  locate(me);
  const lat2 = me.plat, wall = wallOf(me.path);
  me.wallCd -= dt;
  if (Math.abs(lat2) > wall) {
    me.pos.addScaledVector(pathRight(me.path, me.pf), (Math.abs(lat2) - wall) * -Math.sign(lat2));
    me.heading += angleTo(me.heading, pathHeading(me.path, me.pf)) * Math.min(1, dt * 6);
    if (me.wallCd <= 0) { me.speed *= 0.7; me.wallCd = 0.5; puff(me.pos.clone().setY(0.5)); sfx('wall'); }
  }

  // Boost pads.
  me.padCd -= dt;
  if (onPad(me.path, me.pf, lat2) && me.hopY < 0.3 && me.airY < 0.3) {
    me.boost = Math.max(me.boost, 1.1);
    if (me.padCd <= 0 && canDrive) { sfx('pad'); me.padCd = 0.6; }
  }

  if (me.path === prevPath && me.airY <= 0 && me.speed > 8 && rampCrossed(me.path, prevF, me.pf, lat2)) jump(me);
  updateAir(me, dt);
  const hz = me.airY <= 0 && hazardAt(me.path, me.pf);
  if (hz && hz.kind === 'water' && state !== 'countdown') sink(me, hz);

  if (prevIdx > N * 0.75 && me.idx < N * 0.25) {
    me.lap++;
    if (state === 'race' && me.lap === LAPS) sfx('finalLap');
    else if (state === 'race' && me.lap > 1 && me.lap < LAPS) sfx('lap');
  }
  if (prevIdx < N * 0.25 && me.idx > N * 0.75) me.lap--;

  if (offroad && me.brave <= 0 && me.speed > 5 && Math.random() < dt * 14) {
    puff(me.pos.clone().setY(0.4).addScaledVector(fwdOf(me), -1.2));
  }
  if (me.stall > 0 && Math.random() < dt * 16) puff(me.pos.clone().setY(0.5).addScaledVector(fwdOf(me), -1.3), '#9a8f84', 0.5);
  me.rush = Math.max(0, me.rush - dt);
  me.boost = Math.max(0, me.boost - dt);
  me.stall = Math.max(0, me.stall - dt);
  me.nibble = Math.max(0, me.nibble - dt);
  me.brave = Math.max(0, me.brave - dt);
  me.spin = Math.max(0, me.spin - dt);
  me.spinAngle = me.spin > 0 ? me.spinAngle + dt * 14 : 0;
}

// A rival's road and how far along it they are (in that road's samples). On
// the main loop `s` is the distance driven; on a branch `bs` is the distance
// along the branch, and `s` follows along as if on the main loop, for places.
const rivalPath = (r) => (r.path && !r.path.main ? r.path : MAIN);
const rivalF = (r) => (r.path && !r.path.main ? (r.bs / r.path.len) * (r.path.n - 1) : wrap((r.s / TL) * N));

// Drive a rival on by `adv`. Reaching a branch, the rival driving it may take it.
function advanceRival(r, adv, chooses) {
  const path = rivalPath(r), f0 = rivalF(r);
  if (!path.main) {
    r.bs += adv;
    const share = (path.span / N) * TL;
    if (r.bs >= path.len) { r.s = r.s0 + share; r.path = MAIN; r.bs = 0; }
    else r.s = r.s0 + (r.bs / path.len) * share;
  } else {
    r.s += adv;
    if (chooses) {
      for (const br of BRANCHES) {
        if (passed(MAIN, f0, rivalF(r), br.from) && Math.random() < br.take) {
          // Rivals gamble too: some will miss the ramp, about as often as the hazard is risky.
          Object.assign(r, { path: br, bs: 0, s0: r.s, fails: br.gaps.map((g) => Math.random() < g.risk * 0.8),
          });
          break;
        }
      }
    }
  }
  const rp = rivalPath(r) === path && r.airY <= 0 && r.speed > 8 && rampCrossed(path, f0, rivalF(r), r.lat);
  if (rp) jump(r, rp.gap ? Math.max(r.speed, MAX_SPEED * 1.02) : r.speed);
  const hz = r.airY <= 0 && hazardAt(rivalPath(r), rivalF(r));
  if (hz && hz.kind === 'water' && drivesRivals()) sink(r, hz);
}

function updateRivals(dt, canDrive) {
  if (!drivesRivals()) {
    // Follow the room maker's rivals, filling the gaps between messages.
    for (const r of rivals) {
      const path = rivalPath(r), f0 = rivalF(r);
      r.netS += r.speed * dt;
      r.s += r.speed * dt;
      r.s += (r.netS - r.s) * Math.min(1, dt * 4);
      if (!path.main) {
        r.netBs += r.speed * dt;
        r.bs += r.speed * dt;
        r.bs += (r.netBs - r.bs) * Math.min(1, dt * 4);
      }
      const rp = r.airY <= 0 && r.speed > 8 && rampCrossed(path, f0, rivalF(r), r.lat);
      if (rp) jump(r, rp.gap ? Math.max(r.speed, MAX_SPEED * 1.02) : r.speed);
      updateAir(r, dt);
      r.sunk = Math.max(0, r.sunk - dt * 0.5);       // the room maker says when they're back up
      r.lat += (r.netLat - r.lat) * Math.min(1, dt * 6);
      r.spin = Math.max(0, r.spin - dt);
      r.spinAngle = r.spin > 0 ? r.spinAngle + dt * 14 : 0;
    }
    return;
  }
  const humans = RACERS.filter(isHuman);
  const ours = humans.reduce((a, r) => a + progressOf(r), 0) / humans.length;
  for (const r of rivals) {
    if (r.sunk > 0) {
      r.sunk -= dt;
      r.speed = 0;
      if (r.sunk <= 0) { r.sunk = 0; resurface(r); }
      r.spin = Math.max(0, r.spin - dt);
      continue;
    }
    // Catch-up: ease off when far ahead of the people, push when far behind.
    const gap = ours - progressOf(r);
    const band = THREE.MathUtils.clamp(1 + (gap / N) * 1.2, 0.82, 1.12);
    let target = canDrive ? MAX_SPEED * r.skill * band * (track.rivals || 1) : 0;
    if (onPad(rivalPath(r), rivalF(r), r.lat)) r.padT = 1;
    if (r.padT > 0 && canDrive) { target = Math.max(target, MAX_SPEED * 1.25); r.padT -= dt; }
    if (r.airY <= 0 && hazardAt(rivalPath(r), rivalF(r))) target *= 0.35;
    if (r.spin > 0) target *= 0.25;
    if (r.airY <= 0) r.speed += (target - r.speed) * Math.min(1, dt * (target > r.speed ? (r.padT > 0 ? 3 : 0.8) : 3));
    advanceRival(r, r.speed * dt, true);
    updateAir(r, dt);
    const rpath = rivalPath(r), half = rpath.half, rf = rivalF(r);
    let wantLat = (half / 7) * (3.2 * Math.sin(r.s * 0.013 + r.phase) + 1.2 * Math.sin(r.s * 0.041 + r.phase * 2));
    // Heading for a hazard: line up with the ramp, or (the unlucky ones) just beside it.
    const next = nextGap(rpath, rf);
    if (next && rf > next.ramp - 40 * stepOf(rpath)) {
      wantLat = r.fails && r.fails[rpath.gaps.indexOf(next)] ? next.lat - Math.sign(next.lat) * (RAMP_W / 2 + 1.4) : next.lat;
    }
    r.lat += (wantLat - r.lat) * Math.min(1, dt * (rpath.gaps && rpath.gaps.length ? 2.5 : 0.8));
    r.lat = THREE.MathUtils.clamp(r.lat, -half + 1, half - 1);
    r.spin = Math.max(0, r.spin - dt);
    r.spinAngle = r.spin > 0 ? r.spinAngle + dt * 14 : 0;
  }
}

// Friends' karts: last reported position, nudged forward by their speed.
function updateFriends(dt) {
  for (const r of friends) {
    const n = r.remote;
    if (!n) continue;
    const age = Math.min(0.3, (performance.now() - n.at) / 1000);
    const want = new V3(n.x + Math.sin(n.h) * n.v * age, 0, n.z + Math.cos(n.h) * n.v * age);
    if (r.pos.distanceTo(want) > 12) r.pos.copy(want);
    else r.pos.lerp(want, Math.min(1, dt * 12));
    r.heading += angleTo(r.heading, n.h) * Math.min(1, dt * 12);
    r.speed = n.v;
    r.spin = Math.max(0, r.spin - dt);
    r.spinAngle = r.spin > 0 ? r.spinAngle + dt * 14 : 0;
  }
}

// Spin out another racer. Whoever drives that racer gets told.
function spinOut(r, text = 'Bonk!') {
  if (r === player || r.spin > 0 || r.brave > 0) return false;
  if (friends.includes(r) || !drivesRivals()) send({ t: 'spin', who: r.name, text });
  r.spin = 1.5;
  showPop(text);
  sfx('bonk');
  for (let k = 0; k < 5; k++) puff(r.pos.clone().setY(1.2), '#ffcf3f', 0.5);
  return true;
}

// Our own racer, hit by the friend's power.
function getHit(text) {
  if (player.spin > 0 || player.brave > 0) return;
  player.spin = 1.5;
  showPop(text);
  sfx('ouch');
  if (text === 'Flash!') screenFlash(0.75);
  for (let k = 0; k < 5; k++) puff(player.pos.clone().setY(1.2), '#ffcf3f', 0.5);
}

let lastBump = 0;
function syncRacers(t, dt = 0) {
  for (const r of rivals) {
    const path = rivalPath(r), f = rivalF(r);
    pathPoint(path, f, r.lat, r.pos);
    r.heading = pathHeading(path, f);
  }
  for (const r of RACERS) {
    r.group.position.copy(r.pos);
    r.group.rotation.y = r.heading;
    r.driftYaw += (-r.drift * 0.35 - r.driftYaw) * Math.min(1, dt * 3);   // swing in gently
    r.body.rotation.y = r.spinAngle + r.driftYaw;
    r.body.position.y = Math.abs(Math.sin(t * 18 + r.phase)) * 0.05 * (Math.abs(r.speed) / MAX_SPEED) + r.hopY + r.airY
      - (r.sunk > 0 ? 0.9 : 0);
    r.body.rotation.x = r.airY > 0 ? THREE.MathUtils.clamp(-r.vy * 0.03, -0.3, 0.3) : 0;   // nose up, then down
    r.pet.scale.setScalar(r.brave > 0 ? 1 + Math.sin(t * 20) * 0.06 : 1);
  }
  for (const r of [player, ...friends]) {
    const sp = r.speed / MAX_SPEED;
    r.body.rotation.z = -r.steer * 0.06 * sp - r.drift * 0.08;
    r.pet.rotation.z = -r.steer * 0.18;
    r.pet.rotation.y = r.steer * -0.15;
  }

  // Bumping: push apart, never crash. Each iPad only moves what it drives.
  // Brave Mode spins out whoever it touches.
  for (let a = 0; a < RACERS.length; a++) {
    for (let b = a + 1; b < RACERS.length; b++) {
      const A = RACERS[a], B = RACERS[b];
      const d = A.pos.clone().sub(B.pos).setY(0);
      const len = d.length();
      if (len >= 2.2 || len < 0.001) continue;
      const push = 2.2 - len;
      if ((A === player || B === player) && push > 0.4 && performance.now() - lastBump > 400) { lastBump = performance.now(); sfx('bump'); }
      d.normalize();
      for (const [r, sign] of [[A, 1], [B, -1]]) {
        if (r === player) r.pos.addScaledVector(d, sign * push * 0.6);
        else if (!friends.includes(r) && drivesRivals()) r.lat += sign * d.dot(pathRight(rivalPath(r), rivalF(r))) * push * 0.4;
      }
      if (player.brave > 0 && (A === player || B === player)) spinOut(A === player ? B : A);
    }
  }
}

function updateSnacks(dt, t) {
  const racing = state === 'race' || state === 'done';
  for (const p of snacks) {
    if (p.gone > 0) {
      p.gone -= dt;
      if (p.gone <= 0) p.m.visible = true;
      continue;
    }
    p.m.position.y = p.base.y + 1.1 + Math.sin(t * 3 + p.base.x) * 0.2;
    p.m.rotation.y = t * 2 + p.base.z;
    if (!racing) continue;
    for (const r of RACERS) {
      if (p.m.position.distanceTo(r.pos.clone().setY(1.1)) > 1.9) continue;
      p.gone = 5; p.m.visible = false;
      puff(p.m.position.clone());
      if (r === player) eat(p.food);
      break;
    }
  }
}

// Every snack gives an item, if there's a free slot: the one in hand, then the
// spare. A favorite food gives the pet's Power half the time, any other snack
// now and then. Further back in the race, the Power and the Hot Pepper come up
// more and the peel less.
const ITEMS = {
  'Banana Peel': { icon: '🍌', label: 'Banana<br>Peel' },
  Cherry: { icon: '🍒', label: 'Cherry' },
  'Hot Pepper': { icon: '🌶️', label: 'Hot<br>Pepper' },
  power: { icon: '★', label: '' },                       // the pet's Power
};
function rollItem(food) {
  const fav = [].concat(player.food).includes(food);
  const back = (placeOf(player) - 1) / (RACERS.length - 1);   // 0 in front, 1 at the back
  if (Math.random() < (fav ? 0.5 : 0.1 + back * 0.25)) return 'power';
  const w = [['Banana Peel', 1.2 - back * 0.8], ['Cherry', 1], ['Hot Pepper', 0.5 + back * 0.9]];
  let k = Math.random() * w.reduce((a, [, n]) => a + n, 0);
  for (const [name, n] of w) if ((k -= n) < 0) return name;
  return 'Cherry';
}
function eat(food) {
  const favs = [].concat(player.food);
  sfx(favs.includes(food) ? 'fav' : 'snack');
  if (player.name === 'Duffy') player.nibble = 0.6;     // Speed Eating: every bite helps
  if (state !== 'race') return;
  if (!player.item) { player.item = rollItem(food); player.rollT = 0.6; }
  else if (!player.spare) { player.spare = rollItem(food); sfx(player.spare === 'power' ? 'full' : 'got'); }
}
// Tap the spare to swap it with the item in hand.
function swapItems() {
  if (state !== 'race' || !player.spare || player.rollT > 0) return;
  [player.item, player.spare] = [player.spare, player.item];
  sfx('tap');
}
const itemName = (it) => (it === 'power' ? player.power : it);

// --- the powers ------------------------------------------------------------
// The nearest kart ahead (in track points), within `reach` world units.
function nextAhead(reach) {
  const me = progressOf(player);
  let best = null, gap = (reach / TL) * N;
  for (const r of others()) {
    const d = progressOf(r) - me;
    if (d > 0 && d < gap) { gap = d; best = r; }
  }
  return best && { r: best, gap };
}

// Just ahead of the player on the road they're on.
const throwFrom = () => ({ f: player.pf + 4 * stepOf(player.path), lat: player.plat, pi: BRANCHES.indexOf(player.path) + 1 });

const BASICS = {
  'Banana Peel'() {
    const at = player.pos.clone().addScaledVector(fwdOf(player), -2.6);
    const id = newId();
    addPeel(player, id, at.x, at.z);
    send({ t: 'fx', k: 'peel', o: player.name, id, x: at.x, z: at.z });
    showPop('Peel!');
  },
  Cherry() {
    const b = { id: newId(), ...throwFrom(), latVel: 0, kind: 'cherry' };
    addBall(player, b.id, b.f, b.lat, 0, 'cherry', b.pi);
    send({ t: 'fx', k: 'ball', o: player.name, ...b });
    showPop('Cherry!');
  },
  'Hot Pepper'() {
    player.boost = Math.max(player.boost, 1.6);
    for (let k = 0; k < 8; k++) puff(player.pos.clone().setY(0.6).addScaledVector(fwdOf(player), -1.4), k % 2 ? '#e53935' : '#ff8a1c', 0.5);
    showPop('Hot hot hot!');
  },
};

const POWERS = {
  'Gaming Knockout'() {
    burstRing(player);
    send({ t: 'fx', k: 'ring', o: player.name });
    let hit = 0;
    for (const r of others()) if (r.pos.distanceTo(player.pos) < 11 && spinOut(r)) hit++;
    if (!hit) showPop('Whoosh!');
  },
  'Speed Eating'() { player.rush = 3; showPop('Sugar rush!'); },
  'Sports Ball'() {
    const at = throwFrom();
    const rel = angleTo(pathHeading(player.path, at.f), player.heading);
    const b = { id: newId(), ...at, latVel: -Math.sin(rel) * 30 };
    addBall(player, b.id, b.f, b.lat, b.latVel, 'ball', b.pi);
    send({ t: 'fx', k: 'ball', o: player.name, ...b });
    showPop('Kick!');
  },
  'Instant Cake'() {
    const at = player.pos.clone().addScaledVector(fwdOf(player), -2.6);
    const id = newId();
    addCake(player, id, at.x, at.z);
    send({ t: 'fx', k: 'cake', o: player.name, id, x: at.x, z: at.z });
    showPop('Cake!');
  },
  'Brave Mode'() { player.brave = 4; showPop('Brave!'); },
  'Math Defeater'() {
    const ahead = nextAhead(70);
    // On a branch it sets off straight from the kart rather than along the main loop.
    const off = !player.path.main;
    const p = { id: newId(), f: player.idx + 3, lat: off ? 0 : player.plat, target: ahead ? ahead.r.name : '',
      ...(off ? { x: player.pos.x, z: player.pos.z } : {}) };
    addPlus(player, p.id, p.f, p.lat, p.target, p.x, p.z);
    send({ t: 'fx', k: 'plus', o: player.name, ...p });
    showPop('1 + 1 = 2!');
  },
  'Instant Hacking'() {
    // Pop up just in front of the next kart, or a little way on if nobody's close.
    const ahead = nextAhead(50), step = N / TL;
    const to = progressOf(player) + (ahead ? ahead.gap + 5 * step : 25 * step);
    const from = player.pos.clone();
    const lat = THREE.MathUtils.clamp(player.plat, -HALF + 1.5, HALF - 1.5);
    player.lap = Math.floor(to / N) + 1;
    player.idx = Math.floor(wrap(to));
    Object.assign(player, { path: MAIN, pf: player.idx, plat: lat });
    trackPoint(to, lat, player.pos);
    player.heading = headingAt(to);
    hackFx(player, from, player.pos);
    send({ t: 'fx', k: 'hack', o: player.name, x: from.x, z: from.z, x2: player.pos.x, z2: player.pos.z });
    showPop('Hacked!');
  },
  'Mind Access'() {
    // Into the minds of the next two karts ahead: they forget they're racing.
    const me = progressOf(player), reach = (60 / TL) * N;
    const targets = others().filter((r) => { const d = progressOf(r) - me; return d > 0 && d < reach; })
      .sort((a, b) => progressOf(a) - progressOf(b)).slice(0, 2);
    mindFx(player, targets);
    send({ t: 'fx', k: 'mind', o: player.name, who: targets.map((r) => r.name) });
    let hit = 0;
    for (const r of targets) if (spinOut(r, 'Mind read!')) hit++;
    if (!hit) showPop('Hmm…');
  },
  'Fashion Shoot'() {
    flashFx(player);
    screenFlash(0.3);
    send({ t: 'fx', k: 'flash', o: player.name });
    const fwd = fwdOf(player);
    let hit = 0;
    for (const r of others()) {
      const d = r.pos.clone().sub(player.pos).setY(0);
      if (d.length() < 16 && d.dot(fwd) < 1 && spinOut(r, 'Flash!')) hit++;
    }
    if (!hit) showPop('Say cheese!');
  },
};

// Use the item in hand; the spare moves up into its place.
function usePower() {
  const it = player.item;
  if (!it || player.rollT > 0 || state !== 'race') return;
  player.item = player.spare;
  player.spare = null;
  sfx(itemName(it));
  if (it === 'power') POWERS[player.power]();
  else BASICS[it]();
}

function updateEffects(dt, t) {
  for (let k = rings.length - 1; k >= 0; k--) {
    const g = rings[k];
    g.t += dt;
    g.m.position.copy(g.owner.pos).setY(0.6);
    g.m.scale.setScalar(1 + (g.t / 0.45) * 10);
    if (g.t >= 0.45) removeFx(rings, k);
  }
  for (const pool of Object.values(puffPools)) {
    for (const p of pool.list) {
      if (p.life <= 0) continue;
      p.life -= dt;
      p.m.position.addScaledVector(p.vel, dt);
      p.m.scale.setScalar(Math.max(0.01, p.life) * 0.9);
      if (p.life <= 0) p.m.visible = false;
    }
  }
  for (const r of [player, ...friends]) {             // sugar rush and brave sparkles
    const behind = r.pos.clone().setY(0.4).addScaledVector(fwdOf(r), -1.2);
    if (r.rush > 0 && Math.random() < dt * 20) puff(behind, r.color, 0.4);
    if (r.brave > 0 && Math.random() < dt * 24) puff(behind.setY(0.4 + Math.random()), r.color, 0.5);
    if (r.drift && r.driftLv && Math.random() < dt * 40) {        // drift sparks at the back wheels
      const side = new V3(Math.cos(r.heading), 0, -Math.sin(r.heading)).multiplyScalar(Math.random() < 0.5 ? 0.8 : -0.8);
      puff(behind.clone().setY(0.25).add(side), SPARKS[r.driftLv - 1].color, 0.25);
    }
    if (r.boost > 0 && Math.random() < dt * 30) puff(behind.clone().setY(0.5), Math.random() < 0.5 ? '#ff8a1c' : '#ffcf3f', 0.3);
  }
  for (let k = balls.length - 1; k >= 0; k--) {
    const b = balls[k];
    b.life -= dt;
    b.f += b.speed * dt * stepOf(b.path);
    if (!b.path.main && b.f > b.path.n - 1) {         // off the end of a branch, onto the main loop
      b.f = b.path.to + (b.f - (b.path.n - 1)) / stepOf(b.path) * (N / TL);
      b.path = MAIN;
    }
    b.lat += b.latVel * dt;
    const edge = wallOf(b.path) - 1;
    if (Math.abs(b.lat) > edge) {                      // bounce off the hedges
      b.lat = Math.sign(b.lat) * edge;
      b.latVel *= -1;
      puff(b.m.position.clone());
    }
    b.latVel *= Math.pow(0.6, dt);
    pathPoint(b.path, b.f, b.lat, b.m.position).setY(0.6);
    if (b.cherry) b.m.rotation.y += dt * 14;
    else b.m.rotation.x += dt * 20;
    let hit = false;
    if (b.owner === player) {
      for (const r of others()) {
        if (r.pos.distanceTo(b.m.position.clone().setY(0)) < 1.8 && spinOut(r)) { hit = true; break; }
      }
    }
    if (hit || b.life <= 0) {
      if (hit) send({ t: 'gone', id: b.id });
      puff(b.m.position.clone(), b.owner.color);
      removeFx(balls, k);
    }
  }
  for (let k = peels.length - 1; k >= 0; k--) {
    // Anyone can slip on a peel, even whoever dropped it. Each iPad checks its
    // own racer; the owner checks the rivals.
    const c = peels[k];
    c.life -= dt;
    c.armed -= dt;
    let hit = false;
    if (c.armed <= 0 && state === 'race' && player.spin <= 0 && player.airY < 0.4 && player.pos.distanceTo(c.m.position) < 1.6) {
      hit = true;
      if (player.brave <= 0) { getHit('Slip!'); sfx('slip'); }
    }
    if (!hit && c.owner === player) {
      for (const r of rivals) {
        if (r.pos.distanceTo(c.m.position) < 1.6 && spinOut(r, 'Slip!')) { hit = true; break; }
      }
    }
    if (hit) { send({ t: 'gone', id: c.id }); puff(c.m.position.clone().setY(0.4), '#ffe14d'); }
    if (hit || c.life <= 0) removeFx(peels, k);
  }
  for (let k = cakes.length - 1; k >= 0; k--) {
    const c = cakes[k];
    c.life -= dt;
    c.m.rotation.y = t * 0.8;
    let eaten = false;
    if (c.owner === player) {
      for (const r of others()) {
        if (r.pos.distanceTo(c.m.position) < 1.8 && spinOut(r, 'Yum!')) { eaten = true; break; }
      }
    }
    if (eaten) send({ t: 'gone', id: c.id });
    if (eaten || c.life <= 0) removeFx(cakes, k);
  }
  for (let k = pluses.length - 1; k >= 0; k--) {
    const b = pluses[k], tg = b.target;
    b.life -= dt;
    const at = tg && tg.pos.clone().setY(0.7);
    if (at && (b.homing || b.m.position.distanceTo(at) < 14 || (rivalPath(tg) !== MAIN || (isHuman(tg) && tg.path && !tg.path.main)) && b.m.position.distanceTo(at) < 45)) {
      b.homing = true;                                  // close: straight at it
      const to = at.sub(b.m.position), len = to.length();
      if (len > 0.01) b.m.position.addScaledVector(to, Math.min(1, (44 * dt) / len));
    } else {                                            // far: follow the road
      b.f += (44 * dt / TL) * N;
      if (tg) b.lat += ((isHuman(tg) ? latOf(tg.pos, tg.idx) : tg.lat) - b.lat) * Math.min(1, dt * 2);
      trackPoint(b.f, b.lat, b.m.position).setY(0.7);
    }
    b.m.rotation.y = t * 3;
    b.m.rotation.z = t * 6;
    let hit = false;
    if (b.owner === player) {
      for (const r of others()) {
        if (r.pos.distanceTo(b.m.position.clone().setY(0)) < 1.8 && spinOut(r, 'Defeated!')) { hit = true; break; }
      }
    }
    if (hit || b.life <= 0) {
      if (hit) send({ t: 'gone', id: b.id });
      puff(b.m.position.clone(), b.owner.color);
      removeFx(pluses, k);
    }
  }
}

// ---------------------------------------------------------------------------
// Racing friends: iPads meet through PeerJS's free public server using a
// four-letter room code. Everyone connects to the host (the iPad that made the
// room), which keeps the roster, drives the rivals and passes messages along.
// ---------------------------------------------------------------------------
const ROOM_PREFIX = 'pet-racers-room-';
const CODE_LETTERS = 'ABCDEFGHJKMNPQRSTUVWXYZ';    // no I, L or O
const ROOM_SIZE = 5;                                 // iPads in one room
const net = {
  peer: null, host: false, code: '', sent: 0,
  guests: [],                  // host: { conn, id, pet, heard, p } per joined iPad
  conn: null, heard: 0,        // guest: the connection to the host
  roster: [],                  // guest: [peer id, pet name] in grid order, host first
};
const isGuest = () => !net.host && !!net.conn;
const inRoom = () => net.host ? !!net.peer : !!net.conn;
const racerNamed = (name) => RACERS.find((r) => r.name === name);

// Host: to every guest (but `except`). Guest: to the host.
function send(msg, except = null) {
  if (net.host) {
    for (const g of net.guests) if (g !== except && g.conn.open) g.conn.send(msg);
  } else if (net.conn && net.conn.open) {
    net.conn.send(msg);
  }
}

function makeRoom() {
  leaveRoom();
  net.host = true;
  net.code = [...Array(4)].map(() => CODE_LETTERS[Math.floor(Math.random() * CODE_LETTERS.length)]).join('');
  showNet('waiting');
  net.peer = new Peer(ROOM_PREFIX + net.code);
  net.peer.on('connection', acceptGuest);
  net.peer.on('error', (e) => (e.type === 'unavailable-id' ? makeRoom() : netError(e)));
}

function joinRoom(code) {
  leaveRoom();
  net.code = code;
  showNet('joining');
  net.peer = new Peer();
  net.peer.on('open', () => {
    const c = net.peer.connect(ROOM_PREFIX + code, { reliable: true });
    net.conn = c;
    c.on('open', () => { net.heard = performance.now(); send({ t: 'hello', pet: player.name }); });
    c.on('data', onHostMessage);
    c.on('close', hostLeft);
    c.on('error', hostLeft);
  });
  net.peer.on('error', netError);
}

function netError(e) {
  const msg = {
    'peer-unavailable': `There's no room called ${net.code}. Check the code and try again.`,
    busy: `That room is racing right now. Try again when they're back at the pick screen.`,
    full: `That room is full: it already has five iPads.`,
    network: "Couldn't reach the room server. Check the Wi-Fi and try again.",
  }[e.type] || (e.type === 'server-error' || e.type === 'socket-error'
    ? "Couldn't reach the room server. Check the Wi-Fi and try again."
    : 'Something went wrong connecting. Try again.');
  leaveRoom();
  showNet('error', msg);
}

function leaveRoom() {
  if (inRoom()) send({ t: 'bye' });
  for (const g of net.guests) g.conn.close();
  if (net.conn) net.conn.close();
  if (net.peer) net.peer.destroy();
  Object.assign(net, { peer: null, host: false, guests: [], conn: null, roster: [] });
  dropFriends(friends);
  updatePickUi();
}

// People who left carry on as rivals from where they are.
function dropFriends(gone) {
  gone = [...gone];
  friends = friends.filter((r) => !gone.includes(r));
  rivals = RACERS.filter((r) => !isHuman(r));
  for (const r of gone) {
    r.s = r.netS = (((r.lap - 1) * N + r.idx) / N) * TL;
    r.lat = r.netLat = THREE.MathUtils.clamp(latOf(r.pos, r.idx), -HALF + 1, HALF - 1);
    r.path = MAIN;
    r.skill = 0.9;
    r.remote = null;
  }
}

// --- host side -----------------------------------------------------------
function acceptGuest(c) {
  const g = { conn: c, id: c.peer, pet: null, heard: performance.now(), p: null };
  c.on('open', () => {
    const reason = state !== 'title' ? 'busy' : net.guests.length + 1 >= ROOM_SIZE ? 'full' : null;
    if (reason) { c.send({ t: 'no', why: reason }); setTimeout(() => c.close(), 500); return; }
    net.guests.push(g);
  });
  c.on('data', (m) => onGuestMessage(g, m));
  c.on('close', () => guestLeft(g));
  c.on('error', () => guestLeft(g));
}

const takenBy = (r, g) => r === player || net.guests.some((o) => o !== g && o.pet === r.name);

function onGuestMessage(g, m) {
  if (!net.guests.includes(g)) return;
  g.heard = performance.now();
  switch (m.t) {
    case 'hello':
    case 'pick': {
      // Two people can't race the same pet: a clash gets the first free one.
      const want = racerNamed(m.pet);
      g.pet = (want && !takenBy(want, g) ? want : RACERS.find((r) => !takenBy(r, g))).name;
      if (m.t === 'hello') showNet(null);
      updateRoster();
      break;
    }
    case 's': {
      g.p = m.p;
      const r = racerNamed(g.pet);
      if (r && friends.includes(r)) applyRemote(r, m.p);
      break;
    }
    case 'spin': onSpin(m); send(m, g); break;
    case 'fx': showFx(m); send(m, g); break;
    case 'gone': removeFxById(m.id); send(m, g); break;
    case 'bye': guestLeft(g); break;
  }
}

function updateRoster() {
  const before = friends;
  friends = net.guests.filter((g) => g.pet).map((g) => racerNamed(g.pet));
  dropFriends(before.filter((r) => !friends.includes(r)));
  rivals = RACERS.filter((r) => !isHuman(r));
  send({ t: 'roster', track: track.name, list: [[net.peer.id, player.name], ...net.guests.filter((g) => g.pet).map((g) => [g.id, g.pet])] });
  if (state === 'title') resetRace();
  updatePickUi();
}

function guestLeft(g) {
  const k = net.guests.indexOf(g);
  if (k < 0) return;
  net.guests.splice(k, 1);
  g.conn.close();
  if (g.pet && state !== 'title') showPop(`${g.pet} left`);
  updateRoster();
  if (state === 'done') finish();
}

// --- guest side ----------------------------------------------------------
function onHostMessage(m) {
  net.heard = performance.now();
  switch (m.t) {
    case 'roster': {
      const first = !net.roster.length;
      net.roster = m.list;
      loadTrack(TRACKS.find((d) => d.name === m.track) || track);
      const mine = m.list.find(([id]) => id === net.peer.id);
      if (mine && mine[1] !== player.name) setPlayer(racerNamed(mine[1]));
      const before = friends;
      friends = m.list.filter(([id]) => id !== net.peer.id).map(([, pet]) => racerNamed(pet));
      dropFriends(before.filter((r) => !friends.includes(r)));
      if (first) showNet(null);
      if (state === 'title') resetRace();
      updatePickUi();
      break;
    }
    case 'no': netError({ type: m.why }); break;
    case 'start': loadTrack(TRACKS.find((d) => d.name === m.track) || track); startRace(); break;
    case 'lobby': backToPick(); break;
    case 's':
      for (const [pet, ...p] of m.all) {
        const r = racerNamed(pet);
        if (r && friends.includes(r)) applyRemote(r, p);
      }
      for (const [name, s, lat, speed, spin, pi = 0, bs = 0, sunk = 0] of m.rv) {
        const r = racerNamed(name);
        if (!r || isHuman(r)) continue;
        const path = BRANCHES[pi - 1] || MAIN;
        if (rivalPath(r) !== path) { r.path = path; r.bs = bs; }
        if (sunk > 0 && r.sunk <= 0) sink(r, hazardAt(path, rivalF(r)));
        if (sunk <= 0 && r.sunk > 0) { r.sunk = 0; r.bs = bs; }
        Object.assign(r, { netS: s, netLat: lat, netBs: bs, speed, spin: Math.max(r.spin, spin) });
      }
      break;
    case 'spin': onSpin(m); break;
    case 'fx': showFx(m); break;
    case 'gone': removeFxById(m.id); break;
    case 'bye': hostLeft(); break;
  }
}

// The host left or the connection dropped: this iPad carries on alone,
// driving everyone else as rivals.
function hostLeft() {
  if (!net.conn) return;
  const racing = state !== 'title';
  net.conn = null;
  leaveRoom();
  if (racing) showPop('The room closed');
  if (state === 'done') finish();
}

// --- both ----------------------------------------------------------------
function applyRemote(r, [x, z, h, v, steer, lap, idx, spin, brave, rush, drift = 0, driftLv = 0, hopY = 0, boost = 0]) {
  r.remote = { x, z, h, v, at: performance.now() };
  Object.assign(r, { steer, lap, idx, brave, rush, drift, driftLv, hopY, boost, spin: Math.max(r.spin, spin) });
}

function onSpin(m) {
  if (m.who === player.name) { getHit(m.text); return; }
  const r = racerNamed(m.who);
  if (r && !isHuman(r) && drivesRivals() && r.spin <= 0) r.spin = 1.5;
}

function showFx(m) {
  const owner = racerNamed(m.o);
  if (!owner || owner === player) return;
  if (m.k === 'ring') burstRing(owner);
  if (m.k === 'ball') addBall(owner, m.id, m.f, m.lat, m.latVel, m.kind, m.pi);
  if (m.k === 'peel') addPeel(owner, m.id, m.x, m.z);
  if (m.k === 'cake') addCake(owner, m.id, m.x, m.z);
  if (m.k === 'plus') addPlus(owner, m.id, m.f, m.lat, m.target, m.x, m.z);
  if (m.k === 'hack') hackFx(owner, new V3(m.x, 0, m.z), new V3(m.x2, 0, m.z2));
  if (m.k === 'flash') flashFx(owner);
  if (m.k === 'mind') mindFx(owner, (m.who || []).map(racerNamed).filter(Boolean));
}

const myState = () => {
  const p = player;
  return [p.pos.x, p.pos.z, p.heading, p.speed, p.steer, p.lap, p.idx, p.spin, p.brave, p.rush,
    p.drift, p.driftLv, +(p.hopY + p.airY - (p.sunk > 0 ? 0.9 : 0)).toFixed(2), p.boost];
};

// About 15 times a second. Guests send where they are; the host sends where
// everyone is, rivals included.
function netTick(now) {
  if (net.host) {
    for (const g of [...net.guests]) if (now - g.heard > 6000) guestLeft(g);
  } else if (net.conn && net.conn.open && now - net.heard > 6000) {
    hostLeft();
    return;
  }
  if (!inRoom() || now - net.sent < 66) return;
  net.sent = now;
  if (!net.host) { send({ t: 's', p: myState() }); return; }
  if (!net.guests.length) return;
  const all = [[player.name, ...myState()], ...net.guests.filter((g) => g.pet && g.p).map((g) => [g.pet, ...g.p])];
  send({ t: 's', all, rv: rivals.map((r) => [r.name, r.s, r.lat, r.speed, r.spin, BRANCHES.indexOf(rivalPath(r)) + 1, r.bs, +r.sunk.toFixed(1)]) });
}

// ---------------------------------------------------------------------------
// Camera
// ---------------------------------------------------------------------------
const camPos = new V3(), camLook = new V3();
function trackCenter() {
  if (!track.center) {
    const xs = TP.map((p) => p.x), zs = TP.map((p) => p.z);
    track.center = new V3((Math.min(...xs) + Math.max(...xs)) / 2, 0, (Math.min(...zs) + Math.max(...zs)) / 2);
  }
  return track.center;
}
function updateCamera(dt, t) {
  if (state === 'title') {
    const a = (ORBIT === null ? t * 0.35 : ORBIT) + player.heading;
    let wantPos, wantLook;
    if (pickStep === 'track') {
      // High over the whole track, slowly circling. Looking at a point a bit
      // nearer than the middle keeps the track above the pick panel.
      const b = (ORBIT === null ? t * 0.08 : ORBIT);
      const c = trackCenter();
      wantPos = new V3(c.x + Math.sin(b) * 170, 165, c.z + Math.cos(b) * 170);
      wantLook = new V3(c.x + Math.sin(b) * 55, 0, c.z + Math.cos(b) * 55);
    } else {
      wantPos = new V3(player.pos.x + Math.sin(a) * 5, 2.3, player.pos.z + Math.cos(a) * 5);
      wantLook = player.pos.clone().setY(0.15);     // low, so the kart sits above the pick panel
    }
    // Glide between the two steps; otherwise stay put.
    const far = camPos.distanceTo(wantPos) > 1;
    const k = far ? 1 - Math.exp(-dt * 3) : 1;
    camPos.lerp(wantPos, k);
    camLook.lerp(wantLook, k);
    camera.position.copy(camPos);
    camera.lookAt(camLook);
    return;
  }
  const fwd = fwdOf(player);
  const wantPos = player.pos.clone().addScaledVector(fwd, -5).setY(2.6 + player.airY * 0.6);
  const wantLook = player.pos.clone().addScaledVector(fwd, 4).setY(1.2 + player.airY * 0.8);
  const k = 1 - Math.exp(-dt * 5);
  camPos.lerp(wantPos, k);
  camLook.lerp(wantLook, k);
  if (input.look && state !== 'done') {
    // Looking behind: from just in front of the kart, back down the road.
    // The chase camera keeps following, so letting go snaps straight back.
    camera.position.copy(player.pos).addScaledVector(fwd, 5).setY(2.6);
    camera.lookAt(player.pos.clone().addScaledVector(fwd, -4).setY(1.2));
    return;
  }
  camera.position.copy(camPos);
  camera.lookAt(camLook);
}

// The "Race a friend" panel.
function showNet(view, msg = '') {
  const el = $('net');

    menu: `<h2>Race friends</h2><p>Up to five iPads, all on Wi-Fi.</p>
      <button data-act="make" class="drawn">Make a room</button>
      <button data-act="join" class="drawn">Join a room</button>

      <p>Type it on the other iPads.</p><button data-act="cancel" class="drawn plain">Cancel</button>`,
    join: `<h2>Join a room</h2>
      <input id="codeIn" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABCD">
      <div><button data-act="go" class="drawn">Join</button><button data-act="close" class="drawn plain">Back</button></div>`,

$('net').addEventListener('click', (e) => {

function updateHud(dt) {
  $('hud').textContent = `Lap ${Math.min(Math.max(player.lap, 1), LAPS)}/${LAPS}  ·  ${ORDINAL[placeOf(player)]}`;

    // The item spins through the choices before it lands.

  const shown = me.rollT > 0 ? `<b>${Object.values(ITEMS)[Math.floor(me.rollT * 14) % 4].icon}</b>` : show(me.item);

// Held buttons follow the finger: sliding a thumb from ◀ to ▶, or from Go

const touches = new Map();    // pointer → the held button under it
const keysDown = new Set();
function refreshInput() {
  const touched = new Set(touches.values());
  for (const k in input) input[k] = keysDown.has(k) || touched.has(k);
  for (const el of document.querySelectorAll('[data-hold]')) el.classList.toggle('down', input[el.dataset.hold]);
}
const heldAt = (x, y) => {
  const el = document.elementFromPoint(x, y);
  const b = el && el.closest('[data-hold]');
  return b ? b.dataset.hold : null;
};
document.addEventListener('pointerdown', (e) => {
  const b = e.target.closest && e.target.closest('[data-hold]');
  if (!b) return;
  e.preventDefault();
  touches.set(e.pointerId, b.dataset.hold);
  refreshInput();
});
window.addEventListener('pointermove', (e) => {
  if (!touches.has(e.pointerId)) return;
  const k = heldAt(e.clientX, e.clientY);
  if (k !== touches.get(e.pointerId)) { touches.set(e.pointerId, k); refreshInput(); }
});
for (const ev of ['pointerup', 'pointercancel']) {
  window.addEventListener(ev, (e) => { if (touches.delete(e.pointerId)) refreshInput(); });
}

$('spare').addEventListener('pointerdown', (e) => { e.preventDefault(); swapItems(); });

const KEYS = {
  ArrowLeft: 'left', a: 'left', ArrowRight: 'right', d: 'right',
  ArrowUp: 'gas', w: 'gas', ArrowDown: 'back', s: 'back', Shift: 'hop', x: 'hop', c: 'look', q: 'look',
};
const keyOf = (e) => KEYS[e.key.length === 1 ? e.key.toLowerCase() : e.key];

  if (keyOf(e)) { keysDown.add(keyOf(e)); refreshInput(); }

    e.preventDefault();

});

  balance: () => TRACKS.flatMap((d) => { loadTrack(d); return BRANCHES.map((b, k) => ({ track: d.name, branch: k + 1,
    kind: b.gaps.length ? `${b.gaps.length} × ${b.hazard}` : `${b.padAt.length} pads`, saved: +b.saved.toFixed(2),
    risk: b.gaps.length ? +b.gaps[0].risk.toFixed(2) : 0, gap: b.gaps.length ? +b.gaps[0].len.toFixed(1) : 0 })); }),
  get player() { return player; }, get friends() { return friends; }, get rivals() { return rivals; }, get state() { return state; },
};

let saved = null;
try { saved = localStorage.getItem(PICK_KEY); } catch (e) { /* private mode */ }
pick(RACERS.find((r) => r.name === saved) || RACERS[0]);
try { saved = localStorage.getItem(TRACK_KEY); } catch (e) { saved = null; }
chooseTrack(TRACKS.find((d) => d.name === saved) || TRACKS[0]);
try { saved = localStorage.getItem(MODE_KEY); } catch (e) { saved = null; }
setPro(saved === 'pro');
setState('title');

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const t = now / 1000;

  if (state === 'countdown') {
    countdown -= dt;
    const shown = countdown > 1 ? String(Math.floor(countdown)) : 'GO!';
    if (shown !== $('big').textContent) sfx(shown === 'GO!' ? 'go' : 'count');
    $('big').textContent = shown;
    if (countdown <= 1) { setState('race'); launch(); }
  } else if (state === 'race' && countdown > 0) {
    countdown -= dt;
    if (countdown <= 0) $('big').textContent = '';
  }

  const driving = state === 'race' || state === 'done';
  if (state !== 'title') {
    updatePlayer(dt, driving);
    updateRivals(dt, driving);
  }
  updateFriends(dt);
  if (state === 'race') {
    raceTime += dt;
    if (player.lap > LAPS) finish();
  }
  syncRacers(t, dt);
  updateSnacks(dt, t);
  updateEffects(dt, t);
  updateCamera(dt, t);
  netTick(now);
  updateSound();
  if (state !== 'title') updateHud(dt);
  if (popTimer > 0) { popTimer -= dt; if (popTimer <= 0) $('pop').style.opacity = 0; }

  render(t);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
<script src="../auto-update.js"></script>
</body>
</html>
