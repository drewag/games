<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Games">
<meta name="theme-color" content="#fbf8f1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Games</title>
<style>
  :root {
    --paper: #fbf8f1; --ink: #2a2228; --soft: #6d6a70;
    --title: "Arial Black", "Arial Rounded MT Bold", Impact, system-ui, sans-serif;
    --hand: "Marker Felt", "Chalkboard SE", "Comic Sans MS", cursive;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink);
    font-family: var(--hand);
    padding: calc(24px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
  }
  h1 {
    font-family: var(--title); font-size: clamp(44px, 12vw, 80px); text-align: center;
    margin: 0 0 4px; color: #ff7eb6; letter-spacing: 0.02em;
    -webkit-text-stroke: 0.12em var(--ink); paint-order: stroke fill;
  }
  .sub { text-align: center; color: var(--soft); font-size: 22px; margin: 0 0 28px; }
  .games {
    display: grid; gap: 16px; max-width: 900px; margin: 0 auto;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr));
  }
  a.game {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding: 20px 16px; background: #fff; border: 3px solid var(--ink); border-radius: 20px;
    box-shadow: 0 5px 0 var(--ink); color: inherit; text-decoration: none;
    transition: transform 0.08s, box-shadow 0.08s;
    -webkit-tap-highlight-color: transparent;
  }
  a.game:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
  a.game canvas { width: 120px; height: 120px; image-rendering: pixelated; }
  a.game .name {
    font-family: var(--title); font-size: 30px; color: var(--c, #1e4fa3);
    -webkit-text-stroke: 0.14em var(--ink); paint-order: stroke fill;
  }
  a.game .blurb { color: var(--soft); font-size: 18px; text-align: center; }
</style>
</head>
<body>
<h1>Games</h1>
<p class="sub">Pick a game!</p>
<main class="games" id="games"></main>

<script>
// Add new games here. `icon` is pixel art, one character per square ('.' is empty).
const GAMES = [
  {
    title: 'Snack Attack',
    path: 'snack-attack/',
    blurb: 'Catch the yummy snacks. Watch out for broccoli!',
    color: '#1e4fa3',
    icon: [
      '..uu....uu..',
      '..uu....uu..',
      '.uuuuuuuuuu.',
      'uuvvvvvvvvuu',
      'uvgvvvvvvgvu',
      'uvgvvvvvvgvu',
      'uvvvvnnvvvvu',
      'uppvvvvvvppu',
      '.uuuuuuuuuu.',
      '...uuuuuu...',
      '....uuuu....',
      '....u..u....',
    ],
    palette: { u: '#4b1f8f', v: '#a58ad8', g: '#4a4a52', n: '#3a2a2a', p: '#f4a6c4' },
  },
  {
    title: 'Pet Quest',
    path: 'pet-quest/',
    blurb: 'Run, jump and find all five pets. Watch out for Bandit!',
    color: '#ff7eb6',
    icon: [
      '...ww.ww...',
      '...ww.ww...',
      '...ww.ww...',
      '...wwwww...',
      '..wwwwwww..',
      '.wwwwwwwww.',
      'wwgwwwwwgww',
      'wwgwwwwwgww',
      'wwwwwnwwwww',
      'ppwwwwwwwpp',
      '.ppwwwwwpp.',
      '...wwwww...',
      '....www....',
      '....w.w....',
    ],
    palette: { w: '#ffffff', g: '#4a4a52', n: '#3a2a2a', p: '#f4a6c4' },
  },
  {
    title: 'Pet Racers',
    path: 'pet-racers/',
    blurb: 'Race the pets in their food karts. Use your power!',
    color: '#e2483b',
    icon: [
      'bbb......bbb',
      'bbbbbbbbbbbb',
      'bbbbbbbbbbbb',
      'bbbgbbbbgbbb',
      'bbbgbbbbgbbb',
      'pttttnnttttp',
      'ppttttttttpp',
      '.pttttttttp.',
      '...tttttt...',
      '...tttttt...',
      '...tt..tt...',
    ],
    palette: { b: '#6b3a1e', t: '#efa632', g: '#a3a3ad', n: '#3a2a2a', p: '#f4a6c4' },
  },
];

function drawIcon(canvas, rows, palette) {
  const px = 10, ow = 2;
  const w = Math.max(...rows.map(r => r.length)), h = rows.length;
  const size = Math.max(w, h) * px + ow * 2;
  canvas.width = canvas.height = size;
  const x = canvas.getContext('2d');
  const ox = (size - w * px) / 2 - ow, oy = (size - h * px) / 2 - ow;
  const each = (fn) => rows.forEach((r, j) => [...r].forEach((ch, i) => { if (ch !== '.') fn(ch, i, j); }));
  x.fillStyle = '#2a2228';
  each((ch, i, j) => x.fillRect(ox + i * px, oy + j * px, px + ow * 2, px + ow * 2));
  each((ch, i, j) => { x.fillStyle = palette[ch]; x.fillRect(ox + ow + i * px, oy + ow + j * px, px, px); });
}

const list = document.getElementById('games');
for (const g of GAMES) {
  const a = document.createElement('a');
  a.className = 'game';
  a.href = g.path;
  a.style.setProperty('--c', g.color);
  const c = document.createElement('canvas');
  drawIcon(c, g.icon, g.palette);
  const name = document.createElement('div');
  name.className = 'name';
  name.textContent = g.title;
  const blurb = document.createElement('div');
  blurb.className = 'blurb';
  blurb.textContent = g.blurb;
  a.append(c, name, blurb);
  list.append(a);
}
</script>
<script src="auto-update.js"></script>
</body>
</html>
